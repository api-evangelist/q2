name: Q2

description: Q2 Holdings is a financial services software company that provides digital banking, lending, and embedded finance solutions to banks,
  credit unions, and fintechs. Its embedded finance platform, Helix by Q2 (formerly CorePro / Cambr), exposes a REST API that lets developers
  incorporate real, FDIC-insured savings and checking accounts, cards, transfers, and ACH into their own applications. The Helix API covers account,
  customer, card, external-account, transfer, transaction, statement, and program management, with a real-time Events Bus, SFTP batch files, and
  an administrative web application. Q2 serves over 1,000 financial institutions and 10M+ digital banking end users.

