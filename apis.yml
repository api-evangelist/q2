apis:
- name: Helix by Q2 API
  description: >-
    The Helix by Q2 REST API lets developers incorporate real FDIC-insured
    savings and/or checking accounts into their applications, including
    accounts, customers (individual and business), cards, card controls,
    external accounts, transfers, ACH, wires, transactions, statements, fees,
    and programs. Authentication is HTTP Basic (API Key + Secret). A real-time
    Events Bus delivers account, card, check, and fraud events. JSON only.
  humanURL: https://docs.helix.q2.com
