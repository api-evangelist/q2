openapi: 3.2.0
info:
  title: Helix Customer Document API
  version: 3.0.0
  description: Helix Public API (no customer KYC/IDV). **This spec covers all of Helix 3.x and is subject to change at any time.**
servers:
- url: https://sandbox-api.helix.q2.com
  description: Sandbox server
- url: https://api.helix.q2.com
  description: Production server
security:
- basicAuth: []
tags:
- name: Customer Document
  description: Endpoints for the customerDocument object
paths:
  /customerDocument/get/{customerId}/{documentId}:
    get:
      tags:
      - Customer Document
      summary: Get a customer document
      description: Retrieve a customer document by the given `customerId` and `documentId`.
      externalDocs:
        url: https://docs.helix.q2.com/reference/customerdocumentget
      operationId: customerDocumentGet
      parameters:
      - $ref: '#/components/parameters/CustomerIdPath'
      - $ref: '#/components/parameters/DocumentIdPath'
      responses:
        '200':
          description: An <a href="https://docs.helix.q2.com/reference/response-format" target="_blank">envelope</a> whose data node is a <a href="https://docs.helix.q2.com/docs/customer-document" target="_blank">customerDocument</a> object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerDocumentObject200Response'
        '400':
          $ref: '#/paths/~1card~1lock/post/responses/400'
        '401':
          $ref: '#/paths/~1card~1lock/post/responses/401'
        '404':
          $ref: '#/paths/~1card~1lock/post/responses/404'
        '405':
          $ref: '#/paths/~1card~1lock/post/responses/405'
        '429':
          $ref: '#/paths/~1card~1lock/post/responses/429'
  /customerDocument/list/{customerId}:
    get:
      tags:
      - Customer Document
      summary: List customer documents
      description: Retrieve all documents for the given `customerId`.
      externalDocs:
        url: https://docs.helix.q2.com/reference/customerdocumentlist
      operationId: customerDocumentList
      parameters:
      - $ref: '#/components/parameters/CustomerIdPath'
      responses:
        '200':
          description: An array of <a href="https://docs.helix.q2.com/docs/customer-document" target="_blank">customerDocument</a> objects
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerDocumentArray200Response'
        '400':
          $ref: '#/paths/~1card~1lock/post/responses/400'
        '401':
          $ref: '#/paths/~1card~1lock/post/responses/401'
        '404':
          $ref: '#/paths/~1card~1lock/post/responses/404'
        '405':
          $ref: '#/paths/~1card~1lock/post/responses/405'
        '429':
          $ref: '#/paths/~1card~1lock/post/responses/429'
  /customerDocument/updateStatus:
    post:
      tags:
      - Customer Document
      summary: Update customer document status
      description: Update the status of a customer document by the given `customerId` and `documentId`.
      externalDocs:
        url: https://docs.helix.q2.com/reference/customerdocumentupdatestatus
      operationId: customerDocumentUpdateStatus
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - customerId
              - documentId
              - customerDocumentStatusType
              properties:
                customerId:
                  $ref: '#/components/schemas/HelixId'
                documentId:
                  $ref: '#/components/schemas/HelixId'
                customerDocumentStatusType:
                  $ref: '#/components/schemas/CustomerDocumentUpdateStatus200Response/allOf/1/properties/data/properties/customerDocumentStatusType'
      responses:
        '200':
          description: The `customerId`, `documentId`, and `customerDocumentStatusType`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerDocumentUpdateStatus200Response'
        '400':
          $ref: '#/paths/~1card~1lock/post/responses/400'
        '401':
          $ref: '#/paths/~1card~1lock/post/responses/401'
        '404':
          $ref: '#/paths/~1card~1lock/post/responses/404'
        '405':
          $ref: '#/paths/~1card~1lock/post/responses/405'
        '429':
          $ref: '#/paths/~1card~1lock/post/responses/429'
  /customerDocument/upload:
    post:
      tags:
      - Customer Document
      summary: Upload a customer document
      description: Upload a document on behalf of a customer. See customerDocument object definition for parameter details.
      externalDocs:
        url: https://docs.helix.q2.com/reference/customerdocumentupload
      operationId: customerDocumentUpload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - customerId
              - documentType
              - reasonType
              - documentName
              - documentContent
              properties:
                customerId:
                  $ref: '#/components/schemas/HelixId'
                customField1:
                  type: string
                  maxLength: 50
                customField2:
                  type: string
                  maxLength: 50
                customField3:
                  type: string
                  maxLength: 50
                customField4:
                  type: string
                  maxLength: 50
                customField5:
                  type: string
                  maxLength: 50
                documentContent:
                  type: string
                  format: byte
                  writeOnly: true
                documentName:
                  type: string
                  maxLength: 50
                documentType:
                  type: string
                  enum:
                  - DriversLicense
                  - UtilityBill
                  - BankStatement
                  - NameChangeAffidavit
                  - WrittenStatementOfUnauthorizedDebit
                  - Unspecified
                  - VerificationSummary
                  - DisputeDocumentation
                  - HoldNotice
                  - DriversLicenseBack
                  - PassportFront
                  - PassportBack
                  - UnspecifiedIdCardFront
                  - UnspecifiedIdCardBack
                  - SelfPortrait
                  - DBAStatementOfFiling
                  - FictitiousBusinessName
                  - BusinessLicenseShowingCurrent
                  - AttestationDocument
                  - CertificateOfPartnership
                  - PartnershipAgreement
                  - ProofOfAddress
                  - ArticlesOfOrganization
                  - CertificateOfFormation
                  - CertificateOfOrganization
                  - SecretaryOfStateRegistration
                  - ProofOfGoodStanding
                  - CorporateAuthorization
                  - EINLetter
                  - ArticlesOfIncorporation
                  - Charter
                  - TrustDocuments
                  - CurrentSecretaryOfStateRegistration
                  - CourtDocuments
                  - TrustCertificate
                  - BirthCertificate
                  - SocialSecurityCardFront
                  - SocialSecurityCardBack
                  - SchoolIDFront
                  - SchoolIDBack
                  - DeathCertificate
                  - PowerOfAttorney
                  - ProofOfAuthorization
                reasonType:
                  type: string
                  enum:
                  - NameChange
                  - AddressChange
                  - RequestForNewExternalAccount
                  - Unspecified
                  - ManualReview
                  - ReturnOnTransaction
                  - VerificationSummary
                  - DisputeDocumentation
                  - HoldPlaced
                  - AutomatedReview
                  - Remediation Document
                tag:
                  $ref: '#/components/schemas/TagProperty'
      responses:
        '200':
          description: An <a href="https://docs.helix.q2.com/reference/response-format" target="_blank">envelope</a> whose data node is a <a href="https://docs.helix.q2.com/docs/customer-document" target="_blank">customerDocument</a> object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerDocumentObject200Response'
        '400':
          $ref: '#/paths/~1card~1lock/post/responses/400'
        '401':
          $ref: '#/paths/~1card~1lock/post/responses/401'
        '404':
          $ref: '#/paths/~1card~1lock/post/responses/404'
        '405':
          $ref: '#/paths/~1card~1lock/post/responses/405'
        '429':
          $ref: '#/paths/~1card~1lock/post/responses/429'
components:
  schemas:
    CardArray200Response:
      allOf:
      - type: object
        properties:
          errors:
            type: array
            items: {}
            example: []
          requestId:
            type: string
            example: 1249a3bf-aca1-40dd-9fba-2a3193550c39
          status:
            type: integer
            enum:
            - 200
          throttle:
            type: object
            properties:
              periodEndsAt:
                $ref: '#/components/schemas/CustomerSetLastContact200Response/allOf/1/properties/data/items/properties/lastContactDate'
              periodLengthInSeconds:
                $ref: '#/components/schemas/HelixId'
              periodRequestLimit:
                $ref: '#/components/schemas/HelixId'
              requestsRemainingInPeriod:
                $ref: '#/components/schemas/HelixId'
              warningThreshold:
                type: number
                format: decimal
                example: 0.2
      - type: object
        properties:
          data:
            type: array
            items:
              $ref: '#/components/schemas/CardObject200Response/allOf/1/properties/data'
    CustomerDocumentUploadRequest:
      type: object
      required:
      - customerId
      - documentType
      - reasonType
      - documentName
      - documentContent
      properties:
        customerId:
          $ref: '#/components/schemas/HelixId'
        customField1:
          type: string
          maxLength: 50
        customField2:
          type: string
          maxLength: 50
        customField3:
          type: string
          maxLength: 50
        customField4:
          type: string
          maxLength: 50
        customField5:
          type: string
          maxLength: 50
        documentContent:
          type: string
          format: byte
          writeOnly: true
        documentName:
          type: string
          maxLength: 50
        documentType:
          type: string
          enum:
          - DriversLicense
          - UtilityBill
          - BankStatement
          - NameChangeAffidavit
          - WrittenStatementOfUnauthorizedDebit
          - Unspecified
          - VerificationSummary
          - DisputeDocumentation
          - HoldNotice
          - DriversLicenseBack
          - PassportFront
          - PassportBack
          - UnspecifiedIdCardFront
          - UnspecifiedIdCardBack
          - SelfPortrait
          - DBAStatementOfFiling
          - FictitiousBusinessName
          - BusinessLicenseShowingCurrent
          - AttestationDocument
          - CertificateOfPartnership
          - PartnershipAgreement
          - ProofOfAddress
          - ArticlesOfOrganization
          - CertificateOfFormation
          - CertificateOfOrganization
          - SecretaryOfStateRegistration
          - ProofOfGoodStanding
          - CorporateAuthorization
          - EINLetter
          - ArticlesOfIncorporation
          - Charter
          - TrustDocuments
          - CurrentSecretaryOfStateRegistration
          - CourtDocuments
          - TrustCertificate
          - BirthCertificate
          - SocialSecurityCardFront
          - SocialSecurityCardBack
          - SchoolIDFront
          - SchoolIDBack
          - DeathCertificate
          - PowerOfAttorney
          - ProofOfAuthorization
        reasonType:
          type: string
          enum:
          - NameChange
          - AddressChange
          - RequestForNewExternalAccount
          - Unspecified
          - ManualReview
          - ReturnOnTransaction
          - VerificationSummary
          - DisputeDocumentation
          - HoldPlaced
          - AutomatedReview
          - Remediation Document
        tag:
          $ref: '#/components/schemas/TagProperty'
    CustomerSetLastContact200Response:
      allOf:
      - $ref: '#/components/schemas/CardArray200Response/allOf/0'
      - type: object
        properties:
          data:
            type: array
            items:
              type: object
              properties:
                customerId:
                  $ref: '#/components/schemas/HelixId'
                dormancyStatus:
                  type: string
                  enum:
                  - Active
                  - Inactive
                  - Dormant
                lastContactDate:
                  type: string
                  format: date-time
                  example: '2021-01-07T19:00:59.761-06:00'
                lastContactType:
                  $ref: '#/components/schemas/LastContactType'
    CustomerDocumentUpdateStatus200Response:
      allOf:
      - $ref: '#/components/schemas/CardArray200Response/allOf/0'
      - type: object
        properties:
          data:
            type: object
            properties:
              customerId:
                $ref: '#/components/schemas/HelixId'
              documentId:
                $ref: '#/components/schemas/HelixId'
              customerDocumentStatusType:
                type: string
                enum:
                - InReview
                - Accepted
                - Rejected
    CustomerDocumentArray200Response:
      allOf:
      - $ref: '#/components/schemas/CardArray200Response/allOf/0'
      - type: object
        properties:
          data:
            type: array
            items:
              $ref: '#/components/schemas/CustomerDocumentObject200Response/allOf/1/properties/data'
    CustomerDocumentObject200Response:
      allOf:
      - $ref: '#/components/schemas/CardArray200Response/allOf/0'
      - type: object
        properties:
          data:
            allOf:
            - type: object
              properties:
                documentId:
                  $ref: '#/components/schemas/HelixId'
                downloadUrl:
                  type: string
            - $ref: '#/components/schemas/CustomerDocumentUploadRequest'
    TagProperty:
      type: string
      maxLength: 50
    HelixId:
      type: integer
      format: int32
      minimum: 1
  parameters:
    DocumentIdPath:
      name: documentId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/HelixId'
    CustomerIdPath:
      name: customerId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/HelixId'
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
