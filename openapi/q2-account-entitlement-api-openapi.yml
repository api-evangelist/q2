openapi: 3.2.0
info:
  title: Helix Account - Entitlement API
  version: 3.0.0
  description: Helix Public API (no customer KYC/IDV). **This spec covers all of Helix 3.x and is subject to change at any time.**
servers:
- url: https://sandbox-api.helix.q2.com
  description: Sandbox server
- url: https://api.helix.q2.com
  description: Production server
security:
- basicAuth: []
tags:
- name: Account - Entitlement
  description: Endpoints related to account entitlements
paths:
  /account/addEntitlement:
    post:
      tags:
      - Account - Entitlement
      summary: Add an entitlement
      description: Grant business account access to a customer related to the business.
      externalDocs:
        url: https://docs.helix.q2.com/reference/accountaddentitlement
      operationId: accountAddEntitlement
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - accountId
              - requestingCustomerId
              - targetCustomerId
              - entitlement
              properties:
                accountId:
                  $ref: '#/components/schemas/HelixId'
                requestingCustomerId:
                  allOf:
                  - description: The helix-assigned unique ID for the customer requesting to add an entitlement
                  - $ref: '#/components/schemas/HelixId'
                targetCustomerId:
                  allOf:
                  - description: The helix-assigned unique ID for the customer being granted an entitlement
                  - $ref: '#/components/schemas/HelixId'
                entitlement:
                  $ref: '#/components/schemas/AccountAddEditEntitlement200Response/allOf/1/properties/data/properties/entitlement'
      responses:
        '200':
          description: A confirmation the entitlement has been added.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountAddEditEntitlement200Response'
        '400':
          $ref: '#/paths/~1card~1lock/post/responses/400'
        '401':
          $ref: '#/paths/~1card~1lock/post/responses/401'
        '404':
          $ref: '#/paths/~1card~1lock/post/responses/404'
        '405':
          $ref: '#/paths/~1card~1lock/post/responses/405'
        '429':
          $ref: '#/paths/~1card~1lock/post/responses/429'
  /account/editEntitlement:
    post:
      tags:
      - Account - Entitlement
      summary: Edit an entitlement
      description: Edit existing business account access for a customer related to the business.
      externalDocs:
        url: https://docs.helix.q2.com/reference/accounteditentitlement
      operationId: accountEditEntitlement
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - accountId
              - requestingCustomerId
              - targetCustomerId
              - entitlement
              properties:
                accountId:
                  $ref: '#/components/schemas/HelixId'
                requestingCustomerId:
                  allOf:
                  - description: The helix-assigned unique ID for the customer requesting to edit an entitlement
                  - $ref: '#/components/schemas/HelixId'
                targetCustomerId:
                  allOf:
                  - description: The helix-assigned unique ID for the customer whose entitlement is being edited
                  - $ref: '#/components/schemas/HelixId'
                entitlement:
                  $ref: '#/components/schemas/AccountAddEditEntitlement200Response/allOf/1/properties/data/properties/entitlement'
      responses:
        '200':
          description: A confirmation the entitlement has been edited.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountAddEditEntitlement200Response'
        '400':
          $ref: '#/paths/~1card~1lock/post/responses/400'
        '401':
          $ref: '#/paths/~1card~1lock/post/responses/401'
        '404':
          $ref: '#/paths/~1card~1lock/post/responses/404'
        '405':
          $ref: '#/paths/~1card~1lock/post/responses/405'
        '429':
          $ref: '#/paths/~1card~1lock/post/responses/429'
  /account/listEntitlements/{customerId}/{accountId}:
    get:
      tags:
      - Account - Entitlement
      summary: List Entitlements
      description: Retrieve all entitlements for a business account.
      externalDocs:
        url: https://docs.helix.q2.com/reference/accountlistentitlements
      operationId: accountListEntitlements
      parameters:
      - $ref: '#/components/parameters/CustomerIdPath'
      - $ref: '#/components/parameters/AccountIdPath'
      - name: includeInactive
        in: query
        required: false
        schema:
          type: boolean
          default: false
      responses:
        '200':
          description: An array of <a href="https://docs.helix.q2.com/docs/account-entitlement" target="_blank">accountEntitlement</a> objects
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountEntitlementArray200Response'
        '400':
          $ref: '#/paths/~1card~1lock/post/responses/400'
        '401':
          $ref: '#/paths/~1card~1lock/post/responses/401'
        '404':
          $ref: '#/paths/~1card~1lock/post/responses/404'
        '405':
          $ref: '#/paths/~1card~1lock/post/responses/405'
        '429':
          $ref: '#/paths/~1card~1lock/post/responses/429'
  /account/removeEntitlement:
    post:
      tags:
      - Account - Entitlement
      summary: Remove an entitlement
      description: Remove a customer's access to a business account.
      externalDocs:
        url: https://docs.helix.q2.com/reference/accountremoveentitlement
      operationId: accountRemoveEntitlement
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - accountId
              - requestingCustomerId
              - targetCustomerId
              properties:
                accountId:
                  $ref: '#/components/schemas/HelixId'
                requestingCustomerId:
                  allOf:
                  - description: The helix-assigned unique ID for the customer requesting to remove an entitlement
                  - $ref: '#/components/schemas/HelixId'
                targetCustomerId:
                  allOf:
                  - description: The helix-assigned unique ID for the customer whose entitlement is being removed
                  - $ref: '#/components/schemas/HelixId'
      responses:
        '200':
          description: A 200 status with no `data` property present
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardArray200Response/allOf/0'
        '400':
          $ref: '#/paths/~1card~1lock/post/responses/400'
        '401':
          $ref: '#/paths/~1card~1lock/post/responses/401'
        '404':
          $ref: '#/paths/~1card~1lock/post/responses/404'
        '405':
          $ref: '#/paths/~1card~1lock/post/responses/405'
        '429':
          $ref: '#/paths/~1card~1lock/post/responses/429'
components:
  schemas:
    CardArray200Response:
      allOf:
      - type: object
        properties:
          errors:
            type: array
            items: {}
            example: []
          requestId:
            type: string
            example: 1249a3bf-aca1-40dd-9fba-2a3193550c39
          status:
            type: integer
            enum:
            - 200
          throttle:
            type: object
            properties:
              periodEndsAt:
                $ref: '#/components/schemas/CustomerSetLastContact200Response/allOf/1/properties/data/items/properties/lastContactDate'
              periodLengthInSeconds:
                $ref: '#/components/schemas/HelixId'
              periodRequestLimit:
                $ref: '#/components/schemas/HelixId'
              requestsRemainingInPeriod:
                $ref: '#/components/schemas/HelixId'
              warningThreshold:
                type: number
                format: decimal
                example: 0.2
      - type: object
        properties:
          data:
            type: array
            items:
              $ref: '#/components/schemas/CardObject200Response/allOf/1/properties/data'
    AccountEntitlementArray200Response:
      allOf:
      - $ref: '#/components/schemas/CardArray200Response/allOf/0'
      - type: object
        properties:
          data:
            type: array
            items:
              type: object
              properties:
                businessCustomerId:
                  $ref: '#/components/schemas/HelixId'
                accountId:
                  $ref: '#/components/schemas/HelixId'
                customerId:
                  $ref: '#/components/schemas/HelixId'
                entitlement:
                  $ref: '#/components/schemas/AccountAddEditEntitlement200Response/allOf/1/properties/data/properties/entitlement'
                effectiveDate:
                  $ref: '#/components/schemas/CustomerSetLastContact200Response/allOf/1/properties/data/items/properties/lastContactDate'
                firstName:
                  type: string
                lastName:
                  type: string
                businessLegalName:
                  type: string
                doingBusinessAs:
                  type: string
                legalName1:
                  type: string
                legalName2:
                  type: string
                isControlPerson:
                  type: boolean
                isPrimaryContact:
                  type: boolean
    CustomerSetLastContact200Response:
      allOf:
      - $ref: '#/components/schemas/CardArray200Response/allOf/0'
      - type: object
        properties:
          data:
            type: array
            items:
              type: object
              properties:
                customerId:
                  $ref: '#/components/schemas/HelixId'
                dormancyStatus:
                  type: string
                  enum:
                  - Active
                  - Inactive
                  - Dormant
                lastContactDate:
                  type: string
                  format: date-time
                  example: '2021-01-07T19:00:59.761-06:00'
                lastContactType:
                  $ref: '#/components/schemas/LastContactType'
    AccountAddEditEntitlement200Response:
      allOf:
      - $ref: '#/components/schemas/CardArray200Response/allOf/0'
      - type: object
        properties:
          data:
            type: object
            properties:
              accountId:
                $ref: '#/components/schemas/HelixId'
              businessCustomerId:
                $ref: '#/components/schemas/HelixId'
              entitlement:
                type: string
                enum:
                - FULL
                - RDONLY
                - RDDB
                - RDCR
                description: '`FULL`: Full

                  `RDONLY`: Read-only

                  `RDDB`: Debit and read

                  `RDCR`: Credit and read

                  `DBONLY`: Debit only

                  `CRONLY`: Credit only

                  '
              requestingCustomerId:
                $ref: '#/components/schemas/HelixId'
              targetCustomerId:
                $ref: '#/components/schemas/HelixId'
    HelixId:
      type: integer
      format: int32
      minimum: 1
  parameters:
    CustomerIdPath:
      name: customerId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/HelixId'
    AccountIdPath:
      name: accountId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/HelixId'
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
