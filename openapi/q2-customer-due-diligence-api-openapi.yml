                    type: object
                    properties:
                      questionId:
                        $ref: '#/components/schemas/AccountClose200Response/allOf/1/properties/data/properties/transactionId'
                      questionName:
                        type: string
                        maxLength: 100
                      questionDescription:
                        type: string
                        maxLength: 255
                      answerType:
                        type: string
                        maxLength: 50
                        enum:
