openapi: 3.2.0
info:
  title: Helix Customer - Due Diligence API
  version: 3.0.0
  description: Helix Public API (no customer KYC/IDV). **This spec covers all of Helix 3.x and is subject to change at any time.**
servers:
- url: https://sandbox-api.helix.q2.com
  description: Sandbox server
- url: https://api.helix.q2.com
  description: Production server
security:
- basicAuth: []
tags:
- name: Customer - Due Diligence
  description: Endpoints related to customer due diligence
paths:
  /customer/answerList/{customerId}:
    get:
      tags:
      - Customer - Due Diligence
      summary: List a customer's due diligence responses
      description: Retrieve all due diligence answers for the given `customerId`.
      externalDocs:
        url: https://docs.helix.q2.com/reference/customer/answerlist
      operationId: customer/answerList
      parameters:
      - $ref: '#/components/parameters/CustomerIdPath'
      responses:
        '200':
          description: An array of <a href="https://docs.helix.q2.com/docs/due-diligence-category" target="_blank">dueDiligenceCategory</a> objects
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerAnswerList200Response'
        '400':
          $ref: '#/paths/~1card~1lock/post/responses/400'
        '401':
          $ref: '#/paths/~1card~1lock/post/responses/401'
        '404':
          $ref: '#/paths/~1card~1lock/post/responses/404'
        '405':
          $ref: '#/paths/~1card~1lock/post/responses/405'
        '429':
          $ref: '#/paths/~1card~1lock/post/responses/429'
  /customer/answerPost:
    post:
      tags:
      - Customer - Due Diligence
      summary: Submit a customer's due diligence answers
      description: Create or update due diligence answers for the given `customerId`.
      externalDocs:
        url: https://docs.helix.q2.com/reference/customeranswerpost
      operationId: customerAnswerPost
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - customerId
              - answers
              properties:
                customerId:
                  $ref: '#/components/schemas/HelixId'
                answers:
                  type: array
                  items:
                    type: object
                    required:
                    - questionId
                    properties:
                      answeredDate:
                        $ref: '#/components/schemas/CustomerSetLastContact200Response/allOf/1/properties/data/items/properties/lastContactDate'
                      questionId:
                        $ref: '#/components/schemas/AccountClose200Response/allOf/1/properties/data/properties/transactionId'
                      questionAnswer:
                        format: string
                        maxLength: 255
                      selectedChoices:
                        type: array
                        items:
                          type: object
                          properties:
                            choiceId:
                              allOf:
                              - description: Required if `choiceName` not present
                              - $ref: '#/components/schemas/AccountClose200Response/allOf/1/properties/data/properties/transactionId'
                            choiceName:
                              type: string
                              description: Required if `choiceId` not present
                  description: An array of <a href="https://docs.helix.q2.com/docs/due-diligence-answer" target="_blank">dueDiligenceAnswer</a> objects
      responses:
        '200':
          description: A 200 status with no `data` property present
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardArray200Response/allOf/0'
        '400':
          $ref: '#/paths/~1card~1lock/post/responses/400'
        '401':
          $ref: '#/paths/~1card~1lock/post/responses/401'
        '404':
          $ref: '#/paths/~1card~1lock/post/responses/404'
        '405':
          $ref: '#/paths/~1card~1lock/post/responses/405'
        '429':
          $ref: '#/paths/~1card~1lock/post/responses/429'
  /customer/securityanswerslist:
    post:
      tags:
      - Customer - Due Diligence
      summary: Retrieves the list of security answers for a customer in a specified language
      description: See customerSecurityAnswerInfo object definition for parameter details.
      externalDocs:
        url: https://docs.helix.q2.com/reference/customersecurityanswerslist
      operationId: customersecurityanswerslist
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - customerId
              properties:
                customerId:
                  $ref: '#/components/schemas/HelixId'
                culture:
                  $ref: '#/components/schemas/CultureProperty'
      responses:
        '200':
          description: An array of <a href="https://https://docs.helix.q2.com/docs/customer-security-answer" target="_blank">customerSecurityAnswerInfo</a> objects.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerObject200Response'
        '400':
          $ref: '#/paths/~1card~1lock/post/responses/400'
        '401':
          $ref: '#/paths/~1card~1lock/post/responses/401'
        '404':
          $ref: '#/paths/~1card~1lock/post/responses/404'
        '405':
          $ref: '#/paths/~1card~1lock/post/responses/405'
        '429':
          $ref: '#/paths/~1card~1lock/post/responses/429'
