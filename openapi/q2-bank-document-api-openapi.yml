openapi: 3.2.0
info:
  title: Helix Bank Document API
  version: 3.0.0
  description: Helix Public API (no customer KYC/IDV). **This spec covers all of Helix 3.x and is subject to change at any time.**
servers:
- url: https://sandbox-api.helix.q2.com
  description: Sandbox server
- url: https://api.helix.q2.com
  description: Production server
security:
- basicAuth: []
tags:
- name: Bank Document
  description: Endpoints for the bankDocument object
paths:
  /bankDocument/download/{culture}/{documentId}:
    get:
      tags:
      - Bank Document
      summary: Download a bank document
      description: Retrieve fileContent for the given `culture` and `documentId`.
      externalDocs:
        url: https://docs.helix.q2.com/reference/bankdocumentdownload
      operationId: bankDocumentDownload
      parameters:
      - $ref: '#/components/parameters/CulturePath'
      - name: documentId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/HelixId'
      responses:
        '200':
          description: A <a href="https://docs.helix.q2.com/docs/file-content" target="_blank">fileContent</a> object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileContentObject200Response'
        '400':
          $ref: '#/paths/~1card~1lock/post/responses/400'
        '401':
          $ref: '#/paths/~1card~1lock/post/responses/401'
        '404':
          $ref: '#/paths/~1card~1lock/post/responses/404'
        '405':
          $ref: '#/paths/~1card~1lock/post/responses/405'
        '429':
          $ref: '#/paths/~1card~1lock/post/responses/429'
  /bankDocument/list/{culture}:
    get:
      tags:
      - Bank Document
      summary: List bank documents
      description: Retrieve a list of all bank documents for the given `culture`.
      externalDocs:
        url: https://docs.helix.q2.com/reference/bankdocumentlist
      operationId: bankDocumentList
      parameters:
      - name: culture
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/CultureProperty'
      responses:
        '200':
          description: An array of <a href="https://docs.helix.q2.com/docs/bank-document" target="_blank">bankDocument</a> objects
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BankDocumentArray200Response'
        '400':
          $ref: '#/paths/~1card~1lock/post/responses/400'
        '401':
          $ref: '#/paths/~1card~1lock/post/responses/401'
        '404':
          $ref: '#/paths/~1card~1lock/post/responses/404'
        '405':
          $ref: '#/paths/~1card~1lock/post/responses/405'
        '429':
          $ref: '#/paths/~1card~1lock/post/responses/429'
components:
  schemas:
    CardArray200Response:
      allOf:
      - type: object
        properties:
          errors:
            type: array
            items: {}
            example: []
          requestId:
            type: string
            example: 1249a3bf-aca1-40dd-9fba-2a3193550c39
          status:
            type: integer
            enum:
            - 200
          throttle:
            type: object
            properties:
              periodEndsAt:
                $ref: '#/components/schemas/CustomerSetLastContact200Response/allOf/1/properties/data/items/properties/lastContactDate'
              periodLengthInSeconds:
                $ref: '#/components/schemas/HelixId'
              periodRequestLimit:
                $ref: '#/components/schemas/HelixId'
              requestsRemainingInPeriod:
                $ref: '#/components/schemas/HelixId'
              warningThreshold:
                type: number
                format: decimal
                example: 0.2
      - type: object
        properties:
          data:
            type: array
            items:
              $ref: '#/components/schemas/CardObject200Response/allOf/1/properties/data'
    AccountClose200Response:
      allOf:
      - $ref: '#/components/schemas/CardArray200Response/allOf/0'
      - type: object
        properties:
          data:
            type: object
            properties:
              customerId:
                $ref: '#/components/schemas/HelixId'
              accountId:
                $ref: '#/components/schemas/HelixId'
              closeToAccountId:
                $ref: '#/components/schemas/HelixId'
              transactionId:
                type: integer
                format: int64
                minimum: 1
              transactionTag:
                $ref: '#/components/schemas/TagProperty'
              closingBalanceAmount:
                type: number
                format: decimal
              interestPaidAmount:
                type: number
                format: decimal
              totalClosingAmount:
                type: number
                format: decimal
              isClosedToExternalAccount:
                type: boolean
    FileContentObject200Response:
      allOf:
      - $ref: '#/components/schemas/CardArray200Response/allOf/0'
      - type: object
        properties:
          data:
            type: object
            properties:
              content:
                type: string
                format: byte
              contentLength:
                $ref: '#/components/schemas/AccountClose200Response/allOf/1/properties/data/properties/transactionId'
              contentType:
                type: string
    CustomerSetLastContact200Response:
      allOf:
      - $ref: '#/components/schemas/CardArray200Response/allOf/0'
      - type: object
        properties:
          data:
            type: array
            items:
              type: object
              properties:
                customerId:
                  $ref: '#/components/schemas/HelixId'
                dormancyStatus:
                  type: string
                  enum:
                  - Active
                  - Inactive
                  - Dormant
                lastContactDate:
                  type: string
                  format: date-time
                  example: '2021-01-07T19:00:59.761-06:00'
                lastContactType:
                  $ref: '#/components/schemas/LastContactType'
    BankDocumentArray200Response:
      allOf:
      - $ref: '#/components/schemas/CardArray200Response/allOf/0'
      - type: object
        properties:
          data:
            type: array
            items:
              type: object
              properties:
                bankId:
                  $ref: '#/components/schemas/HelixId'
                culture:
                  $ref: '#/components/schemas/CultureProperty'
                customerId:
                  allOf:
                  - deprecated: true
                  - $ref: '#/components/schemas/HelixId'
                documentId:
                  $ref: '#/components/schemas/HelixId'
                documentType:
                  type: string
                  enum:
                  - TermsAndConditions
                  - PrivacyPolicy
                  - TruthInSavings
                  - eStatement
                  - ConsumerDepositAgreement
                  - FeeSchedule
                  - ReferAFriend
                  - EftInfo
                  - ProductInfo
                  - CardInfo
                  - FeeDisclosure
                downloadUrl:
                  type: string
                effectiveDate:
                  $ref: '#/components/schemas/CustomerSetLastContact200Response/allOf/1/properties/data/items/properties/lastContactDate'
                expireDate:
                  $ref: '#/components/schemas/CustomerSetLastContact200Response/allOf/1/properties/data/items/properties/lastContactDate'
                html:
                  type: string
                programId:
                  $ref: '#/components/schemas/HelixId'
                title:
                  type: string
    CultureProperty:
      type: string
      enum:
      - en-US
      - es-US
      description: "Accepted values vary by program:\n  - `en-US`: English\n  - `es-US`: Spanish\n"
    HelixId:
      type: integer
      format: int32
      minimum: 1
  parameters:
    CulturePath:
      name: culture
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/CultureProperty'
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
