openapi: 3.2.0
info:
  title: Helix Customer API
  version: 3.0.0
  description: Helix Public API (no customer KYC/IDV). **This spec covers all of Helix 3.x and is subject to change at any time.**
servers:
- url: https://sandbox-api.helix.q2.com
  description: Sandbox server
- url: https://api.helix.q2.com
  description: Production server
security:
- basicAuth: []
tags:
- name: Customer
  description: Endpoints for the customer object
paths:
  /customer/archive:
    post:
      tags:
      - Customer
      summary: Archive a customer
      description: Archive a customer by the Helix-assigned `customerId`.
      externalDocs:
        url: https://docs.helix.q2.com/reference/customerarchive
      operationId: customerArchive
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - customerId
              properties:
                customerId:
                  $ref: '#/components/schemas/HelixId'
                archiveReason:
                  type: string
                  enum:
                  - FirstPartyFraud
                  - ThirdPartyFraud
                  - SyntheticIdFraud
                  - AccountTakeoverFraud
                  - NonActivity
                  - CustomerRequest
                  - BankDiscretion
                  - Other
                  default: Other
                  description: "- `FirstPartyFraud`: When someone uses his/her own identity to obtain products and services with no intent to fulfill their payment obligation.\n- `ThirdPartyFraud`: When someone uses a stolen identity to commit fraud. Refers to fraud that is committed without the knowledge of the person whose identity is used to commit the fraud. \n- `SyntheticIdFraud`: When someone uses a possible combination of real and phony attributes, including possible real attributes that don’t correlate to each other, in order to assemble a phony identity. This information is then used to open fraudulent accounts and/or obtain goods and services.\n- `AccountTakeoverFraud`: When someone uses another person's account information to make purchases or withdraw money and often involves changing credentials and/or personal profile information. \n- `NonActivity`: Non-Activity.\n- `BankDiscretion`: Bank chose to archive for a non-fraud reason\n- `Other`: Default value. Providing a detailed reason is strongly encouraged as it informs and improves fraud detection mechanisms. \n"
      responses:
        '200':
          description: A pared down customer object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerArchive200Response'
        '400':
          $ref: '#/paths/~1card~1lock/post/responses/400'
        '401':
          $ref: '#/paths/~1card~1lock/post/responses/401'
        '404':
          $ref: '#/paths/~1card~1lock/post/responses/404'
        '405':
          $ref: '#/paths/~1card~1lock/post/responses/405'
        '429':
          $ref: '#/paths/~1card~1lock/post/responses/429'
  /customer/create:
    post:
      tags:
      - Customer
      summary: Create a customer
      description: Create a customer record. See customer object definition for parameter details. The parameters you are required to pass to Helix can vary depending on your program settings.
      externalDocs:
        url: https://docs.helix.q2.com/reference/customercreate
      operationId: customerCreate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - firstName
              - lastName
              - isSubjectToBackupWithholding
              - isOptedInToBankCommunication
              - isDocumentsAccepted
              properties:
                firstName:
                  type: string
                  maxLength: 64
                middleName:
                  $ref: '#/components/schemas/FirstName'
                lastName:
                  type: string
                  maxLength: 128
                suffix:
                  type: string
                  maxLength: 20
                birthDate:
                  $ref: '#/components/schemas/DateTimeProperty'
                gender:
                  type: string
                  enum:
                  - M
                  - F
                  - U
                culture:
                  type: string
                  enum:
                  - en-US
                  - es-US
                  description: "Accepted values vary by program:\n  - `en-US`: English\n  - `es-US`: Spanish\n"
                tag:
                  $ref: '#/components/schemas/TagProperty'
                taxId:
                  type: string
                  maxLength: 30
                  description: No formatting (no dashes, spaces, etc).
                taxIdType:
                  type: string
                  enum:
                  - SSN
                  - EIN
                  - ITIN
                driversLicenseNumber:
                  type: string
                  maxLength: 30
                driversLicenseState:
                  $ref: '#/components/schemas/FormationState'
                driversLicenseIssueDate:
                  $ref: '#/components/schemas/DateTimeProperty'
                driversLicenseExpireDate:
                  $ref: '#/components/schemas/DateTimeProperty'
                passportNumber:
                  type: string
                  maxLength: 30
                passportCountry:
                  type: string
                  maxLength: 5
                passportIssueDate:
                  $ref: '#/components/schemas/DateTimeProperty'
                passportExpireDate:
                  $ref: '#/components/schemas/DateTimeProperty'
                emailAddress:
                  type: string
                  maxLength: 255
                foreignDocumentCountryCode:
                  type: string
                  maxLength: 3
                foreignDocumentExpirationDate:
                  $ref: '#/components/schemas/DateTimeProperty'
                foreignDocumentNumber:
                  type: string
                  maxLength: 30
                foreignDocumentType:
                  type: string
                  enum:
                  - DriversLicense
                  - ConsularIdCard
                  - Passport
                  - PermanentResidentCard
                  - EmploymentAuthorizationCard
                  - VoterRegistrationCard
                  - IdentificationCard
                isSubjectToBackupWithholding:
                  type: boolean
                isOptedInToBankCommunication:
                  type: boolean
                isDocumentsAccepted:
                  type: boolean
                customField1:
                  type: string
                  maxLength: 100
                customField2:
                  type: string
                  maxLength: 100
                customField3:
                  type: string
                  maxLength: 100
                customField4:
                  type: string
                  maxLength: 100
                customField5:
                  type: string
                  maxLength: 100
                preferredName:
                  type: string
                  maxLength: 21
                usePreferredNameOnCard:
                  type: boolean
                  default: false
                residencyStatusType:
                  type: string
                  enum:
                  - UsCitizen
                  - ResidentAlien
                  - NonResidentAlien
                addresses:
                  type: array
                  items:
                    type: object
                    required:
                    - addressLine1
                    - addressType
                    - city
                    - country
                    - postalCode
                    - state
                    properties:
                      addressLine1:
                        $ref: '#/components/schemas/AddressLine'
                      addressLine2:
                        $ref: '#/components/schemas/AddressLine'
                      addressLine3:
                        $ref: '#/components/schemas/AddressLine'
                      addressLine4:
                        $ref: '#/components/schemas/AddressLine'
                      addressType:
                        type: string
                        enum:
                        - Residence
                        - Mailing
                      city:
                        $ref: '#/components/schemas/CityProperty'
                      country:
                        $ref: '#/components/schemas/CountryProperty'
                      isActive:
                        type: boolean
                        readOnly: true
                      postalCode:
                        $ref: '#/components/schemas/PostalCode'
                      state:
                        $ref: '#/components/schemas/FormationState'
                phones:
                  type: array
                  items:
                    type: object
                    required:
                    - number
                    - phoneType
                    properties:
                      isActive:
                        type: boolean
                        readOnly: true
                      number:
                        type: string
                      phoneType:
                        type: string
                        enum:
                        - Home
                        - Mobile
                        - Office
      responses:
        '200':
          description: A `customerId` and `customerToken` (if enabled for program)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerCreate200Response'
        '400':
          $ref: '#/paths/~1card~1lock/post/responses/400'
        '401':
          $ref: '#/paths/~1card~1lock/post/responses/401'
        '404':
          $ref: '#/paths/~1card~1lock/post/responses/404'
        '405':
          $ref: '#/paths/~1card~1lock/post/responses/405'
        '429':
          $ref: '#/paths/~1card~1lock/post/responses/429'
  /customer/createBusiness:
    post:
      tags:
      - Customer
      summary: Create a business customer
      description: Create a business customer record. See customer object definition for parameter details. The parameters you are required to pass to Helix can vary depending on your program settings.
      externalDocs:
        url: https://docs.helix.q2.com/reference/customercreatebusiness
      operationId: customercreatebusiness
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - businessLegalName
              - legalEntityType
              - taxId
              - taxIdType
              properties:
                businessLegalName:
                  type: string
                legalEntityType:
                  type: string
                  enum:
                  - SoleProprietorship
                  - SingleMemberLLC
                  - SCorporation
                  - CCorporation
                  - NonProfit
                  - Association
                  - Partnership
                  - LimitedLiabilityCompany
                  - LimitedLiabilityPartnership
                  - RevocableTrust
                  - IrrevocableTrust
                  - FinancialInstitutionOther
                  - Estate
                  - Trust
                  - Church
                  - Conservator
                  - Guardianship
                  - Government
                  - Cooperative
                  - BCorporation
                  - TottenTrustPOD
                  - LimitedPartnership
                  - GeneralPartnership
                  - GovernmentDepartment
                  - GovernmentAgency
                  - GovernmentAuthority
                  - GovernmentNonCommercialNonUSDepartmentOrAgency
                  - GovernmentOther
                  - RegulatedFinancialInstitution
                  - RegulatedBankLoanHoldingsCompany
                  - RegulatedSavingsAndLoanHoldingCompany
                  - ForeignFinancialInstitutionRegulatorKeepsUBOInfo
                taxId:
                  $ref: '#/components/schemas/TaxId'
                taxIdType:
                  $ref: '#/components/schemas/TaxIdType'
                businessDescription:
                  type: string
                doingBusinessAs:
                  type: string
                  maxLength: 200
                formationDate:
                  $ref: '#/components/schemas/DateTimeProperty'
                formationState:
                  $ref: '#/components/schemas/FormationState'
                industryClassificationCodeId:
                  $ref: '#/components/schemas/HelixId'
                isTaxExempt:
                  type: boolean
                isSubjectToBackupWithholding:
                  type: boolean
                culture:
                  $ref: '#/components/schemas/CultureProperty'
                isOptedInToBankCommunication:
                  type: boolean
                isDocumentsAccepted:
                  type: boolean
                businessNameOnCard:
                  type: string
                  maxLength: 26
                businessWebsite:
                  type: string
                tag:
                  $ref: '#/components/schemas/TagProperty'
                emailAddress:
                  $ref: '#/components/schemas/EmailAddress'
                customField1:
                  type: string
                  maxLength: 100
                customField2:
                  type: string
                  maxLength: 100
                customField3:
                  type: string
                  maxLength: 100
                customField4:
                  type: string
                  maxLength: 100
                customField5:
                  type: string
                  maxLength: 100
                addresses:
                  type: array
                  items:
                    type: object
                    required:
                    - addressLine1
                    - addressType
                    - city
                    - country
                    - postalCode
                    - state
                    properties:
                      addressLine1:
                        $ref: '#/components/schemas/AddressLine'
                      addressLine2:
                        $ref: '#/components/schemas/AddressLine'
                      addressLine3:
                        $ref: '#/components/schemas/AddressLine'
                      addressLine4:
                        $ref: '#/components/schemas/AddressLine'
                      addressType:
                        type: string
                        enum:
                        - PrimaryBusiness
                        - Business
                        - Registered
                        - TaxFormMailing
                        - Mailing
                      city:
                        $ref: '#/components/schemas/CityProperty'
                      country:
                        $ref: '#/components/schemas/CountryProperty'
                      isActive:
                        type: boolean
                        readOnly: true
                      postalCode:
                        $ref: '#/components/schemas/PostalCode'
                      state:
                        $ref: '#/components/schemas/FormationState'
                phones:
                  type: array
                  items:
                    $ref: '#/components/schemas/PhoneItem'
      responses:
        '200':
          description: An <a href="https://docs.helix.q2.com/reference/response-format" target="_blank">envelope</a> whose data node is a <a href="https://docs.helix.q2.com/docs/customer" target="_blank">customer</a> object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerObject200Response'
        '400':
          $ref: '#/paths/~1card~1lock/post/responses/400'
        '401':
          $ref: '#/paths/~1card~1lock/post/responses/401'
        '404':
          $ref: '#/paths/~1card~1lock/post/responses/404'
        '405':
          $ref: '#/paths/~1card~1lock/post/responses/405'
        '429':
          $ref: '#/paths/~1card~1lock/post/responses/429'
  /customer/createBusinessApplication:
    post:
      tags:
      - Customer
      summary: Create business application
      description: Create a business credit application for the given `businessCustomerId`.
      externalDocs:
        url: https://docs.helix.q2.com/reference/customercreatebusinessapplication
      operationId: customerCreateBusinessApplication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - businessCustomerId
              - controlPersonCustomerId
              - controlPersonRelationshipType
              - controlPersonIsBeneficialOwner
              - isExemptFromBeneficialOwnership
              properties:
                businessCustomerId:
                  $ref: '#/components/schemas/HelixId'
                controlPersonCustomerId:
                  $ref: '#/components/schemas/HelixId'
                controlPersonRelationshipType:
                  type: string
                  enum:
                  - Signer
                  - Owner
                  - Trustee
                  - SuccessorTrustee
                  - Guardian
                  - Conservator
                  - Executor
                  - Agent
                  - PowerOfAttorney
                controlPersonIsBeneficialOwner:
                  type: boolean
                isExemptFromBeneficialOwnership:
                  type: boolean
                exemptFromBeneficialOwnershipReasonType:
                  $ref: '#/components/schemas/ExemptFromBeneficialOwnershipReasonType'
                controlPersonBeneficialOwnerPercentage:
                  type: number
                  format: decimal
                controlPersonTitle:
                  type: string
                attestationDate:
                  type: string
                  format: datetime
                attesterTitle:
                  type: string
                attesterName:
                  type: string
                additionalRelatedCustomers:
                  type: array
                  items:
                    type: object
                    required:
                    - customerId
                    - relationshipType
                    - isBeneficialOwner
                    - canOpenAccounts
                    - externalAccountAccessType
                    properties:
                      customerId:
                        $ref: '#/components/schemas/HelixId'
                      relationshipType:
                        type: string
                        enum:
                        - Signer
                        - Owner
                        - NonTransactional
                        - BeneficialOwner
                        - Trustee
                        - SuccessorTrustee
                        - Guardian
                        - Conservator
                        - Executor
                        - Agent
                        - PowerOfAttorney
                      isBeneficialOwner:
                        type: boolean
                      beneficialOwnerPercentage:
                        type: number
                        format: decimal
                      canOpenAccounts:
                        type: boolean
                      title:
                        type: string
                      externalAccountAccessType:
                        $ref: '#/components/schemas/ExternalAccountAccessType'
      responses:
        '200':
          description: A 200 status with no `data` property present
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardArray200Response/allOf/0'
        '400':
          $ref: '#/paths/~1card~1lock/post/responses/400'
        '401':
          $ref: '#/paths/~1card~1lock/post/responses/401'
        '404':
          $ref: '#/paths/~1card~1lock/post/responses/404'
        '405':
          $ref: '#/paths/~1card~1lock/post/responses/405'
        '429':
          $ref: '#/paths/~1card~1lock/post/responses/429'
  /customer/generateToken/{customerId}:
    get:
      tags:
      - Customer
      summary: Generate a customer token
      description: Retrieve the customer token for the given `customerId`. Only applicable if your program has customer-level authentication enabled.
      externalDocs:
        url: https://docs.helix.q2.com/reference/customergeneratetoken
      operationId: customerGenerateToken
      parameters:
      - $ref: '#/components/parameters/CustomerIdPath'
      responses:
        '200':
          description: A `customerId` and `token`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerGenerateToken200Response'
        '400':
          $ref: '#/paths/~1card~1lock/post/responses/400'
        '401':
          $ref: '#/paths/~1card~1lock/post/responses/401'
        '404':
          $ref: '#/paths/~1card~1lock/post/responses/404'
        '405':
          $ref: '#/paths/~1card~1lock/post/responses/405'
        '429':
          $ref: '#/paths/~1card~1lock/post/responses/429'
  /customer/get/{customerId}:
    get:
      tags:
      - Customer
      summary: Get a customer
      description: Retrieve customer information by the Helix-assigned `customerId`.
      externalDocs:
        url: https://docs.helix.q2.com/reference/customerget
      operationId: customerGet
      parameters:
      - $ref: '#/components/parameters/CustomerIdPath'
      responses:
        '200':
          description: An <a href="https://docs.helix.q2.com/reference/response-format" target="_blank">envelope</a> whose data node is a <a href="https://docs.helix.q2.com/docs/customer" target="_blank">customer</a> object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerObject200Response'
        '400':
          $ref: '#/paths/~1card~1lock/post/responses/400'
        '401':
          $ref: '#/paths/~1card~1lock/post/responses/401'
        '404':
          $ref: '#/paths/~1card~1lock/post/responses/404'
        '405':
          $ref: '#/paths/~1card~1lock/post/responses/405'
        '429':
          $ref: '#/paths/~1card~1lock/post/responses/429'
  /customer/getByEmail/{emailAddress}:
    get:
      tags:
      - Customer
      summary: Get a customer via emailAddress
      description: Retrieve customer information by the `emailAddress` specified during customer creation.
      externalDocs:
        url: https://docs.helix.q2.com/reference/customergetbyemail
      operationId: customerGetByEmail
      parameters:
      - name: emailAddress
        in: path
        required: true
        schema:
          type: string
          maxLength: 100
      responses:
        '200':
          description: An <a href="https://docs.helix.q2.com/reference/response-format" target="_blank">envelope</a> whose data node is a <a href="https://docs.helix.q2.com/docs/customer" target="_blank">customer</a> object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerObject200Response'
        '400':
          $ref: '#/paths/~1card~1lock/post/responses/400'
        '401':
          $ref: '#/paths/~1card~1lock/post/responses/401'
        '404':
          $ref: '#/paths/~1card~1lock/post/responses/404'
        '405':
          $ref: '#/paths/~1card~1lock/post/responses/405'
        '429':
          $ref: '#/paths/~1card~1lock/post/responses/429'
  /customer/getByTag/{tag}:
    get:
      tags:
      - Customer
      summary: Get a customer via tag
      description: Retrieve customer information by the `tag` specified during customer creation.
      externalDocs:
        url: https://docs.helix.q2.com/reference/customergetbytag
      operationId: customerGetByTag
      parameters:
      - name: tag
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/TagProperty'
      responses:
        '200':
          description: An <a href="https://docs.helix.q2.com/reference/response-format" target="_blank">envelope</a> whose data node is a <a href="https://docs.helix.q2.com/docs/customer" target="_blank">customer</a> object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerObject200Response'
        '400':
          $ref: '#/paths/~1card~1lock/post/responses/400'
        '401':
          $ref: '#/paths/~1card~1lock/post/responses/401'
        '404':
          $ref: '#/paths/~1card~1lock/post/responses/404'
        '405':
          $ref: '#/paths/~1card~1lock/post/responses/405'
        '429':
          $ref: '#/paths/~1card~1lock/post/responses/429'
  /customer/list:
    get:
      tags:
      - Customer
      summary: List customers
      description: Retrieve all customers for your program. Results are ordered by `lastName` then `firstName`. Each customer object includes a `customerCount` property, which can be used with the `pageNumber` and `pageSize` query parameters to paginate results. All customers, regardless of status, are returned.
      externalDocs:
        url: https://docs.helix.q2.com/reference/customerlist
      operationId: customerList
      parameters:
      - name: pageNumber
        in: query
        required: false
        description: Which page of the results to return. Use 0 to get the first page.
        schema:
          type: integer
          default: 0
          minimum: 0
          maximum: 200
      - name: pageSize
        in: query
        required: false
        description: How many results to return on each page. Maximum is 200.
        schema:
          type: integer
          default: 200
          minimum: 0
          maximum: 200
      - name: customerClass
        in: query
        required: false
        description: Limit which type of customers are returned. If no value is passed, all customers are returned.
        schema:
          type: string
          enum:
          - individual
          - business
      responses:
        '200':
          description: 'An array of <a href="https://docs.helix.q2.com/docs/customer" target="_blank">customer</a> objects with null arrays for the following properties: accounts, addresses, cards, externalAccounts, phones'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerArray200Response'
        '400':
          $ref: '#/paths/~1card~1lock/post/responses/400'
        '401':
          $ref: '#/paths/~1card~1lock/post/responses/401'
        '404':
          $ref: '#/paths/~1card~1lock/post/responses/404'
        '405':
          $ref: '#/paths/~1card~1lock/post/responses/405'
        '429':
          $ref: '#/paths/~1card~1lock/post/responses/429'
  /customer/note:
    post:
      tags:
      - Customer
      summary: Make a customer note
      description: Add notes to a customer record by the Helix-assigned `customerId`.
      externalDocs:
        url: https://docs.helix.q2.com/reference/customernote
      operationId: customerNote
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - customerId
              - note
              properties:
                customerId:
                  $ref: '#/components/schemas/HelixId'
                note:
                  type: string
                  maxLength: 500
      responses:
        '200':
          description: The `customerId` and `note`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerNote200Response'
        '400':
          $ref: '#/paths/~1card~1lock/post/responses/400'
        '401':
          $ref: '#/paths/~1card~1lock/post/responses/401'
        '404':
          $ref: '#/paths/~1card~1lock/post/responses/404'
        '405':
          $ref: '#/paths/~1card~1lock/post/responses/405'
        '429':
          $ref: '#/paths/~1card~1lock/post/responses/429'
  /customer/notesList/{customerId}:
    get:
      tags:
      - Customer
      summary: List customer notes
      description: Retrieve all notes for the given `customerId`, including those added via Helix Admin Console or API.
      externalDocs:
        url: https://docs.helix.q2.com/reference/customernoteslist
      operationId: customerNotesList
      parameters:
      - $ref: '#/components/parameters/CustomerIdPath'
      - $ref: '#/components/parameters/PageNumber'
      - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: An array of <a href="https://docs.helix.q2.com/docs/customer-note" target="_blank">customerNote</a> objects
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerNotesList200Response'
        '400':
          $ref: '#/paths/~1card~1lock/post/responses/400'
        '401':
          $ref: '#/paths/~1card~1lock/post/responses/401'
        '404':
          $ref: '#/paths/~1card~1lock/post/responses/404'
        '405':
          $ref: '#/paths/~1card~1lock/post/responses/405'
        '429':
          $ref: '#/paths/~1card~1lock/post/responses/429'
  /customer/search:
    post:
      tags:
      - Customer
      summary: Search for customers
      description: Retrieve customer information by the given parameter(s). See customer object definition for parameter details. Results are ordered by `lastName` then `firstName`. Each customer object includes a `customerCount` property, which can be used with the `pageNumber` and `pageSize` query parameters to paginate results.
      externalDocs:
        url: https://docs.helix.q2.com/reference/customersearch
      operationId: customerSearch
      parameters:
      - $ref: '#/components/parameters/PageNumber'
      - $ref: '#/components/parameters/PageSize'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                firstName:
                  $ref: '#/components/schemas/FirstName'
                lastName:
                  $ref: '#/components/schemas/CustomerLastName'
                tag:
                  $ref: '#/components/schemas/TagProperty'
                taxId:
                  $ref: '#/components/schemas/TaxId'
                driversLicenseNumber:
                  $ref: '#/components/schemas/DriversLicenseNumber'
                passportNumber:
                  $ref: '#/components/schemas/PassportNumber'
                emailAddress:
                  $ref: '#/components/schemas/EmailAddress'
                birthDate:
                  $ref: '#/components/schemas/DateTimeProperty'
                accounts:
                  type: array
                  items:
                    type: object
                    properties:
