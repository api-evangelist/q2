openapi: 3.2.0
info:
  title: Helix Customer Beneficiary API
  version: 3.0.0
  description: Helix Public API (no customer KYC/IDV). **This spec covers all of Helix 3.x and is subject to change at any time.**
servers:
- url: https://sandbox-api.helix.q2.com
  description: Sandbox server
- url: https://api.helix.q2.com
  description: Production server
security:
- basicAuth: []
tags:
- name: Customer Beneficiary
  description: Endpoints for the customerBeneficiary object
paths:
  /customerBeneficiary/accountAssignment/list/{customerId}/{customerBeneficiaryId}:
    get:
      tags:
      - Customer Beneficiary
      summary: List account assignments for a customer beneficiary
      description: Retrieve all beneficiaries for the given `customerId`.
      operationId: customerBeneficiaryAccountAssignmentList
      parameters:
      - name: customerId
        in: path
        required: true
        schema:
          type: integer
          format: int32
          minimum: 1
      - name: customerBeneficiaryId
        in: path
        required: true
        schema:
          type: integer
          format: int32
          minimum: 1
      responses:
        '200':
          description: An <a href="https://docs.helix.q2.com/reference/response-format" target="_blank">envelope</a> whose data node is a <a href="https://docs.helix.q2.com/docs/customer-beneficiary-account-assignment-list" target="_blank">CustomerBeneficiaryAccountAssignmentList</a> object.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/CardArray200Response/allOf/0'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/CustomerBeneficiaryAccountAssignmentList'
        '400':
          $ref: '#/paths/~1card~1lock/post/responses/400'
        '401':
          $ref: '#/paths/~1card~1lock/post/responses/401'
        '404':
          $ref: '#/paths/~1card~1lock/post/responses/404'
        '405':
          $ref: '#/paths/~1card~1lock/post/responses/405'
        '429':
          $ref: '#/paths/~1card~1lock/post/responses/429'
  /customerBeneficiary/create:
    post:
      tags:
      - Customer Beneficiary
      summary: Create a customer beneficiary
      description: See customerBeneficiary object definition for parameter details.
      externalDocs:
        url: https://docs.helix.q2.com/reference/customerbeneficiarycreate
      operationId: customerBeneficiaryCreate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - customerId
              properties:
                customerId:
                  $ref: '#/components/schemas/HelixId'
                firstName:
                  $ref: '#/components/schemas/BeneficiaryLastName'
                middleName:
                  $ref: '#/components/schemas/BeneficiaryLastName'
                lastName:
                  type: string
                  maxLength: 50
                birthDate:
                  $ref: '#/components/schemas/DateTimeProperty'
                taxId:
                  $ref: '#/components/schemas/TaxId'
                addressLine1:
                  type: string
                  maxLength: 100
                addressLine2:
                  $ref: '#/components/schemas/AddressLine'
                addressLine3:
                  $ref: '#/components/schemas/AddressLine'
                addressLine4:
                  $ref: '#/components/schemas/AddressLine'
                city:
                  type: string
                  maxLength: 50
                state:
                  $ref: '#/components/schemas/FormationState'
                postalCode:
                  type: string
                  maxLength: 9
                country:
                  type: string
                  maxLength: 50
                legalName1:
                  type: string
                  maxLength: 100
                legalName2:
                  $ref: '#/components/schemas/BeneficiaryLegalName'
                distributionDescription:
                  type: string
                  maxLength: 50
                emailAddress:
                  type: string
                  maxLength: 256
                phoneNumber:
                  type: string
                  maxLength: 15
                beneficiaryType:
                  $ref: '#/components/schemas/BeneficiaryType'
                taxIdType:
                  $ref: '#/components/schemas/TaxIdType'
      responses:
        '200':
          description: An <a href="https://docs.helix.q2.com/reference/response-format" target="_blank">envelope</a> whose data node is a <a href="https://docs.helix.q2.com/docs/customer-beneficiary" target="_blank">customerBeneficiary</a> object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerBeneficiaryObject200Response'
        '400':
          $ref: '#/paths/~1card~1lock/post/responses/400'
        '401':
          $ref: '#/paths/~1card~1lock/post/responses/401'
        '404':
          $ref: '#/paths/~1card~1lock/post/responses/404'
        '405':
          $ref: '#/paths/~1card~1lock/post/responses/405'
        '429':
          $ref: '#/paths/~1card~1lock/post/responses/429'
  /customerBeneficiary/deactivate:
    post:
      tags:
      - Customer Beneficiary
      summary: Deactivate a customer beneficiary
      description: Deactivate a customer beneficiary by the given `customerId` and `customerBeneficiaryId`.
      externalDocs:
        url: https://docs.helix.q2.com/reference/customerbeneficiarydeactivate
      operationId: customerBeneficiaryDeactivate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - customerId
              - customerBeneficiaryId
              properties:
                customerId:
                  $ref: '#/components/schemas/HelixId'
                customerBeneficiaryId:
                  $ref: '#/components/schemas/HelixId'
      responses:
        '200':
          description: A `customerId` and `customerBeneficiaryId`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerBeneficiaryDeactivate200Response'
        '400':
          $ref: '#/paths/~1card~1lock/post/responses/400'
        '401':
          $ref: '#/paths/~1card~1lock/post/responses/401'
        '404':
          $ref: '#/paths/~1card~1lock/post/responses/404'
        '405':
          $ref: '#/paths/~1card~1lock/post/responses/405'
        '429':
          $ref: '#/paths/~1card~1lock/post/responses/429'
  /customerBeneficiary/get/{customerId}/{customerBeneficiaryId}:
    get:
      tags:
      - Customer Beneficiary
      summary: Get a customer beneficiary
      description: Retrieve customer beneficiary information by the given `customerId` and `customerBeneficiaryId`.
      externalDocs:
        url: https://docs.helix.q2.com/reference/customerbeneficiaryget
      operationId: customerBeneficiaryGet
      parameters:
      - $ref: '#/components/parameters/CustomerIdPath'
      - name: customerBeneficiaryId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/HelixId'
      responses:
        '200':
          description: An <a href="https://docs.helix.q2.com/reference/response-format" target="_blank">envelope</a> whose data node is a <a href="https://docs.helix.q2.com/docs/customer-beneficiary" target="_blank">customerBeneficiary</a> object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerBeneficiaryObject200Response'
        '400':
          $ref: '#/paths/~1card~1lock/post/responses/400'
        '401':
          $ref: '#/paths/~1card~1lock/post/responses/401'
        '404':
          $ref: '#/paths/~1card~1lock/post/responses/404'
        '405':
          $ref: '#/paths/~1card~1lock/post/responses/405'
        '429':
          $ref: '#/paths/~1card~1lock/post/responses/429'
  /customerBeneficiary/list/{customerId}:
    get:
      tags:
      - Customer Beneficiary
      summary: List customer beneficiaries
      description: List all beneficiaries for a given customer
      externalDocs:
        url: https://docs.helix.q2.com/reference/customerbeneficiarylist
      operationId: customerBeneficiaryList
      parameters:
      - $ref: '#/components/parameters/CustomerIdPath'
      responses:
        '200':
          description: An array of <a href="https://docs.helix.q2.com/docs/customer-beneficiary" target="_blank">customerBeneficiary</a> objects
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerBeneficiaryArray200Response'
        '400':
          $ref: '#/paths/~1card~1lock/post/responses/400'
        '401':
          $ref: '#/paths/~1card~1lock/post/responses/401'
        '404':
          $ref: '#/paths/~1card~1lock/post/responses/404'
        '405':
          $ref: '#/paths/~1card~1lock/post/responses/405'
        '429':
          $ref: '#/paths/~1card~1lock/post/responses/429'
  /customerBeneficiary/update:
    post:
      tags:
      - Customer Beneficiary
      summary: Update a customer beneficiary
      description: See customerBeneficiary object definition for parameter details.
      externalDocs:
        url: https://docs.helix.q2.com/reference/customerbeneficiaryupdate
      operationId: customerBeneficiaryUpdate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - customerId
              - customerBeneficiaryId
              properties:
                customerId:
                  $ref: '#/components/schemas/HelixId'
                customerBeneficiaryId:
                  $ref: '#/components/schemas/HelixId'
                firstName:
                  $ref: '#/components/schemas/BeneficiaryLastName'
                middleName:
                  $ref: '#/components/schemas/BeneficiaryLastName'
                lastName:
                  $ref: '#/components/schemas/BeneficiaryLastName'
                birthDate:
                  $ref: '#/components/schemas/DateTimeProperty'
                taxId:
                  $ref: '#/components/schemas/TaxId'
                addressLine1:
                  $ref: '#/components/schemas/AddressLine'
                addressLine2:
                  $ref: '#/components/schemas/AddressLine'
                addressLine3:
                  $ref: '#/components/schemas/AddressLine'
                addressLine4:
                  $ref: '#/components/schemas/AddressLine'
                city:
                  $ref: '#/components/schemas/CityProperty'
                state:
                  $ref: '#/components/schemas/FormationState'
                postalCode:
                  $ref: '#/components/schemas/PostalCode'
                country:
                  $ref: '#/components/schemas/CountryProperty'
                legalName1:
                  $ref: '#/components/schemas/BeneficiaryLegalName'
                legalName2:
                  $ref: '#/components/schemas/BeneficiaryLegalName'
                distributionDescription:
                  $ref: '#/components/schemas/DistributionDescription'
                emailAddress:
                  type: string
                  maxLength: 256
                phoneNumber:
                  type: string
                  maxLength: 15
                beneficiaryType:
                  $ref: '#/components/schemas/BeneficiaryType'
                taxIdType:
                  $ref: '#/components/schemas/TaxIdType'
      responses:
        '200':
          description: An <a href="https://docs.helix.q2.com/reference/response-format" target="_blank">envelope</a> whose data node is a <a href="https://docs.helix.q2.com/docs/customer-beneficiary" target="_blank">customerBeneficiary</a> object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerBeneficiaryObject200Response'
        '400':
          $ref: '#/paths/~1card~1lock/post/responses/400'
        '401':
          $ref: '#/paths/~1card~1lock/post/responses/401'
        '404':
          $ref: '#/paths/~1card~1lock/post/responses/404'
        '405':
          $ref: '#/paths/~1card~1lock/post/responses/405'
        '429':
          $ref: '#/paths/~1card~1lock/post/responses/429'
components:
  schemas:
    CityProperty:
      type: string
      maxLength: 50
    TaxIdType:
      type: string
      enum:
      - SSN
      - EIN
      - ITIN
    CustomerBeneficiaryAccountAssignmentList:
      type: object
      properties:
        customerId:
          type:
          - integer
          - 'null'
          format: int32
        customerBeneficiaryId:
          type:
          - integer
          - 'null'
          format: int32
        accountAssignments:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/CustomerBeneficiaryAccountAssignment'
    CardArray200Response:
      allOf:
      - type: object
        properties:
          errors:
            type: array
            items: {}
            example: []
          requestId:
            type: string
            example: 1249a3bf-aca1-40dd-9fba-2a3193550c39
          status:
            type: integer
            enum:
            - 200
          throttle:
            type: object
            properties:
              periodEndsAt:
                $ref: '#/components/schemas/CustomerSetLastContact200Response/allOf/1/properties/data/items/properties/lastContactDate'
              periodLengthInSeconds:
                $ref: '#/components/schemas/HelixId'
              periodRequestLimit:
                $ref: '#/components/schemas/HelixId'
              requestsRemainingInPeriod:
                $ref: '#/components/schemas/HelixId'
              warningThreshold:
                type: number
                format: decimal
                example: 0.2
      - type: object
        properties:
          data:
            type: array
            items:
              $ref: '#/components/schemas/CardObject200Response/allOf/1/properties/data'
    CustomerBeneficiaryArray200Response:
      allOf:
      - $ref: '#/components/schemas/CardArray200Response/allOf/0'
      - type: object
        properties:
          data:
            type: array
            items:
              $ref: '#/components/schemas/CustomerBeneficiaryObject200Response/allOf/1/properties/data'
    CustomerSetLastContact200Response:
      allOf:
      - $ref: '#/components/schemas/CardArray200Response/allOf/0'
      - type: object
        properties:
          data:
            type: array
            items:
              type: object
              properties:
                customerId:
                  $ref: '#/components/schemas/HelixId'
                dormancyStatus:
                  type: string
                  enum:
                  - Active
                  - Inactive
                  - Dormant
                lastContactDate:
                  type: string
                  format: date-time
                  example: '2021-01-07T19:00:59.761-06:00'
                lastContactType:
                  $ref: '#/components/schemas/LastContactType'
    CustomerBeneficiaryDeactivate200Response:
      allOf:
      - $ref: '#/components/schemas/CardArray200Response/allOf/0'
      - type: object
        properties:
          data:
            type: object
            properties:
              customerId:
                $ref: '#/components/schemas/HelixId'
              customerBeneficiaryId:
                $ref: '#/components/schemas/HelixId'
    BeneficiaryLastName:
      type: string
      maxLength: 50
    CustomerBeneficiaryObject200Response:
      allOf:
      - $ref: '#/components/schemas/CardArray200Response/allOf/0'
      - type: object
        properties:
          data:
            type: object
            properties:
              addressLine1:
                type: string
              addressLine2:
                type: string
              addressLine3:
                type: string
              addressLine4:
                type: string
              birthDate:
                $ref: '#/components/schemas/CustomerSetLastContact200Response/allOf/1/properties/data/items/properties/lastContactDate'
              city:
                type: string
              country:
                type: string
              customerBeneficiaryId:
                $ref: '#/components/schemas/HelixId'
              customerId:
                $ref: '#/components/schemas/HelixId'
              distributionDescription:
                type: string
              emailAddress:
                type: string
              firstName:
                type: string
              isActive:
                type: boolean
              lastModifiedDate:
                $ref: '#/components/schemas/CustomerSetLastContact200Response/allOf/1/properties/data/items/properties/lastContactDate'
              lastName:
                type: string
              legalName1:
                type: string
                maxLength: 100
              legalName2:
                type: string
                maxLength: 100
              middleName:
                type: string
              phoneNumber:
                type: string
              postalCode:
                type: string
              state:
                $ref: '#/components/schemas/FormationState'
              taxId:
                $ref: '#/components/schemas/TaxId'
              taxIdMasked:
                type: string
              beneficiaryType:
                $ref: '#/components/schemas/BeneficiaryType'
              taxIdType:
                $ref: '#/components/schemas/TaxIdType'
    PostalCode:
      type: string
      maxLength: 9
    HelixId:
      type: integer
      format: int32
      minimum: 1
    DistributionDescription:
      type: string
      maxLength: 50
    FormationState:
      type: string
      maxLength: 2
    TaxId:
      type: string
      maxLength: 30
      description: No formatting (no dashes, spaces, etc).
    CustomerBeneficiaryAccountAssignment:
      type: object
      properties:
        accountId:
          type:
          - integer
          - 'null'
          format: int32
        accountLegalName1:
          type:
          - string
          - 'null'
        accountLegalName2:
          type:
          - string
          - 'null'
        accountName:
          type:
          - string
          - 'null'
        accountNumberMasked:
          type:
          - string
          - 'null'
        accountType:
          type:
          - string
          - 'null'
        beneficiaryPosition:
          type:
          - integer
          - 'null'
          format: int32
        distributionDescription:
          type:
          - string
          - 'null'
        distributionPercentage:
          type:
          - integer
          - 'null'
          format: int32
        distributionType:
          type:
          - string
          - 'null'
        effectiveDate:
          type:
          - string
          - 'null'
          format: date-time
        isActive:
          type:
          - boolean
          - 'null'
    DateTimeProperty:
      type: string
      format: date-time
      example: '2000-07-04T00:00:00.000+00:00'
    BeneficiaryLegalName:
      type: string
      maxLength: 100
    AddressLine:
      type: string
      maxLength: 100
    CountryProperty:
      type: string
      maxLength: 50
    BeneficiaryType:
      type:
      - string
      - 'null'
      description: 'The type of beneficiary. Accepted values: Individual, Trust, Estate, Charity, NonProfit, Other'
      enum:
      - Individual
      - Trust
      - Estate
      - Charity
      - NonProfit
      - Other
  parameters:
    CustomerIdPath:
      name: customerId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/HelixId'
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
