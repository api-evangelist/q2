openapi: 3.2.0
info:
  title: Helix Statement API
  version: 3.0.0
  description: Helix Public API (no customer KYC/IDV). **This spec covers all of Helix 3.x and is subject to change at any time.**
servers:
- url: https://sandbox-api.helix.q2.com
  description: Sandbox server
- url: https://api.helix.q2.com
  description: Production server
security:
- basicAuth: []
tags:
- name: Statement
  description: Endpoints for the statement object
paths:
  /statement/download/{customerId}/{statementId}:
    get:
      tags:
      - Statement
      summary: Download a statement
      description: Download the PDF content of a monthly or tax statement for the given `customerId`.
      externalDocs:
        url: https://docs.helix.q2.com/reference/statementdownload
      operationId: statementDownload
      parameters:
      - $ref: '#/components/parameters/CustomerIdPath'
      - $ref: '#/components/parameters/StatementIdPath'
      responses:
        '200':
          description: A <a href="https://docs.helix.q2.com/docs/file-content" target="_blank">fileContent</a> object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileContentObject200Response'
        '400':
          $ref: '#/paths/~1card~1lock/post/responses/400'
        '401':
          $ref: '#/paths/~1card~1lock/post/responses/401'
        '404':
          $ref: '#/paths/~1card~1lock/post/responses/404'
        '405':
          $ref: '#/paths/~1card~1lock/post/responses/405'
        '429':
          $ref: '#/paths/~1card~1lock/post/responses/429'
  /statement/get/{customerId}/{statementId}:
    get:
      tags:
      - Statement
      summary: Get a statement
      description: Retrieve a statement for the given `customerId` and `statementId`.
      externalDocs:
        url: https://docs.helix.q2.com/reference/statementget
      operationId: statementGet
      parameters:
      - $ref: '#/components/parameters/CustomerIdPath'
      - name: statementId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/AccountClose200Response/allOf/1/properties/data/properties/transactionId'
      responses:
        '200':
          description: An <a href="https://docs.helix.q2.com/reference/response-format" target="_blank">envelope</a> whose data node is a <a href="https://docs.helix.q2.com/docs/statement" target="_blank">statement</a> object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatementObject200Response'
        '400':
          $ref: '#/paths/~1card~1lock/post/responses/400'
        '401':
          $ref: '#/paths/~1card~1lock/post/responses/401'
        '404':
          $ref: '#/paths/~1card~1lock/post/responses/404'
        '405':
          $ref: '#/paths/~1card~1lock/post/responses/405'
        '429':
          $ref: '#/paths/~1card~1lock/post/responses/429'
  /statement/list/{customerId}:
    get:
      tags:
      - Statement
      summary: List statements
      description: Retrieve all statements for the given `customerId`.
      externalDocs:
        url: https://docs.helix.q2.com/reference/statementlist
      operationId: statementList
      parameters:
      - $ref: '#/components/parameters/CustomerIdPath'
      responses:
        '200':
          description: An array of <a href="https://docs.helix.q2.com/docs/statement" target="_blank">statement</a> objects
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatementArray200Response'
        '400':
          $ref: '#/paths/~1card~1lock/post/responses/400'
        '401':
          $ref: '#/paths/~1card~1lock/post/responses/401'
        '404':
          $ref: '#/paths/~1card~1lock/post/responses/404'
        '405':
          $ref: '#/paths/~1card~1lock/post/responses/405'
        '429':
          $ref: '#/paths/~1card~1lock/post/responses/429'
  /statement/search/{customerId}/{type}/{year}/{month}:
    get:
      tags:
      - Statement
      summary: Search for statements
      description: Search for monthly statements within the given parameters for the given `customerId`. See statement object definition for parameter details.
      externalDocs:
        url: https://docs.helix.q2.com/reference/statementsearch
      operationId: statementSearch
      parameters:
      - $ref: '#/components/parameters/CustomerIdPath'
      - name: type
        in: path
        required: true
        schema:
          type: string
          enum:
          - Monthly
          - Tax1099INT
          - Quarterly
          - Tax1099MISC
      - name: year
        in: path
        required: true
        schema:
          type: integer
          minimum: 1900
          maximum: 9999
      - name: month
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
          maximum: 12
      responses:
        '200':
          description: An array of <a href="https://docs.helix.q2.com/docs/statement" target="_blank">statement</a> objects
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatementArray200Response'
        '400':
          $ref: '#/paths/~1card~1lock/post/responses/400'
        '401':
          $ref: '#/paths/~1card~1lock/post/responses/401'
        '404':
          $ref: '#/paths/~1card~1lock/post/responses/404'
        '405':
          $ref: '#/paths/~1card~1lock/post/responses/405'
        '429':
          $ref: '#/paths/~1card~1lock/post/responses/429'
components:
  schemas:
    StatementObject200Response:
      allOf:
      - $ref: '#/components/schemas/CardArray200Response/allOf/0'
      - type: object
        properties:
          data:
            type: object
            properties:
              createdDate:
                $ref: '#/components/schemas/CustomerSetLastContact200Response/allOf/1/properties/data/items/properties/lastContactDate'
              customerId:
                $ref: '#/components/schemas/HelixId'
              month:
                $ref: '#/components/schemas/MonthProperty'
              statementId:
                $ref: '#/components/schemas/AccountClose200Response/allOf/1/properties/data/properties/transactionId'
              type:
                $ref: '#/components/schemas/StatementType'
              year:
                $ref: '#/components/schemas/YearProperty'
    CardArray200Response:
      allOf:
      - type: object
        properties:
          errors:
            type: array
            items: {}
            example: []
          requestId:
            type: string
            example: 1249a3bf-aca1-40dd-9fba-2a3193550c39
          status:
            type: integer
            enum:
            - 200
          throttle:
            type: object
            properties:
              periodEndsAt:
                $ref: '#/components/schemas/CustomerSetLastContact200Response/allOf/1/properties/data/items/properties/lastContactDate'
              periodLengthInSeconds:
                $ref: '#/components/schemas/HelixId'
              periodRequestLimit:
                $ref: '#/components/schemas/HelixId'
              requestsRemainingInPeriod:
                $ref: '#/components/schemas/HelixId'
              warningThreshold:
                type: number
                format: decimal
                example: 0.2
      - type: object
        properties:
          data:
            type: array
            items:
              $ref: '#/components/schemas/CardObject200Response/allOf/1/properties/data'
    StatementType:
      type: string
      enum:
      - Monthly
      - Tax1099INT
      - Quarterly
      - Tax1099MISC
    AccountClose200Response:
      allOf:
      - $ref: '#/components/schemas/CardArray200Response/allOf/0'
      - type: object
        properties:
          data:
            type: object
            properties:
              customerId:
                $ref: '#/components/schemas/HelixId'
              accountId:
                $ref: '#/components/schemas/HelixId'
              closeToAccountId:
                $ref: '#/components/schemas/HelixId'
              transactionId:
                type: integer
                format: int64
                minimum: 1
              transactionTag:
                $ref: '#/components/schemas/TagProperty'
              closingBalanceAmount:
                type: number
                format: decimal
              interestPaidAmount:
                type: number
                format: decimal
              totalClosingAmount:
                type: number
                format: decimal
              isClosedToExternalAccount:
                type: boolean
    YearProperty:
      type: integer
      minimum: 1900
      maximum: 9999
    CustomerSetLastContact200Response:
      allOf:
      - $ref: '#/components/schemas/CardArray200Response/allOf/0'
      - type: object
        properties:
          data:
            type: array
            items:
              type: object
              properties:
                customerId:
                  $ref: '#/components/schemas/HelixId'
                dormancyStatus:
                  type: string
                  enum:
                  - Active
                  - Inactive
                  - Dormant
                lastContactDate:
                  type: string
                  format: date-time
                  example: '2021-01-07T19:00:59.761-06:00'
                lastContactType:
                  $ref: '#/components/schemas/LastContactType'
    FileContentObject200Response:
      allOf:
      - $ref: '#/components/schemas/CardArray200Response/allOf/0'
      - type: object
        properties:
          data:
            type: object
            properties:
              content:
                type: string
                format: byte
              contentLength:
                $ref: '#/components/schemas/AccountClose200Response/allOf/1/properties/data/properties/transactionId'
              contentType:
                type: string
    MonthProperty:
      type: integer
      minimum: 1
      maximum: 12
    StatementArray200Response:
      allOf:
      - $ref: '#/components/schemas/CardArray200Response/allOf/0'
      - type: object
        properties:
          data:
            type: array
            items:
              $ref: '#/components/schemas/StatementObject200Response/allOf/1/properties/data'
    HelixId:
      type: integer
      format: int32
      minimum: 1
  parameters:
    CustomerIdPath:
      name: customerId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/HelixId'
    StatementIdPath:
      name: statementId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
