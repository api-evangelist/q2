openapi: 3.2.0
info:
  title: Helix External Account API
  version: 3.0.0
  description: Helix Public API (no customer KYC/IDV). **This spec covers all of Helix 3.x and is subject to change at any time.**
servers:
- url: https://sandbox-api.helix.q2.com
  description: Sandbox server
- url: https://api.helix.q2.com
  description: Production server
security:
- basicAuth: []
tags:
- name: External Account
  description: Endpoints for the externalAccount object
paths:
  /externalAccount/archive:
    post:
      tags:
      - External Account
      summary: Archive an external account
      description: Archive an external account by the Helix-assigned `externalAccountId`.
      externalDocs:
        url: https://docs.helix.q2.com/reference/externalaccountarchive
      operationId: externalAccountArchive
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - customerId
              - externalAccountId
              properties:
                customerId:
                  $ref: '#/components/schemas/HelixId'
                externalAccountId:
                  $ref: '#/components/schemas/HelixId'
                requestingCustomerId:
                  allOf:
                  - description: The Helix-assigned unique ID for the individual customer requesting to archive the external account. Only used when an individual is archiving an external account on behalf of a business.
                  - $ref: '#/components/schemas/HelixId'
      responses:
        '200':
          description: A `customerId`, `externalAccountId` and `status`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalAccountArchive200Response'
        '400':
          $ref: '#/paths/~1card~1lock/post/responses/400'
        '401':
          $ref: '#/paths/~1card~1lock/post/responses/401'
        '404':
          $ref: '#/paths/~1card~1lock/post/responses/404'
        '405':
          $ref: '#/paths/~1card~1lock/post/responses/405'
        '429':
          $ref: '#/paths/~1card~1lock/post/responses/429'
  /externalAccount/create:
    post:
      tags:
      - External Account
      summary: Create an external account
      description: Create a new external account with `status=Verified`. See externalAccount object definition for parameter details.
      externalDocs:
        url: https://docs.helix.q2.com/reference/externalaccountcreate
      operationId: externalAccountCreate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - customerId
              - routingNumber
              - accountNumber
              - firstName
              - lastName
              - type
              properties:
                customerId:
                  $ref: '#/components/schemas/HelixId'
                routingNumber:
                  type: string
                  maxLength: 50
                accountNumber:
                  type: string
                  maxLength: 17
                firstName:
                  type: string
                  maxLength: 50
                lastName:
                  type: string
                  maxLength: 50
                businessName:
                  type: string
                  maxLength: 100
                type:
                  $ref: '#/components/schemas/ExternalAccountObject200Response/allOf/1/properties/data/properties/type'
                name:
                  type: string
                  maxLength: 50
                nickName:
                  type: string
                  maxLength: 50
                tag:
                  $ref: '#/components/schemas/TagProperty'
                customField1:
                  type: string
                  maxLength: 50
                customField2:
                  type: string
                  maxLength: 50
                customField3:
                  type: string
                  maxLength: 50
                customField4:
                  type: string
                  maxLength: 50
                customField5:
                  type: string
                  maxLength: 50
                requestingCustomerId:
                  allOf:
                  - description: The Helix-assigned unique ID for the individual customer requesting to create the external account. Only used when an individual is creating an external account on behalf of a business.
                  - $ref: '#/components/schemas/HelixId'
      responses:
        '200':
          description: An <a href="https://docs.helix.q2.com/reference/response-format" target="_blank">envelope</a> whose data node is an <a href="https://docs.helix.q2.com/docs/external-account" target="_blank">externalAccount</a> object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalAccountObject200Response'
        '400':
          $ref: '#/paths/~1card~1lock/post/responses/400'
        '401':
          $ref: '#/paths/~1card~1lock/post/responses/401'
        '404':
          $ref: '#/paths/~1card~1lock/post/responses/404'
        '405':
          $ref: '#/paths/~1card~1lock/post/responses/405'
        '429':
          $ref: '#/paths/~1card~1lock/post/responses/429'
  /externalAccount/get/{customerId}/{externalAccountId}:
    get:
      tags:
      - External Account
      summary: Get an external account
      description: Retrieve external account information by the given `customerId` and `externalAccountId`.
      externalDocs:
        url: https://docs.helix.q2.com/reference/externalaccountget
      operationId: externalAccountGet
      parameters:
      - $ref: '#/components/parameters/CustomerIdPath'
      - name: externalAccountId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/HelixId'
      responses:
        '200':
          description: An <a href="https://docs.helix.q2.com/reference/response-format" target="_blank">envelope</a> whose data node is an <a href="https://docs.helix.q2.com/docs/external-account" target="_blank">externalAccount</a> object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalAccountObject200Response'
        '400':
          $ref: '#/paths/~1card~1lock/post/responses/400'
        '401':
          $ref: '#/paths/~1card~1lock/post/responses/401'
        '404':
          $ref: '#/paths/~1card~1lock/post/responses/404'
        '405':
          $ref: '#/paths/~1card~1lock/post/responses/405'
        '429':
          $ref: '#/paths/~1card~1lock/post/responses/429'
  /externalAccount/getByTag/{customerId}/{tag}:
    get:
      tags:
      - External Account
      summary: Get an external account via tag
      description: Retrieve external account information by the given `customerId` and `tag`.
      externalDocs:
        url: https://docs.helix.q2.com/reference/externalaccountgetbytag
      operationId: externalAccountGetByTag
      parameters:
      - $ref: '#/components/parameters/CustomerIdPath'
      - $ref: '#/components/parameters/TagPath'
      responses:
        '200':
          description: An <a href="https://docs.helix.q2.com/docs/external-account" target="_blank">externalAccount</a> object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalAccountObject200Response'
        '400':
          $ref: '#/paths/~1card~1lock/post/responses/400'
        '401':
          $ref: '#/paths/~1card~1lock/post/responses/401'
        '404':
          $ref: '#/paths/~1card~1lock/post/responses/404'
        '405':
          $ref: '#/paths/~1card~1lock/post/responses/405'
        '429':
          $ref: '#/paths/~1card~1lock/post/responses/429'
  /externalAccount/initiate:
    post:
      tags:
      - External Account
      summary: Initiate an external account
      description: Initiate a new external account with `status=Unverified` and start the micro-deposit process. See externalAccount object definition for parameter details.
      externalDocs:
        url: https://docs.helix.q2.com/reference/externalaccountinitiate
      operationId: externalAccountInitiate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExternalAccountCreateRequest'
      responses:
        '200':
          description: An <a href="https://docs.helix.q2.com/reference/response-format" target="_blank">envelope</a> whose data node is an <a href="https://docs.helix.q2.com/docs/external-account" target="_blank">externalAccount</a> object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalAccountObject200Response'
        '400':
          $ref: '#/paths/~1card~1lock/post/responses/400'
        '401':
          $ref: '#/paths/~1card~1lock/post/responses/401'
        '404':
          $ref: '#/paths/~1card~1lock/post/responses/404'
        '405':
          $ref: '#/paths/~1card~1lock/post/responses/405'
        '429':
          $ref: '#/paths/~1card~1lock/post/responses/429'
  /externalAccount/list/{customerId}:
    get:
      tags:
      - External Account
      summary: List external accounts
      description: Retrieve all external accounts for the given `customerId`.
      externalDocs:
        url: https://docs.helix.q2.com/reference/externalaccountlist
      operationId: externalAccountList
      parameters:
      - $ref: '#/components/parameters/CustomerIdPath'
      responses:
        '200':
          description: An array of <a href="https://docs.helix.q2.com/docs/external-account" target="_blank">externalAccount</a> objects
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalAccountArray200Response'
        '400':
          $ref: '#/paths/~1card~1lock/post/responses/400'
        '401':
          $ref: '#/paths/~1card~1lock/post/responses/401'
        '404':
          $ref: '#/paths/~1card~1lock/post/responses/404'
        '405':
          $ref: '#/paths/~1card~1lock/post/responses/405'
        '429':
          $ref: '#/paths/~1card~1lock/post/responses/429'
  /externalAccount/lock:
    post:
      tags:
      - External Account
      summary: Lock an external account
      description: Lock an external account by the Helix-assigned `externalAccountId`.
      externalDocs:
        url: https://docs.helix.q2.com/reference/externalaccountlock
      operationId: externalAccountLock
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - customerId
              - externalAccountId
              properties:
                customerId:
                  $ref: '#/components/schemas/HelixId'
                externalAccountId:
                  $ref: '#/components/schemas/HelixId'
                lockedReason:
                  type: string
                  maxLength: 255
                requestingCustomerId:
                  allOf:
                  - description: The Helix-assigned unique ID for the individual customer requesting to lock the external account. Only used when an individual is locking an external account on behalf of a business.
                  - $ref: '#/components/schemas/HelixId'
      responses:
        '200':
          description: An <a href="https://docs.helix.q2.com/reference/response-format" target="_blank">envelope</a> whose data node is an <a href="https://docs.helix.q2.com/docs/external-account" target="_blank">externalAccount</a> object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalAccountObject200Response'
        '400':
          $ref: '#/paths/~1card~1lock/post/responses/400'
        '401':
          $ref: '#/paths/~1card~1lock/post/responses/401'
        '404':
          $ref: '#/paths/~1card~1lock/post/responses/404'
        '405':
          $ref: '#/paths/~1card~1lock/post/responses/405'
        '429':
          $ref: '#/paths/~1card~1lock/post/responses/429'
  /externalAccount/resendVerification:
    post:
      tags:
      - External Account
      summary: Resend verification deposits
      description: Resend verification deposits for an external account with a `status` of `Unverified`, `VerifyLocked`, or `Expired`.
      externalDocs:
        url: https://docs.helix.q2.com/reference/externalaccountresendverification
      operationId: externalAccountResendVerification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - customerId
              - externalAccountId
              properties:
                customerId:
                  $ref: '#/components/schemas/HelixId'
                externalAccountId:
                  $ref: '#/components/schemas/HelixId'
                requestingCustomerId:
                  allOf:
                  - description: The Helix-assigned unique ID for the individual customer requesting to resend verification for the external account. Only used when an individual is requesting this action on behalf of a business.
                  - $ref: '#/components/schemas/HelixId'
      responses:
        '200':
          description: An <a href="https://docs.helix.q2.com/reference/response-format" target="_blank">envelope</a> whose data node is an <a href="https://docs.helix.q2.com/docs/external-account" target="_blank">externalAccount</a> object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalAccountObject200Response'
        '400':
          $ref: '#/paths/~1card~1lock/post/responses/400'
        '401':
          $ref: '#/paths/~1card~1lock/post/responses/401'
        '404':
          $ref: '#/paths/~1card~1lock/post/responses/404'
        '405':
          $ref: '#/paths/~1card~1lock/post/responses/405'
        '429':
          $ref: '#/paths/~1card~1lock/post/responses/429'
  /externalAccount/unlock:
    post:
      tags:
      - External Account
      summary: Unlock an external account
      description: Unlock an external account by the Helix-assigned `externalAccountId`.
      externalDocs:
        url: https://docs.helix.q2.com/reference/externalaccountunlock
      operationId: externalAccountUnlock
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - customerId
              - externalAccountId
              properties:
                customerId:
                  $ref: '#/components/schemas/HelixId'
                externalAccountId:
                  $ref: '#/components/schemas/HelixId'
                requestingCustomerId:
                  allOf:
                  - description: The Helix-assigned unique ID for the individual customer requesting to unlock the external account. Only used when an individual is unlocking an external account on behalf of a business.
                  - $ref: '#/components/schemas/HelixId'
      responses:
        '200':
          description: An <a href="https://docs.helix.q2.com/reference/response-format" target="_blank">envelope</a> whose data node is an <a href="https://docs.helix.q2.com/docs/external-account" target="_blank">externalAccount</a> object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalAccountObject200Response'
        '400':
          $ref: '#/paths/~1card~1lock/post/responses/400'
        '401':
          $ref: '#/paths/~1card~1lock/post/responses/401'
        '404':
          $ref: '#/paths/~1card~1lock/post/responses/404'
        '405':
          $ref: '#/paths/~1card~1lock/post/responses/405'
        '429':
          $ref: '#/paths/~1card~1lock/post/responses/429'
  /externalAccount/update:
    post:
      tags:
      - External Account
      summary: Update an external account
      description: See externalAccount object definition for parameter details.
      externalDocs:
        url: https://docs.helix.q2.com/reference/externalaccountupdate
      operationId: externalAccountUpdate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - customerId
              - externalAccountId
              properties:
                customerId:
                  $ref: '#/components/schemas/HelixId'
                externalAccountId:
                  $ref: '#/components/schemas/HelixId'
                nickname:
                  type: string
                  maxLength: 50
                tag:
                  $ref: '#/components/schemas/TagProperty'
                customField1:
                  type: string
                  maxLength: 50
                customField2:
                  type: string
                  maxLength: 50
                customField3:
                  type: string
                  maxLength: 50
                customField4:
                  type: string
                  maxLength: 50
                customField5:
                  type: string
                  maxLength: 50
                requestingCustomerId:
                  allOf:
                  - description: The Helix-assigned unique ID for the individual customer requesting to update the external account. Only used when an individual is updating an external account on behalf of a business.
                  - $ref: '#/components/schemas/HelixId'
      responses:
        '200':
          description: An <a href="https://docs.helix.q2.com/reference/response-format" target="_blank">envelope</a> whose data node is an <a href="https://docs.helix.q2.com/docs/external-account" target="_blank">externalAccount</a> object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalAccountObject200Response'
        '400':
          $ref: '#/paths/~1card~1lock/post/responses/400'
        '401':
          $ref: '#/paths/~1card~1lock/post/responses/401'
        '404':
          $ref: '#/paths/~1card~1lock/post/responses/404'
        '405':
          $ref: '#/paths/~1card~1lock/post/responses/405'
        '429':
          $ref: '#/paths/~1card~1lock/post/responses/429'
  /externalAccount/verify:
    post:
      tags:
      - External Account
      summary: Verify an external account
      description: Verify trial deposit amounts sent via /externalAccount/initiate.
      externalDocs:
        url: https://docs.helix.q2.com/reference/externalaccountverify
      operationId: externalAccountVerify
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - customerId
              - externalAccountId
              - amount1
              - amount2
              properties:
                customerId:
                  $ref: '#/components/schemas/HelixId'
                externalAccountId:
                  $ref: '#/components/schemas/HelixId'
                amount1:
                  type: string
                  description: Value of one of the trial deposit amounts
                amount2:
                  type: string
                  description: Value of one of the trial deposit amounts
                requestingCustomerId:
                  allOf:
                  - description: The Helix-assigned unique ID for the individual customer requesting to verify the external account. Only used when an individual is verifying an external account on behalf of a business.
                  - $ref: '#/components/schemas/HelixId'
      responses:
        '200':
          description: An <a href="https://docs.helix.q2.com/reference/response-format" target="_blank">envelope</a> whose data node is an <a href="https://docs.helix.q2.com/docs/external-account" target="_blank">externalAccount</a> object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalAccountObject200Response'
        '400':
          $ref: '#/paths/~1card~1lock/post/responses/400'
        '401':
          $ref: '#/paths/~1card~1lock/post/responses/401'
        '404':
          $ref: '#/paths/~1card~1lock/post/responses/404'
        '405':
          $ref: '#/paths/~1card~1lock/post/responses/405'
        '429':
          $ref: '#/paths/~1card~1lock/post/responses/429'
components:
  parameters:
    TagPath:
      name: tag
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/TagProperty'
    CustomerIdPath:
      name: customerId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/HelixId'
  schemas:
    CardArray200Response:
      allOf:
      - type: object
        properties:
          errors:
            type: array
            items: {}
            example: []
          requestId:
            type: string
            example: 1249a3bf-aca1-40dd-9fba-2a3193550c39
          status:
            type: integer
            enum:
            - 200
          throttle:
            type: object
            properties:
              periodEndsAt:
                $ref: '#/components/schemas/CustomerSetLastContact200Response/allOf/1/properties/data/items/properties/lastContactDate'
              periodLengthInSeconds:
                $ref: '#/components/schemas/HelixId'
              periodRequestLimit:
                $ref: '#/components/schemas/HelixId'
              requestsRemainingInPeriod:
                $ref: '#/components/schemas/HelixId'
              warningThreshold:
                type: number
                format: decimal
                example: 0.2
      - type: object
        properties:
          data:
            type: array
            items:
              $ref: '#/components/schemas/CardObject200Response/allOf/1/properties/data'
    ExternalAccountObject200Response:
      allOf:
      - $ref: '#/components/schemas/CardArray200Response/allOf/0'
      - type: object
        properties:
          data:
            type: object
            properties:
              accountNumber:
                type: string
              accountNumberMasked:
                type: string
              businessName:
                type: string
                maxLength: 100
              customField1:
                type: string
                maxLength: 50
              customField2:
                type: string
                maxLength: 50
              customField3:
                type: string
                maxLength: 50
              customField4:
                type: string
                maxLength: 50
              customField5:
                type: string
                maxLength: 50
              customerId:
                $ref: '#/components/schemas/HelixId'
              externalAccountId:
                $ref: '#/components/schemas/HelixId'
              firstName:
                type: string
                maxLength: 50
              isActive:
                type: boolean
                deprecated: true
              isLocked:
                type: boolean
              lastModifiedDate:
                $ref: '#/components/schemas/CustomerSetLastContact200Response/allOf/1/properties/data/items/properties/lastContactDate'
              lastName:
                type: string
                maxLength: 50
              lockedDate:
                $ref: '#/components/schemas/CustomerSetLastContact200Response/allOf/1/properties/data/items/properties/lastContactDate'
              lockedReason:
                type: string
              name:
                type: string
              nickName:
                type: string
              nocCode:
                type: string
              routingNumber:
                type: string
              routingNumberMasked:
                type: string
              status:
                type: string
                enum:
                - Unverified
                - VerifyLocked
                - Verified
                - Denied
                - Expired
                - Archived
              statusDate:
                $ref: '#/components/schemas/CustomerSetLastContact200Response/allOf/1/properties/data/items/properties/lastContactDate'
              tag:
                $ref: '#/components/schemas/TagProperty'
              type:
                type: string
                enum:
                - Checking
                - Savings
                - Business Checking
                - Business Savings
                - Prepaid
    ExternalAccountCreateRequest:
      type: object
      required:
      - customerId
      - routingNumber
      - accountNumber
      - firstName
      - lastName
      - type
      properties:
        customerId:
          $ref: '#/components/schemas/HelixId'
        routingNumber:
          type: string
          maxLength: 50
        accountNumber:
          type: string
          maxLength: 17
        firstName:
          type: string
          maxLength: 50
        lastName:
          type: string
          maxLength: 50
        businessName:
          type: string
          maxLength: 100
        type:
          $ref: '#/components/schemas/ExternalAccountObject200Response/allOf/1/properties/data/properties/type'
        name:
          type: string
          maxLength: 50
        nickName:
          type: string
          maxLength: 50
        tag:
          $ref: '#/components/schemas/TagProperty'
        customField1:
          type: string
          maxLength: 50
        customField2:
          type: string
          maxLength: 50
        customField3:
          type: string
          maxLength: 50
        customField4:
          type: string
          maxLength: 50
        customField5:
          type: string
          maxLength: 50
        requestingCustomerId:
          allOf:
          - description: The Helix-assigned unique ID for the individual customer requesting to create the external account. Only used when an individual is creating an external account on behalf of a business.
          - $ref: '#/components/schemas/HelixId'
    ExternalAccountArray200Response:
      allOf:
      - $ref: '#/components/schemas/CardArray200Response/allOf/0'
      - type: object
        properties:
          data:
            type: array
            items:
              $ref: '#/components/schemas/ExternalAccountObject200Response/allOf/1/properties/data'
    TagProperty:
      type: string
      maxLength: 50
    CustomerSetLastContact200Response:
      allOf:
      - $ref: '#/components/schemas/CardArray200Response/allOf/0'
      - type: object
        properties:
          data:
            type: array
            items:
              type: object
              properties:
                customerId:
                  $ref: '#/components/schemas/HelixId'
                dormancyStatus:
                  type: string
                  enum:
                  - Active
                  - Inactive
                  - Dormant
                lastContactDate:
                  type: string
                  format: date-time
                  example: '2021-01-07T19:00:59.761-06:00'
                lastContactType:
                  $ref: '#/components/schemas/LastContactType'
    ExternalAccountArchive200Response:
      allOf:
      - $ref: '#/components/schemas/CardArray200Response/allOf/0'
      - type: object
        properties:
          data:
            type: object
            properties:
              customerId:
                $ref: '#/components/schemas/HelixId'
              externalAccountId:
                $ref: '#/components/schemas/HelixId'
              status:
                type: string
                enum:
                - Archived
    HelixId:
      type: integer
      format: int32
      minimum: 1
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
x-samples-languages:
- curl
- node
- python
- csharp
- ruby
- go
- java
- kotlin
- php
