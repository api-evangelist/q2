openapi: 3.2.0
info:
  title: Helix Transfer API
  version: 3.0.0
  description: Helix Public API (no customer KYC/IDV). **This spec covers all of Helix 3.x and is subject to change at any time.**
servers:
- url: https://sandbox-api.helix.q2.com
  description: Sandbox server
- url: https://api.helix.q2.com
  description: Production server
security:
- basicAuth: []
tags:
- name: Transfer
  description: Endpoints for the transfer object
paths:
  /transfer/achOrigination/create:
    post:
      tags:
      - Transfer
      summary: Create an ACH-originated debit or credit transaction
      description: Create an ACH-originated transaction. See transfer object definition for parameter details.
      externalDocs:
        url: https://docs.helix.q2.com/reference/transferachoriginationcreate
      operationId: transferAchOriginationCreate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - accountId
              - amount
              - companyEntryDescription
              - customerId
              - dFIAccountNumber
              - direction
              - isPrenote
              - isReversal
              - receiverAccountType
              - receiverName
              - recieverFIRoutingNumber
              - standardEntryClassCode
              properties:
                accountId:
                  allOf:
                  - description: The accountId to which funds are being deposited or from which funds are being withdrawn. **Note:** This is not accountNumber.
                  - $ref: '#/components/schemas/HelixId'
                amount:
                  type: number
                  format: decimal
                  minimum: 0.01
                companyEntryDescription:
                  type: string
                  maxLength: 10
                customerId:
                  $ref: '#/components/schemas/HelixId'
                dFIAccountNumber:
                  type: string
                  maxLength: 17
                direction:
                  enum:
                  - Credit
                  - Debit
                effectiveEntryDate:
                  type: string
                  format: date
                  description: If `effectiveEntryDate` is not provided, the transaction will be processed in the next available ACH transfer window.
                isPrenote:
                  type: boolean
                isReversal:
                  type: boolean
                paymentRelatedInformation:
                  type: string
                  maxLength: 80
                receiverAccountType:
                  enum:
                  - Checking
                  - Savings
                  - Loan
                  - General Ledger
                receiverName:
                  type: string
                  maxLength: 22
                receiverFIRoutingNumber:
                  type: string
                  maxLength: 9
                standardEntryClassCode:
                  type: string
                  maxLength: 3
                tag:
                  type: string
                  maxLength: 50
      responses:
        '200':
          description: An <a href="https://docs.helix.q2.com/reference/response-format" target="_blank">envelope</a> whose data node is a <a href="https://docs.helix.q2.com/docs/transaction" target="_blank">transaction</a> object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionObject200Response'
        '400':
          $ref: '#/paths/~1card~1lock/post/responses/400'
        '401':
          $ref: '#/paths/~1card~1lock/post/responses/401'
        '404':
          $ref: '#/paths/~1card~1lock/post/responses/404'
        '405':
          $ref: '#/paths/~1card~1lock/post/responses/405'
        '429':
          $ref: '#/paths/~1card~1lock/post/responses/429'
  /transfer/create:
    post:
      tags:
      - Transfer
      summary: Create a transfer
      description: Transfer funds from one account to another. Results in a new transaction retrievable via the /transaction/* endpoints. See transfer object definition for parameter details.
      externalDocs:
        url: https://docs.helix.q2.com/reference/transfercreate
      operationId: transferCreate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - customerId
              - fromId
              - toId
              - amount
              properties:
                amount:
                  type: number
                  format: decimal
                  minimum: 0.01
                customerId:
                  $ref: '#/components/schemas/HelixId'
                description:
                  type: string
                fromId:
                  $ref: '#/components/schemas/HelixId'
                isSameDaySettle:
                  type: boolean
                tag:
                  $ref: '#/components/schemas/TagProperty'
                toId:
                  $ref: '#/components/schemas/HelixId'
                toCustomerId:
                  $ref: '#/components/schemas/HelixId'
                toCustomerTag:
                  $ref: '#/components/schemas/TagProperty'
                toTransactionTag:
                  $ref: '#/components/schemas/TagProperty'
                purposeCode:
                  type: string
                  maxLength: 10
                  pattern: ^[0-9][A-Z][a-z]$
      responses:
        '200':
          description: An array of <a href="https://docs.helix.q2.com/docs/transfer-response" target="_blank">transferResponse</a> objects.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransferCreate200Response'
        '400':
          $ref: '#/paths/~1card~1lock/post/responses/400'
        '401':
          $ref: '#/paths/~1card~1lock/post/responses/401'
        '404':
          $ref: '#/paths/~1card~1lock/post/responses/404'
        '405':
          $ref: '#/paths/~1card~1lock/post/responses/405'
        '429':
          $ref: '#/paths/~1card~1lock/post/responses/429'
  /transfer/void:
    post:
      tags:
      - Transfer
      summary: Void a transfer
      description: Void a transfer previously created via /transfer/create. Only transactions with `status=Initiated` may be voided.
      externalDocs:
        url: https://docs.helix.q2.com/reference/transfervoid
      operationId: transferVoid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              required:
              - customerId
              properties:
                customerId:
                  $ref: '#/components/schemas/HelixId'
                tag:
                  allOf:
                  - description: Required if `transactionId` not present
                  - $ref: '#/components/schemas/TagProperty'
                transactionId:
                  allOf:
                  - description: Required if `tag` not present
                  - $ref: '#/components/schemas/AccountClose200Response/allOf/1/properties/data/properties/transactionId'
      responses:
        '200':
          description: An <a href="https://docs.helix.q2.com/reference/response-format" target="_blank">envelope</a> whose data node is a <a href="https://docs.helix.q2.com/docs/transfer-response" target="_blank">transferResponse</a> object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransferVoid200Response'
        '400':
          $ref: '#/paths/~1card~1lock/post/responses/400'
        '401':
          $ref: '#/paths/~1card~1lock/post/responses/401'
        '404':
          $ref: '#/paths/~1card~1lock/post/responses/404'
        '405':
          $ref: '#/paths/~1card~1lock/post/responses/405'
        '429':
          $ref: '#/paths/~1card~1lock/post/responses/429'
components:
  schemas:
    TransferVoid200Response:
      allOf:
      - $ref: '#/components/schemas/CardArray200Response/allOf/0'
      - type: object
        properties:
          data:
            type: object
            properties:
              customerId:
                $ref: '#/components/schemas/HelixId'
              masterId:
                $ref: '#/components/schemas/AccountClose200Response/allOf/1/properties/data/properties/transactionId'
              tag:
                $ref: '#/components/schemas/TagProperty'
              transactionId:
                $ref: '#/components/schemas/AccountClose200Response/allOf/1/properties/data/properties/transactionId'
    CardArray200Response:
      allOf:
      - type: object
        properties:
          errors:
            type: array
            items: {}
            example: []
          requestId:
            type: string
            example: 1249a3bf-aca1-40dd-9fba-2a3193550c39
          status:
            type: integer
            enum:
            - 200
          throttle:
            type: object
            properties:
              periodEndsAt:
                $ref: '#/components/schemas/CustomerSetLastContact200Response/allOf/1/properties/data/items/properties/lastContactDate'
              periodLengthInSeconds:
                $ref: '#/components/schemas/HelixId'
              periodRequestLimit:
                $ref: '#/components/schemas/HelixId'
              requestsRemainingInPeriod:
                $ref: '#/components/schemas/HelixId'
              warningThreshold:
                type: number
                format: decimal
                example: 0.2
      - type: object
        properties:
          data:
            type: array
            items:
              $ref: '#/components/schemas/CardObject200Response/allOf/1/properties/data'
    AccountClose200Response:
      allOf:
      - $ref: '#/components/schemas/CardArray200Response/allOf/0'
      - type: object
        properties:
          data:
            type: object
            properties:
              customerId:
                $ref: '#/components/schemas/HelixId'
              accountId:
                $ref: '#/components/schemas/HelixId'
              closeToAccountId:
                $ref: '#/components/schemas/HelixId'
              transactionId:
                type: integer
                format: int64
                minimum: 1
              transactionTag:
                $ref: '#/components/schemas/TagProperty'
              closingBalanceAmount:
                type: number
                format: decimal
              interestPaidAmount:
                type: number
                format: decimal
              totalClosingAmount:
                type: number
                format: decimal
              isClosedToExternalAccount:
                type: boolean
    PurposeCode:
      type: string
      maxLength: 10
      pattern: ^[0-9][A-Z][a-z]$
    TransactionObject200Response:
      allOf:
      - $ref: '#/components/schemas/CardArray200Response/allOf/0'
      - type: object
        properties:
          data:
            type: object
            properties:
              accountId:
                $ref: '#/components/schemas/HelixId'
              amount:
                type: number
                format: decimal
              availableDate:
                $ref: '#/components/schemas/CustomerSetLastContact200Response/allOf/1/properties/data/items/properties/lastContactDate'
              cardId:
                $ref: '#/components/schemas/HelixId'
              cardMerchantInfo:
                type: object
                properties:
                  merchantCity:
                    type: string
                    maxLength: 13
                  merchantCountryCode:
                    type: string
                    maxLength: 2
                  merchantGroupcode:
                    type: string
                    maxLength: 6
                  merchantId:
                    type: string
                    maxLength: 15
                  merchantLocation:
                    type: string
                    maxLength: 23
                  merchantStateCode:
                    type: string
                    maxLength: 2
                  merchantZipCode:
                    type: string
                    maxLength: 9
              check:
                type: object
                properties:
                  checkAmount:
                    type: number
                    format: decimal
                  checkImages:
                    type: array
                    items:
                      type: object
                      properties:
                        downloadUrl:
                          type: string
                        imageType:
                          type: string
                          enum:
                          - CheckFront
                          - CheckBack
                          - ReturnCheckFront
                          - ReturnCheckBack
                  checkNumber:
                    $ref: '#/components/schemas/AccountClose200Response/allOf/1/properties/data/properties/transactionId'
                  holdCode:
                    type: string
                  holdCodeDescription:
                    type: string
                  payerAccountNumberMasked:
                    type: string
                  payerInstitutionDescription:
                    type: string
                  payerRoutingNumber:
                    type: string
                  returnReason:
                    type: string
                  returnReasonCode:
                    type: string
              createdDate:
                $ref: '#/components/schemas/CustomerSetLastContact200Response/allOf/1/properties/data/items/properties/lastContactDate'
              customerId:
                $ref: '#/components/schemas/HelixId'
              customField1:
                type: string
              depositAvailability:
                type: object
                properties:
                  availabilityAmounts:
                    type: array
                    items:
                      type: object
                      properties:
                        availableDate:
                          $ref: '#/components/schemas/CustomerSetLastContact200Response/allOf/1/properties/data/items/properties/lastContactDate'
                        effectiveAvailableDate:
                          $ref: '#/components/schemas/CustomerSetLastContact200Response/allOf/1/properties/data/items/properties/lastContactDate'
                        isReleased:
                          type: boolean
                        overrideAvailableDate:
                          $ref: '#/components/schemas/CustomerSetLastContact200Response/allOf/1/properties/data/items/properties/lastContactDate'
                        releaseAmount:
                          type: number
                          format: decimal
                        releasedDate:
                          $ref: '#/components/schemas/CustomerSetLastContact200Response/allOf/1/properties/data/items/properties/lastContactDate'
                        remainingAmount:
                          type: number
                          format: decimal
                  availabilityCode:
                    type: string
                  totalReleasedAmount:
                    type: number
                    format: decimal
                  totalRemainingAmount:
                    type: number
                    format: decimal
              description:
                type: string
              feeCode:
                type: string
                enum:
                - ACH
                - DAF
                - IAF
                - ICF
                - NSF
                - RGD
                - RTN
              feeDescription:
                type: string
              friendlyDescription:
                type: string
              institutionName:
                type: string
              isCredit:
                type: boolean
              isEarlyDirectDeposit:
                type: boolean
              isSameDaySettle:
                type: boolean
              masterId:
                $ref: '#/components/schemas/AccountClose200Response/allOf/1/properties/data/properties/transactionId'
              nachaDescription:
                type: string
                deprecated: true
              nachaInfo:
                type: object
                properties:
                  companyDiscretionaryData:
                    type: string
                  companyEntryDescription:
                    type: string
                  companyIdentification:
                    type: string
                  companyName:
                    type: string
                  isEarlyDeposit:
                    type: boolean
                  nachaSettledDate:
                    $ref: '#/components/schemas/CustomerSetLastContact200Response/allOf/1/properties/data/items/properties/lastContactDate'
                  standardEntryClassCode:
                    type: string
              purposeCode:
                $ref: '#/components/schemas/PurposeCode'
              requestingCustomerId:
                $ref: '#/components/schemas/HelixId'
              returnCode:
                type: string
              runningAccountBalance:
                type: number
                format: decimal
              settledDate:
                $ref: '#/components/schemas/CustomerSetLastContact200Response/allOf/1/properties/data/items/properties/lastContactDate'
              statementDate:
                $ref: '#/components/schemas/CustomerSetLastContact200Response/allOf/1/properties/data/items/properties/lastContactDate'
              status:
                type: string
                enum:
                - Initiated
                - Pending
                - Settled
                - Voided
              subType:
                type: string
              subTypeCode:
                type: string
              tag:
                $ref: '#/components/schemas/TagProperty'
              transactionCount:
                $ref: '#/components/schemas/HelixId'
              transactionId:
                $ref: '#/components/schemas/AccountClose200Response/allOf/1/properties/data/properties/transactionId'
              type:
                type: string
              typeCode:
                type: string
              voidedDate:
                $ref: '#/components/schemas/CustomerSetLastContact200Response/allOf/1/properties/data/items/properties/lastContactDate'
    CustomerSetLastContact200Response:
      allOf:
      - $ref: '#/components/schemas/CardArray200Response/allOf/0'
      - type: object
        properties:
          data:
            type: array
            items:
              type: object
              properties:
                customerId:
                  $ref: '#/components/schemas/HelixId'
                dormancyStatus:
                  type: string
                  enum:
                  - Active
                  - Inactive
                  - Dormant
                lastContactDate:
                  type: string
                  format: date-time
                  example: '2021-01-07T19:00:59.761-06:00'
                lastContactType:
                  $ref: '#/components/schemas/LastContactType'
    TransferCreate200Response:
      allOf:
      - $ref: '#/components/schemas/CardArray200Response/allOf/0'
      - type: object
        properties:
          data:
            type: array
            items:
              $ref: '#/components/schemas/TransferVoid200Response/allOf/1/properties/data'
    TagProperty:
      type: string
      maxLength: 50
    HelixId:
      type: integer
      format: int32
      minimum: 1
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
