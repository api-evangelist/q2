openapi: 3.2.0
info:
  title: Helix Fee API
  version: 3.0.0
  description: Helix Public API (no customer KYC/IDV). **This spec covers all of Helix 3.x and is subject to change at any time.**
servers:
- url: https://sandbox-api.helix.q2.com
  description: Sandbox server
- url: https://api.helix.q2.com
  description: Production server
security:
- basicAuth: []
tags:
- name: Fee
  description: Endpoints for the fee object
paths:
  /fee/config/list/{feeEngineExecutionTypeId}:
    get:
      tags:
      - Fee
      summary: Get fees
      description: Retrieve all active fee configurations for the program. Use the optional `feeEngineExecutionTypeId` parameter to filter by fee type.
      externalDocs:
        url: https://docs.helix.q2.com/reference/feeconfiglist
      operationId: feeConfigList
      parameters:
      - name: feeEngineExecutionTypeId
        in: path
        required: true
        description: 'Filter fees by type. Supported values:

          - `0` = All

          - `2` = Card transaction fees

          - `3` = Monthly batch fees

          - `4` = Card maintenance fees

          - `5` = Manual fees

          - `6` = Card scheduled fees

          - `7` = Money movement fees

          '
        schema:
          $ref: '#/components/schemas/AccountClose200Response/allOf/1/properties/data/properties/transactionId'
      responses:
        '200':
          description: An array of <a href="https://docs.helix.q2.com/docs/fee-configuration" target="_blank">feeConfiguration</a> objects.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeeObject200Response'
        '400':
          $ref: '#/paths/~1card~1lock/post/responses/400'
        '401':
          $ref: '#/paths/~1card~1lock/post/responses/401'
        '404':
          $ref: '#/paths/~1card~1lock/post/responses/404'
        '405':
          $ref: '#/paths/~1card~1lock/post/responses/405'
        '429':
          $ref: '#/paths/~1card~1lock/post/responses/429'
  /fee/get/{feeToApplyId}:
    get:
      tags:
      - Fee
      summary: Get a fee record by FeeToApplyId
      description: Retrieve a fee lookup record by the Helix-assigned `feeToApplyId`.
      externalDocs:
        url: https://docs.helix.q2.com/reference/feeget
      operationId: feeGet
      parameters:
      - name: feeToApplyId
        in: path
        required: true
        description: The primary identifier of the fee work item. Must be greater than `0`.
        schema:
          type: integer
          format: int64
          minimum: 1
      responses:
        '200':
          description: An <a href="https://docs.helix.q2.com/reference/response-format" target="_blank">envelope</a> whose data node is a fee lookup object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeeLookupObject200Response'
        '400':
          $ref: '#/paths/~1card~1lock/post/responses/400'
        '401':
          $ref: '#/paths/~1card~1lock/post/responses/401'
        '404':
          $ref: '#/paths/~1card~1lock/post/responses/404'
        '405':
          $ref: '#/paths/~1card~1lock/post/responses/405'
        '429':
          $ref: '#/paths/~1card~1lock/post/responses/429'
  /fee/getByCustomerTag/{customerFeeTag}:
    get:
      tags:
      - Fee
      summary: Get a fee record by customer fee tag
      description: Retrieve the most recent fee lookup record for the given `customerFeeTag`.
      externalDocs:
        url: https://docs.helix.q2.com/reference/feegetbycustomertag
      operationId: feeGetByCustomerTag
      parameters:
      - name: customerFeeTag
        in: path
        required: true
        description: Customer-facing tag used for fee lookup and correlation. The value cannot be null, empty, or whitespace and has a maximum length of 128 characters.
        schema:
          type: string
          minLength: 1
          maxLength: 128
      responses:
        '200':
          description: An <a href="https://docs.helix.q2.com/reference/response-format" target="_blank">envelope</a> whose data node is a fee lookup object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeeLookupObject200Response'
        '400':
          $ref: '#/paths/~1card~1lock/post/responses/400'
        '401':
          $ref: '#/paths/~1card~1lock/post/responses/401'
        '404':
          $ref: '#/paths/~1card~1lock/post/responses/404'
        '405':
          $ref: '#/paths/~1card~1lock/post/responses/405'
        '429':
          $ref: '#/paths/~1card~1lock/post/responses/429'
components:
  schemas:
    FeeLookupObject200Response:
      allOf:
      - $ref: '#/components/schemas/CardArray200Response/allOf/0'
      - type: object
        properties:
          data:
            type: object
            properties:
              feeToApplyId:
                type: integer
                format: int64
                description: Primary identifier of the fee work item.
              customerId:
                $ref: '#/components/schemas/HelixId'
              accountId:
                $ref: '#/components/schemas/HelixId'
              customerFeeTag:
                type: string
                description: Customer-facing tag used for lookup and correlation.
              masterId:
                type: integer
                format: int64
                description: Transaction master identifier associated to the fee when available.
              transactionId:
                type: integer
                format: int64
                description: Identifier of the fee transaction after the fee has posted.
              refundTransactionId:
                type: integer
                format: int64
                description: Identifier of the refund transaction when a refund has posted.
              reversalTransactionIds:
                type: array
                description: Reversal transaction identifiers associated to this fee.
                items:
                  type: integer
                  format: int64
              reversalToApplyIds:
                type: array
                description: Reversal fee work-item identifiers associated to this fee.
                items:
                  type: integer
                  format: int64
              feeAmount:
                type: number
                format: decimal
                description: Fee amount recorded for the fee work item.
              transactionAmount:
                type: number
                format: decimal
                description: Posted transaction amount when available.
              feeToApplyState:
                type: integer
                format: int32
                description: Current internal fee state enum value.
              feeWaiverCode:
                type: string
                description: Waiver reason or waiver code when the fee was waived or partially waived.
              feeWaiverAmount:
                type: number
                format: decimal
                description: Waived amount for the fee.
    CardArray200Response:
      allOf:
      - type: object
        properties:
          errors:
            type: array
            items: {}
            example: []
          requestId:
            type: string
            example: 1249a3bf-aca1-40dd-9fba-2a3193550c39
          status:
            type: integer
            enum:
            - 200
          throttle:
            type: object
            properties:
              periodEndsAt:
                $ref: '#/components/schemas/CustomerSetLastContact200Response/allOf/1/properties/data/items/properties/lastContactDate'
              periodLengthInSeconds:
                $ref: '#/components/schemas/HelixId'
              periodRequestLimit:
                $ref: '#/components/schemas/HelixId'
              requestsRemainingInPeriod:
                $ref: '#/components/schemas/HelixId'
              warningThreshold:
                type: number
                format: decimal
                example: 0.2
      - type: object
        properties:
          data:
            type: array
            items:
              $ref: '#/components/schemas/CardObject200Response/allOf/1/properties/data'
    AccountClose200Response:
      allOf:
      - $ref: '#/components/schemas/CardArray200Response/allOf/0'
      - type: object
        properties:
          data:
            type: object
            properties:
              customerId:
                $ref: '#/components/schemas/HelixId'
              accountId:
                $ref: '#/components/schemas/HelixId'
              closeToAccountId:
                $ref: '#/components/schemas/HelixId'
              transactionId:
                type: integer
                format: int64
                minimum: 1
              transactionTag:
                $ref: '#/components/schemas/TagProperty'
              closingBalanceAmount:
                type: number
                format: decimal
              interestPaidAmount:
                type: number
                format: decimal
              totalClosingAmount:
                type: number
                format: decimal
              isClosedToExternalAccount:
                type: boolean
    CustomerSetLastContact200Response:
      allOf:
      - $ref: '#/components/schemas/CardArray200Response/allOf/0'
      - type: object
        properties:
          data:
            type: array
            items:
              type: object
              properties:
                customerId:
                  $ref: '#/components/schemas/HelixId'
                dormancyStatus:
                  type: string
                  enum:
                  - Active
                  - Inactive
                  - Dormant
                lastContactDate:
                  type: string
                  format: date-time
                  example: '2021-01-07T19:00:59.761-06:00'
                lastContactType:
                  $ref: '#/components/schemas/LastContactType'
    FeeObject200Response:
      allOf:
      - $ref: '#/components/schemas/CardArray200Response/allOf/0'
      - type: object
        properties:
          data:
            type: array
            items:
              type: object
              properties:
                amount:
                  type: number
                  format: decimal
                description:
                  type: string
                feeCode:
                  type: string
                feeTypeId:
                  $ref: '#/components/schemas/AccountClose200Response/allOf/1/properties/data/properties/transactionId'
    HelixId:
      type: integer
      format: int32
      minimum: 1
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
