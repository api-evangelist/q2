openapi: 3.2.0
info:
  title: Helix Card - Limit API
  version: 3.0.0
  description: Helix Public API (no customer KYC/IDV). **This spec covers all of Helix 3.x and is subject to change at any time.**
servers:
- url: https://sandbox-api.helix.q2.com
  description: Sandbox server
- url: https://api.helix.q2.com
  description: Production server
security:
- basicAuth: []
tags:
- name: Card - Limit
  description: Endpoints related to card limits
paths:
  /card/limit/get/{customerId}/{cardId}:
    get:
      tags:
      - Card - Limit
      summary: Get card limits
      description: Retrieve all card limits for the given `customerId` and `cardId`.
      externalDocs:
        url: https://docs.helix.q2.com/reference/cardlimitget
      operationId: cardLimitGet
      parameters:
      - $ref: '#/components/parameters/CustomerIdPath'
      - $ref: '#/components/parameters/CardIdPath'
      responses:
        '200':
          description: An <a href="https://docs.helix.q2.com/reference/response-format" target="_blank">envelope</a> whose data node is a <a href="https://docs.helix.q2.com/docs/card-limits" target="_blank">cardLimits</a> object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardLimitsObject200Response'
        '400':
          $ref: '#/paths/~1card~1lock/post/responses/400'
        '401':
          $ref: '#/paths/~1card~1lock/post/responses/401'
        '404':
          $ref: '#/paths/~1card~1lock/post/responses/404'
        '405':
          $ref: '#/paths/~1card~1lock/post/responses/405'
        '429':
          $ref: '#/paths/~1card~1lock/post/responses/429'
  /card/limit/override:
    post:
      tags:
      - Card - Limit
      summary: Override default card limits
      description: Override default card limits for the given `customerId` and `cardId`.
      externalDocs:
        url: https://docs.helix.q2.com/reference/cardlimitoverride
      operationId: cardLimitOverride
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - customerId
              - cardId
              - classification
              properties:
                customerId:
                  $ref: '#/components/schemas/HelixId'
                cardId:
                  $ref: '#/components/schemas/HelixId'
                classification:
                  allOf:
                  - description: For `highrisk` the `purchaseLimit` and/or `withdrawalLimit` must be lower than the program default limits. For `lowrisk` the `purhcaseLimit` and/or `withdrawalLimit` must be lower than the bank ceiling limits but higher than the program default limits. Program and bank limits can be obtained via [/card/limit/get](https://docs.helix.q2.com/reference/cardlimitget). For `businesscard` the `purchaseLimit` and/or `withdrawalLimit` should be defined based on business defined per cardholder.
                  - type: string
                    enum:
                    - highrisk
                    - lowrisk
                    - businesscard
                purchaseLimit:
                  type: number
                  format: decimal
                  minimum: 0
                  description: Required if `withdrawalLimit` not present
                withdrawalLimit:
                  type: number
                  format: decimal
                  description: Required if `purchaseLimit` not present
                  minimum: 0
      responses:
        '200':
          description: An <a href="https://docs.helix.q2.com/reference/response-format" target="_blank">envelope</a> whose data node is a <a href="https://docs.helix.q2.com/docs/card-limits" target="_blank">cardLimits</a> object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardLimitsObject200Response'
        '400':
          $ref: '#/paths/~1card~1lock/post/responses/400'
        '401':
          $ref: '#/paths/~1card~1lock/post/responses/401'
        '404':
          $ref: '#/paths/~1card~1lock/post/responses/404'
        '405':
          $ref: '#/paths/~1card~1lock/post/responses/405'
        '429':
          $ref: '#/paths/~1card~1lock/post/responses/429'
  /card/limit/reset:
    post:
      tags:
      - Card - Limit
      summary: Reset card limits
      description: Allow a semi-permanent card limit override (i.e., high risk, low risk customer) to be reset to default program limit values. This endpoint does not remove a temporary override.
      externalDocs:
        url: https://docs.helix.q2.com/reference/cardlimitreset
      operationId: cardLimitReset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - customerId
              - cardId
              properties:
                customerId:
                  $ref: '#/components/schemas/HelixId'
                cardId:
                  $ref: '#/components/schemas/HelixId'
      responses:
        '200':
          description: An <a href="https://docs.helix.q2.com/reference/response-format" target="_blank">envelope</a> whose data node is a <a href="https://docs.helix.q2.com/docs/card-limits" target="_blank">cardLimits</a> object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardLimitsObject200Response'
        '400':
          $ref: '#/paths/~1card~1lock/post/responses/400'
        '401':
          $ref: '#/paths/~1card~1lock/post/responses/401'
        '404':
          $ref: '#/paths/~1card~1lock/post/responses/404'
        '405':
          $ref: '#/paths/~1card~1lock/post/responses/405'
        '429':
          $ref: '#/paths/~1card~1lock/post/responses/429'
  /card/limit/temporaryOverride:
    post:
      tags:
      - Card - Limit
      summary: Create a temporary card limit
      description: Allow temporary dollar limit increase requests (e.g., one-time large purchases, large ATM withdrawal) that are higher than standard program limits, but below program-defined limit group settings.
      externalDocs:
        url: https://docs.helix.q2.com/reference/cardlimittemporaryoverride
      operationId: cardLimitTemporaryOverride
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - customerId
              - cardId
              - comment
              properties:
                customerId:
                  $ref: '#/components/schemas/HelixId'
                cardId:
                  $ref: '#/components/schemas/HelixId'
                purchaseLimit:
                  type: number
                  format: decimal
                  description: Required if `withdrawalLimit` not present
                  minimum: 0
                withdrawalLimit:
                  type: number
                  format: decimal
                  description: Required if `purchaseLimit` not present
                  minimum: 0
                comment:
                  type: string
                  description: Free-form comment for why the temporary limit is being placed
      responses:
        '200':
          description: An <a href="https://docs.helix.q2.com/reference/response-format" target="_blank">envelope</a> whose data node is a <a href="https://docs.helix.q2.com/docs/card-limits" target="_blank">cardLimits</a> object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardLimitsObject200Response'
        '400':
          $ref: '#/paths/~1card~1lock/post/responses/400'
        '401':
          $ref: '#/paths/~1card~1lock/post/responses/401'
        '404':
          $ref: '#/paths/~1card~1lock/post/responses/404'
        '405':
          $ref: '#/paths/~1card~1lock/post/responses/405'
        '429':
          $ref: '#/paths/~1card~1lock/post/responses/429'
components:
  schemas:
    CardLimitsObject200Response:
      allOf:
      - $ref: '#/components/schemas/CardArray200Response/allOf/0'
      - type: object
        properties:
          data:
            type: object
            properties:
              bankCeiling:
                type: object
                properties:
                  purchaseLimit:
                    type: number
                    format: decimal
                    minimum: 0
                  withdrawalLimit:
                    type: number
                    format: decimal
                    minimum: 0
              cardId:
                $ref: '#/components/schemas/HelixId'
              customerId:
                $ref: '#/components/schemas/HelixId'
              effectiveDailyLimits:
                $ref: '#/components/schemas/CardLimitsObject200Response/allOf/1/properties/data/properties/bankCeiling'
              limitGroupOverride:
                allOf:
                - $ref: '#/components/schemas/CardLimitsObject200Response/allOf/1/properties/data/properties/bankCeiling'
                - type: object
                  properties:
                    classification:
                      $ref: '#/components/schemas/CardClassification'
              programDefault:
                allOf:
                - $ref: '#/components/schemas/CardLimitsObject200Response/allOf/1/properties/data/properties/bankCeiling'
                - type: object
                  properties:
                    limitGroupId:
                      $ref: '#/components/schemas/HelixId'
              temporaryOverride:
                allOf:
                - $ref: '#/components/schemas/CardLimitsObject200Response/allOf/1/properties/data/properties/bankCeiling'
                - type: object
                  properties:
                    expirationDate:
                      type: string
                      format: date-time
                    comment:
                      type: string
    CardArray200Response:
      allOf:
      - type: object
        properties:
          errors:
            type: array
            items: {}
            example: []
          requestId:
            type: string
            example: 1249a3bf-aca1-40dd-9fba-2a3193550c39
          status:
            type: integer
            enum:
            - 200
          throttle:
            type: object
            properties:
              periodEndsAt:
                $ref: '#/components/schemas/CustomerSetLastContact200Response/allOf/1/properties/data/items/properties/lastContactDate'
              periodLengthInSeconds:
                $ref: '#/components/schemas/HelixId'
              periodRequestLimit:
                $ref: '#/components/schemas/HelixId'
              requestsRemainingInPeriod:
                $ref: '#/components/schemas/HelixId'
              warningThreshold:
                type: number
                format: decimal
                example: 0.2
      - type: object
        properties:
          data:
            type: array
            items:
              $ref: '#/components/schemas/CardObject200Response/allOf/1/properties/data'
    CustomerSetLastContact200Response:
      allOf:
      - $ref: '#/components/schemas/CardArray200Response/allOf/0'
      - type: object
        properties:
          data:
            type: array
            items:
              type: object
              properties:
                customerId:
                  $ref: '#/components/schemas/HelixId'
                dormancyStatus:
                  type: string
                  enum:
                  - Active
                  - Inactive
                  - Dormant
                lastContactDate:
                  type: string
                  format: date-time
                  example: '2021-01-07T19:00:59.761-06:00'
                lastContactType:
                  $ref: '#/components/schemas/LastContactType'
    CardClassification:
      type: string
      enum:
      - highrisk
      - lowrisk
      - businesscard
    HelixId:
      type: integer
      format: int32
      minimum: 1
  parameters:
    CustomerIdPath:
      name: customerId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/HelixId'
    CardIdPath:
      name: cardId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/HelixId'
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
