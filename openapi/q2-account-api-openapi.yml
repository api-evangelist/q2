openapi: 3.2.0
info:
  title: Helix Account API
  version: 3.0.0
  description: Helix Public API (no customer KYC/IDV). **This spec covers all of Helix 3.x and is subject to change at any time.**
servers:
- url: https://sandbox-api.helix.q2.com
  description: Sandbox server
- url: https://api.helix.q2.com
  description: Production server
security:
- basicAuth: []
tags:
- name: Account
  description: Endpoints for the account object
paths:
  /account/close:
    post:
      tags:
      - Account
      summary: Close an account
      description: Close an account. If the account balance is greater than $0 or any interest is owed on the account those amounts are calculated and a transaction is implicitly created with the sum of those amounts being credited into the given `closeToAccountId`. That transaction's `tag` property is also assigned the value in the `transactionTag` property (if specified).
      externalDocs:
        url: https://docs.helix.q2.com/reference/accountclose
      operationId: accountClose
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - customerId
              - accountId
              properties:
                customerId:
                  $ref: '#/components/schemas/HelixId'
                accountId:
                  $ref: '#/components/schemas/HelixId'
                closeToAccountId:
                  allOf:
                  - description: "The Helix-assigned ID for the account to receive remaining funds. This can be the accountId of an \n<a href=\"https://docs.helix.q2.com/docs/account\" target=\"_blank\">account</a> or the externalAccountId of an \n<a href=\"https://docs.helix.q2.com/docs/external-account\" target=\"_blank\">externalAccount</a>. \n**Notes:** `closeToAccountId` is required if the account has a balance or earns interest. \nTo close to a petty cash account, use the Helix Admin Console or the \n<a href=\"https://docs.helix.q2.com/docs/bulk-account-close-process\" target=\"_blank\">Bulk Account Close Process</a>.\n"
                  - $ref: '#/components/schemas/HelixId'
                transactionTag:
                  allOf:
                  - description: A program-wide unique identifier that is to be associated with the transaction created to move any funds out of the account being closed.
                  - $ref: '#/components/schemas/TagProperty'
                closeReason:
                  type: string
                  enum:
                  - Fraud
                  - Never funded
                  - BSA reasons
                  - Relationship ended
                  - Deceased
                  - Other
                  - Consolidating Bank Accounts
                  - re-CIP
                  - Risk-Related
                  - Member Requested
                  - Negative Balance (Reopen Eligible)
                  - Negative Balance (Reopen Ineligible)
                  - ID Theft
                  - Account Take Over
                  - Dormant
                  description: "The following values are not enabled by default and require additional configuration. Contact the Helix Support team for more information.\n \n- `re-CIP`\n- `Risk-Related`\n- `Member Requested`\n- `Negative Balance (Reopen Eligible)`\n- `Negative Balance (Reopen Ineligible)`\n- `ID Theft`\n- `Account Take Over`\n- `Dormant`\n"
                closeReasonNotes:
                  type: string
                  maxLength: 255
                  description: Required if `closeReason` is `Other`
      responses:
        '200':
          description: The account closure and transaction (if applicable) details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountClose200Response'
        '400':
          $ref: '#/paths/~1card~1lock/post/responses/400'
        '401':
          $ref: '#/paths/~1card~1lock/post/responses/401'
        '404':
          $ref: '#/paths/~1card~1lock/post/responses/404'
        '405':
          $ref: '#/paths/~1card~1lock/post/responses/405'
        '429':
          $ref: '#/paths/~1card~1lock/post/responses/429'
  /account/create:
    post:
      tags:
      - Account
      summary: Create an account
      description: Create a new account for a customer. See account object definition for parameter details.
      externalDocs:
        url: https://docs.helix.q2.com/reference/accountcreate
      operationId: accountCreate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - customerId
              - name
              - productId
              properties:
                customerId:
                  allOf:
                  - description: The Helix-assigned ID for the customer who owns the account. For business accounts, this is the `customerId` of the business entity.
                  - $ref: '#/components/schemas/HelixId'
                name:
                  type: string
                  maxLength: 50
                productId:
                  $ref: '#/components/schemas/HelixId'
                targetDate:
                  type: string
                  format: date-time
                  example: '2000-07-04T00:00:00.000+00:00'
                isclosable:
                  type: boolean
                category:
                  type: string
                  maxLength: 50
                subcategory:
                  type: string
                  maxLength: 50
                tag:
                  $ref: '#/components/schemas/TagProperty'
                recurringContributionType:
                  type: string
                  enum:
                  - None
                  - BiWeekly
                  - Monthly
                recurringContributionAmount:
                  type: number
                  format: decimal
                recurringContributionFromExternalAccountId:
                  $ref: '#/components/schemas/HelixId'
                recurringContributionStartDate:
                  $ref: '#/components/schemas/DateTimeProperty'
                recurringContributionEndDate:
                  $ref: '#/components/schemas/DateTimeProperty'
                customField1:
                  type: string
                  maxLength: 50
                customField2:
                  type: string
                  maxLength: 50
                customField3:
                  type: string
                  maxLength: 50
                customField4:
                  type: string
                  maxLength: 50
                customField5:
                  type: string
                  maxLength: 50
                accountMinimumBalance:
                  type: number
                  format: decimal
                requestingCustomerId:
                  allOf:
                  - description: The Helix-assigned unique ID for the customer requesting to open the account. Only used when opening a business account.
                  - $ref: '#/components/schemas/HelixId'
                accountNumber:
                  type: string
                  maxLength: 50
                  pattern: ^[0-9]{1,50}$
                  description: If none specified, Helix will automatically assign an account number. **Note:** Custom account numbers requires approval from Q2 and your bank partner. Custom account numbers must be numeric.
                legalName1:
                  type: string
                  maxLength: 100
                legalName2:
                  $ref: '#/components/schemas/LegalName'
      responses:
        '200':
          description: An <a href="https://docs.helix.q2.com/reference/response-format" target="_blank">envelope</a> whose data node is a <a href="https://docs.helix.q2.com/docs/account" target="_blank">account</a> object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountObject200Response'
        '400':
          $ref: '#/paths/~1card~1lock/post/responses/400'
        '401':
          $ref: '#/paths/~1card~1lock/post/responses/401'
        '404':
          $ref: '#/paths/~1card~1lock/post/responses/404'
        '405':
          $ref: '#/paths/~1card~1lock/post/responses/405'
        '429':
          $ref: '#/paths/~1card~1lock/post/responses/429'
  /account/get/{customerId}/{accountId}:
    get:
      tags:
      - Account
      summary: Get an account
      description: Retrieve a single account for the given `customerId` and `accountId`.
      externalDocs:
        url: https://docs.helix.q2.com/reference/accountget
      operationId: accountGet
      parameters:
      - $ref: '#/components/parameters/CustomerIdPath'
      - name: accountId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/HelixId'
      responses:
        '200':
          description: An <a href="https://docs.helix.q2.com/docs/account" target="_blank">account</a> object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountObject200Response'
        '400':
          $ref: '#/paths/~1card~1lock/post/responses/400'
        '401':
          $ref: '#/paths/~1card~1lock/post/responses/401'
        '404':
          $ref: '#/paths/~1card~1lock/post/responses/404'
        '405':
          $ref: '#/paths/~1card~1lock/post/responses/405'
        '429':
          $ref: '#/paths/~1card~1lock/post/responses/429'
  /account/getByTag/{customerId}/{tag}:
    get:
      tags:
      - Account
      summary: Get an account via tag
      description: Retrieve a single account for the given `customerId` and `tag`.
      externalDocs:
        url: https://docs.helix.q2.com/reference/accountgetbytag
      operationId: accountGetByTag
      parameters:
      - $ref: '#/components/parameters/CustomerIdPath'
      - $ref: '#/components/parameters/TagPath'
      responses:
        '200':
          description: An <a href="https://docs.helix.q2.com/reference/response-format" target="_blank">envelope</a> whose data node is a <a href="https://docs.helix.q2.com/docs/account" target="_blank">account</a> object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountObject200Response'
        '400':
          $ref: '#/paths/~1card~1lock/post/responses/400'
        '401':
          $ref: '#/paths/~1card~1lock/post/responses/401'
        '404':
          $ref: '#/paths/~1card~1lock/post/responses/404'
        '405':
          $ref: '#/paths/~1card~1lock/post/responses/405'
        '429':
          $ref: '#/paths/~1card~1lock/post/responses/429'
  /account/list/{customerId}:
    get:
      tags:
      - Account
      summary: List accounts
      description: Retrieve all accounts for the given `customerId`. Accounts with `status=Closed` may disappear from this list after a period of time no shorter than 32 days.
      externalDocs:
        url: https://docs.helix.q2.com/reference/accountlist
      operationId: accountList
      parameters:
      - $ref: '#/components/parameters/CustomerIdPath'
      responses:
        '200':
          description: An array of <a href="https://docs.helix.q2.com/docs/account" target="_blank">account</a> objects
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountArray200Response'
        '400':
          $ref: '#/paths/~1card~1lock/post/responses/400'
        '401':
          $ref: '#/paths/~1card~1lock/post/responses/401'
        '404':
          $ref: '#/paths/~1card~1lock/post/responses/404'
        '405':
          $ref: '#/paths/~1card~1lock/post/responses/405'
        '429':
          $ref: '#/paths/~1card~1lock/post/responses/429'
  /account/lock:
    post:
      tags:
      - Account
      summary: Lock an account
      description: Lock an account. Most locks can be reversed by calling /account/unlock. Please check the /account/unlock documentation to see which lock scenarios can be subsequently unlocked. Will apply a lockTypeCode of `CST` or `SYS` on success and the account will be locked, meaning no funds transfers can take place.
      externalDocs:
        url: https://docs.helix.q2.com/reference/accountlock
      operationId: accountLock
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - customerId
              - accountId
              - lockTypeCode
              - lockReasonTypeCode
              properties:
                customerId:
                  $ref: '#/components/schemas/HelixId'
                accountId:
                  $ref: '#/components/schemas/HelixId'
                lockTypeCode:
                  type: string
                  enum:
                  - CST
                  - SYS
                  description: '- `CST`: Customer Locked

                    - `SYS`: System Locked

                    '
                lockReasonTypeCode:
                  type: string
                  enum:
                  - UNK
                  - FRD
                  - ADM
                  - TMP
                  - FRZ
                  - SUS
                  - CO
                  - RTN
                  - REC
                  - DED
                  - DOR
                  description: '- `UNK`: Unknown

                    - `FRD`: Fraud investigation

                    - `ADM`: Administrative

                    - `TMP`: Temporary

                    - `FRZ`: Freeze

                    - `SUS`: Suspected fraud

                    - `CO`: Credits only

                    - `RTN`: Return risk

                    - `REC`: Recovery

                    - `DED`: Deceased

                    - `DOR`: Dormant

                    '
                accountLockClassificationCode:
                  type:
                  - string
                  - 'null'
                  maxLength: 10
                  description: An optional program-configured classification code for the lock. Must be a value from the configured list for the program.
      responses:
        '200':
          description: An <a href="https://docs.helix.q2.com/reference/response-format" target="_blank">envelope</a> whose data node is a <a href="https://docs.helix.q2.com/docs/account" target="_blank">account</a> object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountObject200Response'
        '400':
          $ref: '#/paths/~1card~1lock/post/responses/400'
        '401':
          $ref: '#/paths/~1card~1lock/post/responses/401'
        '404':
          $ref: '#/paths/~1card~1lock/post/responses/404'
        '405':
          $ref: '#/paths/~1card~1lock/post/responses/405'
        '429':
          $ref: '#/paths/~1card~1lock/post/responses/429'
  /account/unlock:
    post:
      tags:
      - Account
      summary: Unlock an account
      description: 'The following matrix details when this call will succeed or fail


        | Current lockTypeCode | Current lockReasonTypeCode | Result |

        | -------------------- | -------------------------- | ------ |

        | `CST` | `UNK` - Unknown | Success |

        | `CST` | `TMP` - Temporary | Success |

        | `CST` | `FRZ` - Freeze | Success |

        | `CST` | `ADM` - Administrative | Success |

        | `CST` | `SUS` - Suspected fraud | Success |

        | `CST` | `CO` - Credits only | Success |

        | `CST` | `RTN` - Return risk | Success |

        | `CST` | `REC` - Recovery | Success |

        | `CST` | `DED` - Deceased | Success |

        | `CST` | `DOR` - Dormant | Success |

        | `CST` | `FRD` - Fraud investigation | Fail - Fraud investigation lock can not be unlocked by CST |

        | `SYS` | `TMP`, `FRD`, `FRZ`, `ADM`, `SUS`, `CO` | Fail - SYS lock type cannot be unlocked by CST |


        The account will have a `lockTypeCode` of `UNL` upon successful completion of this call. The account is unlocked and ready for transfers to take place.'
      externalDocs:
        url: https://docs.helix.q2.com/reference/accountunlock
      operationId: accountUnlock
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - customerId
              - accountId
              properties:
                customerId:
                  $ref: '#/components/schemas/HelixId'
                accountId:
                  $ref: '#/components/schemas/HelixId'
      responses:
        '200':
          description: An <a href="https://docs.helix.q2.com/reference/response-format" target="_blank">envelope</a> whose data node is a <a href="https://docs.helix.q2.com/docs/account" target="_blank">account</a> object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountObject200Response'
        '400':
          $ref: '#/paths/~1card~1lock/post/responses/400'
        '401':
          $ref: '#/paths/~1card~1lock/post/responses/401'
        '404':
          $ref: '#/paths/~1card~1lock/post/responses/404'
        '405':
          $ref: '#/paths/~1card~1lock/post/responses/405'
        '429':
          $ref: '#/paths/~1card~1lock/post/responses/429'
  /account/update:
    post:
      tags:
      - Account
      summary: Update an account
      description: See account object definition for parameter details.
      externalDocs:
        url: https://docs.helix.q2.com/reference/accountupdate
      operationId: accountUpdate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - customerId
              - accountId
              - name
              properties:
                customerId:
                  $ref: '#/components/schemas/HelixId'
                accountId:
                  $ref: '#/components/schemas/HelixId'
                name:
                  type: string
                  maxLength: 50
                productId:
                  allOf:
                  - description: '**Note:**`productId` updates are not real-time in the production environment. Changes may be delayed by up to 24 hours.'
                  - $ref: '#/components/schemas/HelixId'
                targetAmount:
                  type: number
                  format: decimal
                targetDate:
                  $ref: '#/components/schemas/DateTimeProperty'
                category:
                  type: string
                  maxLength: 50
                subcategory:
                  type: string
                  maxLength: 50
                tag:
                  $ref: '#/components/schemas/TagProperty'
                recurringContributionType:
                  $ref: '#/components/schemas/RecurringContributionType'
                recurringContributionAmount:
                  type: number
                  format: decimal
                recurringContributionFromExternalAccountId:
                  $ref: '#/components/schemas/HelixId'
                recurringContributionStartDate:
                  $ref: '#/components/schemas/DateTimeProperty'
                recurringContributionEndDate:
                  $ref: '#/components/schemas/DateTimeProperty'
                customField1:
                  type: string
                  maxLength: 50
                customField2:
                  type: string
                  maxLength: 50
                customField3:
                  type: string
                  maxLength: 50
                customField4:
                  type: string
                  maxLength: 50
                customField5:
                  type: string
                  maxLength: 50
                accountMinimumBalance:
                  type: number
                  format: decimal
      responses:
        '200':
          description: An <a href="https://docs.helix.q2.com/reference/response-format" target="_blank">envelope</a> whose data node is a <a href="https://docs.helix.q2.com/docs/account" target="_blank">account</a> object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountObject200Response'
        '400':
          $ref: '#/paths/~1card~1lock/post/responses/400'
        '401':
          $ref: '#/paths/~1card~1lock/post/responses/401'
        '404':
          $ref: '#/paths/~1card~1lock/post/responses/404'
        '405':
          $ref: '#/paths/~1card~1lock/post/responses/405'
        '429':
          $ref: '#/paths/~1card~1lock/post/responses/429'
components:
  schemas:
    LegalName:
      type: string
      maxLength: 100
    CardObject200Response:
      allOf:
      - $ref: '#/components/schemas/CardArray200Response/allOf/0'
      - type: object
        properties:
          data:
            type: object
            properties:
              accounts:
                type: array
                items:
                  type: object
                  properties:
                    accountBalance:
                      type: number
                      format: decimal
                    accountId:
                      $ref: '#/components/schemas/HelixId'
                    accountNumberMasked:
                      type: string
                    availableBalance:
                      type: number
                      format: decimal
                    balanceLastModifiedDate:
                      $ref: '#/components/schemas/CustomerSetLastContact200Response/allOf/1/properties/data/items/properties/lastContactDate'
                    cardPriority:
                      $ref: '#/components/schemas/CardPriority'
                    customerId:
                      $ref: '#/components/schemas/HelixId'
                    lastModifiedDate:
                      $ref: '#/components/schemas/CustomerSetLastContact200Response/allOf/1/properties/data/items/properties/lastContactDate'
                    name:
                      type: string
                    pendingBalance:
                      type: number
                      format: decimal
                    status:
                      $ref: '#/components/schemas/AccountObject200Response/allOf/1/properties/data/properties/status'
                    tag:
                      $ref: '#/components/schemas/TagProperty'
                    type:
                      $ref: '#/components/schemas/AccountObject200Response/allOf/1/properties/data/properties/type'
              archivedDate:
                $ref: '#/components/schemas/CustomerSetLastContact200Response/allOf/1/properties/data/items/properties/lastContactDate'
              binId:
                $ref: '#/components/schemas/HelixId'
              cardCarrierMessage:
                type: string
                description: 'Identifier used uniquely by various card production facilities for mapping card configurations.

                  '
              cardDesignIdentificationNumber:
                type: string
                description: 'Identifier used uniquely by various card production facilities for mapping card configurations.

                  '
              cardHolderCustomerId:
                $ref: '#/components/schemas/HelixId'
              cardId:
                $ref: '#/components/schemas/HelixId'
              cardNumberMasked:
                type: string
              cardVendorUniqueData:
                type: string
                description: 'Identifier used uniquely by various card production facilities for mapping card configurations.

                  '
              createdDate:
                $ref: '#/components/schemas/CustomerSetLastContact200Response/allOf/1/properties/data/items/properties/lastContactDate'
              customerId:
                $ref: '#/components/schemas/HelixId'
              deniedDate:
                $ref: '#/components/schemas/CustomerSetLastContact200Response/allOf/1/properties/data/items/properties/lastContactDate'
              digitalWalletTokens:
                type: array
                items:
                  type: object
                  properties:
                    device:
                      type: object
                      properties:
                        deviceId:
                          type: string
                        deviceIpAddress:
                          type: string
                        deviceLanguageCode:
                          type: string
                        deviceLocation:
                          type: string
                        deviceName:
                          type: string
                        deviceNumber:
                          type: string
                        deviceType:
                          type: string
                          enum:
                          - Card
                          - MobilePhone
                          - Tablet
                          - Watch
                          - MobileDevice
                          - FashionAccessory
                          - HomeAppliance
                          - KeyFob
                          - MediaOrGamingDevice
                          - MobileDeviceAccessory
                          - PCOrLaptop
                          - Vehicle
                          - UnknownOther
                    isDeviceProvisioned:
                      type: boolean
                    panReferenceId:
                      type: string
                    token:
                      type: string
                    tokenReferenceId:
                      type: string
                    tokenRequestorId:
                      type: string
                      enum:
                      - '40010030273'
                      - '40010075001'
                      - '40010043095'
                      - '40010075338'
                    tokenRequestorName:
                      type: string
                      enum:
                      - ApplePay
                      - GooglePay
                      - SamsungPay
                      - VisaCheckout
                    tokenStatus:
                      type: string
                      enum:
                      - ActiveForPayment
                      - Initiated
                      - SuspendedTemporarily
                      - DeactivatedPermanently
                    tokenType:
                      type: string
                      enum:
                      - Card on file
                      - Secure element
                      - Cloud based payment/HCE
                      - E-Commerce Enabler
                    walletInformation:
                      type: object
                      properties:
                        panSource:
                          type: string
                          enum:
                          - KeyEntered
                          - OnFile
                          - MobileBankingApp
                        walletAccountId:
                          type: string
                        walletEmailAddressHashed:
                          type: string
                        walletProviderDeviceScore:
                          type: string
                        walletProviderReasonCodes:
                          type: string
                        walletProviderRiskAssessmentType:
                          type: string
                          enum:
                          - Approved
                          - ApprovedConditionally
                          - NotApproved
                        walletProviderRiskAssessmentVersion:
                          type: string
              expireMonth:
                $ref: '#/components/schemas/MonthProperty'
              expireYear:
                $ref: '#/components/schemas/YearProperty'
              expiredDate:
                $ref: '#/components/schemas/CustomerSetLastContact200Response/allOf/1/properties/data/items/properties/lastContactDate'
              firstName:
                type: string
              isDigitalOnly:
                type: boolean
              isDualIssuanceSinglePAN:
                type: boolean
              isPINSet:
                type: boolean
              lastModifiedDate:
                $ref: '#/components/schemas/CustomerSetLastContact200Response/allOf/1/properties/data/items/properties/lastContactDate'
              lastName:
                type: string
              lockReasonTypeCode:
                type: string
                enum:
                - UNK
                - STL
                - LST
                - FRD
                - DMG
                - ADM
                - TMP
                - PIN
              lockTypeCode:
                type: string
                enum:
                - UNL
                - CST
                - SYS
              middleName:
                type: string
              nameOnCard:
                type: string
              nickName:
                type: string
              photoImageId:
                type: string
                description: 'Identifier used uniquely by various card production facilities for mapping card configurations.

                  '
              preferredName:
                type: string
              primaryAccountId:
                $ref: '#/components/schemas/HelixId'
              qualifierCode:
                $ref: '#/components/schemas/CardQualifierCode'
              reissuedDate:
                $ref: '#/components/schemas/CustomerSetLastContact200Response/allOf/1/properties/data/items/properties/lastContactDate'
              renewalOverride:
                $ref: '#/components/schemas/RenewalOverride'
              renewalOverrideReason:
                type: string
              requestedDate:
                $ref: '#/components/schemas/CustomerSetLastContact200Response/allOf/1/properties/data/items/properties/lastContactDate'
              status:
                type: string
                enum:
                - Initiated
                - Pending
                - PendingVerification
                - Verified
                - Denied
                - Expired
                - Archived
                - Reissued
                - Hotlisted
                - ReissuedPendingVerification
                - AutoReissuedPendingVerification
              tag:
                $ref: '#/components/schemas/TagProperty'
              typeCode:
                type: string
                enum:
                - DBT
              vendorTypeCode:
                $ref: '#/components/schemas/CardVendorTypeCode'
              verifiedDate:
                $ref: '#/components/schemas/CustomerSetLastContact200Response/allOf/1/properties/data/items/properties/lastContactDate'
    AccountObject200Response:
      allOf:
      - $ref: '#/components/schemas/CardArray200Response/allOf/0'
      - type: object
        properties:
          data:
