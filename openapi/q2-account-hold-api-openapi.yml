openapi: 3.2.0
info:
  title: Helix Account - Hold API
  version: 3.0.0
  description: Helix Public API (no customer KYC/IDV). **This spec covers all of Helix 3.x and is subject to change at any time.**
servers:
- url: https://sandbox-api.helix.q2.com
  description: Sandbox server
- url: https://api.helix.q2.com
  description: Production server
security:
- basicAuth: []
tags:
- name: Account - Hold
  description: Endpoints related to account holds
paths:
  /account/placeHold:
    post:
      tags:
      - Account - Hold
      summary: Place a hold
      description: Place an indefinite hold on funds in a customer's account. Can be reversed by calling /account/releaseHold.
      externalDocs:
        url: https://docs.helix.q2.com/reference/accountplacehold
      operationId: accountPlaceHold
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - customerId
              - accountId
              - holdAmount
              - holdDescription
              properties:
                customerId:
                  $ref: '#/components/schemas/HelixId'
                accountId:
                  $ref: '#/components/schemas/HelixId'
                holdAmount:
                  type: number
                  format: decimal
                  description: The dollar amount of funds to place on hold
                holdDescription:
                  type: string
                  maxLength: 255
                  description: Free-form description for why the hold is being placed
                expirationDate:
                  allOf:
                  - description: The hold will expire shortly afer midnight (in the Bank of Record's timezone) on the date provided. **Note:** The time provided must be midnight (00:00:00.000)
                  - $ref: '#/components/schemas/DateTimeProperty'
      responses:
        '200':
          description: An <a href="https://docs.helix.q2.com/reference/response-format" target="_blank">envelope</a> whose data node is a <a href="https://docs.helix.q2.com/docs/account" target="_blank">account</a> object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountObject200Response'
        '400':
          $ref: '#/paths/~1card~1lock/post/responses/400'
        '401':
          $ref: '#/paths/~1card~1lock/post/responses/401'
        '404':
          $ref: '#/paths/~1card~1lock/post/responses/404'
        '405':
          $ref: '#/paths/~1card~1lock/post/responses/405'
        '429':
          $ref: '#/paths/~1card~1lock/post/responses/429'
  /account/releaseHold:
    post:
      tags:
      - Account - Hold
      summary: Release a hold
      description: Release a hold on funds (created via /account/placeHold) in a customer's account.
      externalDocs:
        url: https://docs.helix.q2.com/reference/accountreleasehold
      operationId: accountReleaseHold
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - customerId
              - accountId
              properties:
                customerId:
                  allOf:
                  - description: The Helix-assigned unique ID for the customer who owns the account
                  - $ref: '#/components/schemas/HelixId'
                accountId:
                  allOf:
                  - description: The Helix-assigned unique ID for the account
                  - $ref: '#/components/schemas/HelixId'
      responses:
        '200':
          description: An <a href="https://docs.helix.q2.com/reference/response-format" target="_blank">envelope</a> whose data node is a <a href="https://docs.helix.q2.com/docs/account" target="_blank">account</a> object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountObject200Response'
        '400':
          $ref: '#/paths/~1card~1lock/post/responses/400'
        '401':
          $ref: '#/paths/~1card~1lock/post/responses/401'
        '404':
          $ref: '#/paths/~1card~1lock/post/responses/404'
        '405':
          $ref: '#/paths/~1card~1lock/post/responses/405'
        '429':
          $ref: '#/paths/~1card~1lock/post/responses/429'
components:
  schemas:
    HelixId:
      type: integer
      format: int32
      minimum: 1
    DateTimeProperty:
      type: string
      format: date-time
      example: '2000-07-04T00:00:00.000+00:00'
    CardArray200Response:
      allOf:
      - type: object
        properties:
          errors:
            type: array
            items: {}
            example: []
          requestId:
            type: string
            example: 1249a3bf-aca1-40dd-9fba-2a3193550c39
          status:
            type: integer
            enum:
            - 200
          throttle:
            type: object
            properties:
              periodEndsAt:
                $ref: '#/components/schemas/CustomerSetLastContact200Response/allOf/1/properties/data/items/properties/lastContactDate'
              periodLengthInSeconds:
                $ref: '#/components/schemas/HelixId'
              periodRequestLimit:
                $ref: '#/components/schemas/HelixId'
              requestsRemainingInPeriod:
                $ref: '#/components/schemas/HelixId'
              warningThreshold:
                type: number
                format: decimal
                example: 0.2
      - type: object
        properties:
          data:
            type: array
            items:
              $ref: '#/components/schemas/CardObject200Response/allOf/1/properties/data'
    LegalName:
      type: string
      maxLength: 100
    CardObject200Response:
      allOf:
      - $ref: '#/components/schemas/CardArray200Response/allOf/0'
      - type: object
        properties:
          data:
            type: object
            properties:
              accounts:
                type: array
                items:
                  type: object
                  properties:
                    accountBalance:
                      type: number
                      format: decimal
                    accountId:
                      $ref: '#/components/schemas/HelixId'
                    accountNumberMasked:
                      type: string
                    availableBalance:
                      type: number
                      format: decimal
                    balanceLastModifiedDate:
                      $ref: '#/components/schemas/CustomerSetLastContact200Response/allOf/1/properties/data/items/properties/lastContactDate'
                    cardPriority:
                      $ref: '#/components/schemas/CardPriority'
                    customerId:
                      $ref: '#/components/schemas/HelixId'
                    lastModifiedDate:
                      $ref: '#/components/schemas/CustomerSetLastContact200Response/allOf/1/properties/data/items/properties/lastContactDate'
                    name:
                      type: string
                    pendingBalance:
                      type: number
                      format: decimal
                    status:
                      $ref: '#/components/schemas/AccountObject200Response/allOf/1/properties/data/properties/status'
                    tag:
                      $ref: '#/components/schemas/TagProperty'
                    type:
                      $ref: '#/components/schemas/AccountObject200Response/allOf/1/properties/data/properties/type'
              archivedDate:
                $ref: '#/components/schemas/CustomerSetLastContact200Response/allOf/1/properties/data/items/properties/lastContactDate'
              binId:
                $ref: '#/components/schemas/HelixId'
              cardCarrierMessage:
                type: string
                description: 'Identifier used uniquely by various card production facilities for mapping card configurations.

                  '
              cardDesignIdentificationNumber:
                type: string
                description: 'Identifier used uniquely by various card production facilities for mapping card configurations.

                  '
              cardHolderCustomerId:
                $ref: '#/components/schemas/HelixId'
              cardId:
                $ref: '#/components/schemas/HelixId'
              cardNumberMasked:
                type: string
              cardVendorUniqueData:
                type: string
                description: 'Identifier used uniquely by various card production facilities for mapping card configurations.

                  '
              createdDate:
                $ref: '#/components/schemas/CustomerSetLastContact200Response/allOf/1/properties/data/items/properties/lastContactDate'
              customerId:
                $ref: '#/components/schemas/HelixId'
              deniedDate:
                $ref: '#/components/schemas/CustomerSetLastContact200Response/allOf/1/properties/data/items/properties/lastContactDate'
              digitalWalletTokens:
                type: array
                items:
                  type: object
                  properties:
                    device:
                      type: object
                      properties:
                        deviceId:
                          type: string
                        deviceIpAddress:
                          type: string
                        deviceLanguageCode:
                          type: string
                        deviceLocation:
                          type: string
                        deviceName:
                          type: string
                        deviceNumber:
                          type: string
                        deviceType:
                          type: string
                          enum:
                          - Card
                          - MobilePhone
                          - Tablet
                          - Watch
                          - MobileDevice
                          - FashionAccessory
                          - HomeAppliance
                          - KeyFob
                          - MediaOrGamingDevice
                          - MobileDeviceAccessory
                          - PCOrLaptop
                          - Vehicle
                          - UnknownOther
                    isDeviceProvisioned:
                      type: boolean
                    panReferenceId:
                      type: string
                    token:
                      type: string
                    tokenReferenceId:
                      type: string
                    tokenRequestorId:
                      type: string
                      enum:
                      - '40010030273'
                      - '40010075001'
                      - '40010043095'
                      - '40010075338'
                    tokenRequestorName:
                      type: string
                      enum:
                      - ApplePay
                      - GooglePay
                      - SamsungPay
                      - VisaCheckout
                    tokenStatus:
                      type: string
                      enum:
                      - ActiveForPayment
                      - Initiated
                      - SuspendedTemporarily
                      - DeactivatedPermanently
                    tokenType:
                      type: string
                      enum:
                      - Card on file
                      - Secure element
                      - Cloud based payment/HCE
                      - E-Commerce Enabler
                    walletInformation:
                      type: object
                      properties:
                        panSource:
                          type: string
                          enum:
                          - KeyEntered
                          - OnFile
                          - MobileBankingApp
                        walletAccountId:
                          type: string
                        walletEmailAddressHashed:
                          type: string
                        walletProviderDeviceScore:
                          type: string
                        walletProviderReasonCodes:
                          type: string
                        walletProviderRiskAssessmentType:
                          type: string
                          enum:
                          - Approved
                          - ApprovedConditionally
                          - NotApproved
                        walletProviderRiskAssessmentVersion:
                          type: string
              expireMonth:
                $ref: '#/components/schemas/MonthProperty'
              expireYear:
                $ref: '#/components/schemas/YearProperty'
              expiredDate:
                $ref: '#/components/schemas/CustomerSetLastContact200Response/allOf/1/properties/data/items/properties/lastContactDate'
              firstName:
                type: string
              isDigitalOnly:
                type: boolean
              isDualIssuanceSinglePAN:
                type: boolean
              isPINSet:
                type: boolean
              lastModifiedDate:
                $ref: '#/components/schemas/CustomerSetLastContact200Response/allOf/1/properties/data/items/properties/lastContactDate'
              lastName:
                type: string
              lockReasonTypeCode:
                type: string
                enum:
                - UNK
                - STL
                - LST
                - FRD
                - DMG
                - ADM
                - TMP
                - PIN
              lockTypeCode:
                type: string
                enum:
                - UNL
                - CST
                - SYS
              middleName:
                type: string
              nameOnCard:
                type: string
              nickName:
                type: string
              photoImageId:
                type: string
                description: 'Identifier used uniquely by various card production facilities for mapping card configurations.

                  '
              preferredName:
                type: string
              primaryAccountId:
                $ref: '#/components/schemas/HelixId'
              qualifierCode:
                $ref: '#/components/schemas/CardQualifierCode'
              reissuedDate:
                $ref: '#/components/schemas/CustomerSetLastContact200Response/allOf/1/properties/data/items/properties/lastContactDate'
              renewalOverride:
                $ref: '#/components/schemas/RenewalOverride'
              renewalOverrideReason:
                type: string
              requestedDate:
                $ref: '#/components/schemas/CustomerSetLastContact200Response/allOf/1/properties/data/items/properties/lastContactDate'
              status:
                type: string
                enum:
                - Initiated
                - Pending
                - PendingVerification
                - Verified
                - Denied
                - Expired
                - Archived
                - Reissued
                - Hotlisted
                - ReissuedPendingVerification
                - AutoReissuedPendingVerification
              tag:
                $ref: '#/components/schemas/TagProperty'
              typeCode:
                type: string
                enum:
                - DBT
              vendorTypeCode:
                $ref: '#/components/schemas/CardVendorTypeCode'
              verifiedDate:
                $ref: '#/components/schemas/CustomerSetLastContact200Response/allOf/1/properties/data/items/properties/lastContactDate'
    CustomerSetLastContact200Response:
      allOf:
      - $ref: '#/components/schemas/CardArray200Response/allOf/0'
      - type: object
        properties:
          data:
            type: array
            items:
              type: object
              properties:
                customerId:
                  $ref: '#/components/schemas/HelixId'
                dormancyStatus:
                  type: string
                  enum:
                  - Active
                  - Inactive
                  - Dormant
                lastContactDate:
                  type: string
                  format: date-time
                  example: '2021-01-07T19:00:59.761-06:00'
                lastContactType:
                  $ref: '#/components/schemas/LastContactType'
    AccountLockReasonTypeCode:
      type: string
      enum:
      - UNK
      - FRD
      - ADM
      - TMP
      - FRZ
      - SUS
      - CO
      - RTN
      - REC
      - DED
      - DOR
      description: '- `UNK`: Unknown

        - `FRD`: Fraud investigation

        - `ADM`: Administrative

        - `TMP`: Temporary

        - `FRZ`: Freeze

        - `SUS`: Suspected fraud

        - `CO`: Credits only

        - `RTN`: Return risk

        - `REC`: Recovery

        - `DED`: Deceased

        - `DOR`: Dormant

        '
    AccountObject200Response:
      allOf:
      - $ref: '#/components/schemas/CardArray200Response/allOf/0'
      - type: object
        properties:
          data:
            type: object
            properties:
              accessTypeCode:
                type: string
                enum:
                - FULL
                - AUTHSIGNER
                - RDONLY
                - NONE
              accountBalance:
                type: number
                format: decimal
              accountId:
                $ref: '#/components/schemas/HelixId'
              accountMinimumBalance:
                type: number
                format: decimal
              accountNumber:
                type: string
              accountNumberMasked:
                type: string
              availableBalance:
                type: number
                format: decimal
              balanceLastModifiedDate:
                $ref: '#/components/schemas/CustomerSetLastContact200Response/allOf/1/properties/data/items/properties/lastContactDate'
              category:
                type: string
                maxLength: 50
              closedAmount:
                type: number
                format: decimal
              closedDate:
                $ref: '#/components/schemas/CustomerSetLastContact200Response/allOf/1/properties/data/items/properties/lastContactDate'
              closedReason:
                $ref: '#/components/schemas/CloseReason'
              closedReasonNotes:
                $ref: '#/components/schemas/CloseReasonNotes'
              createdDate:
                $ref: '#/components/schemas/CustomerSetLastContact200Response/allOf/1/properties/data/items/properties/lastContactDate'
              customField1:
                type: string
                maxLength: 50
              customField2:
                type: string
                maxLength: 50
              customField3:
                type: string
                maxLength: 50
              customField4:
                type: string
                maxLength: 50
              customField5:
                type: string
                maxLength: 50
              customerId:
                $ref: '#/components/schemas/HelixId'
              customerPriority:
                $ref: '#/components/schemas/HelixId'
              externalProgramTag:
                type: string
              firstDepositDate:
                $ref: '#/components/schemas/CustomerSetLastContact200Response/allOf/1/properties/data/items/properties/lastContactDate'
              globalAccountAccessEnabled:
                type: boolean
              interestTransferFkId:
                $ref: '#/components/schemas/HelixId'
              isCloseable:
                type: boolean
              isJointAccount:
                type: boolean
              isLocked:
                type: boolean
              isPrimary:
                type: boolean
              isPrimaryCustomer:
                type: boolean
              lastModifiedDate:
