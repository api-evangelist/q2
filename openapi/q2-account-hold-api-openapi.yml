              legalName1:
                $ref: '#/components/schemas/LegalName'
              legalName2:
                $ref: '#/components/schemas/LegalName'
              lockReasonTypeCode:
                $ref: '#/components/schemas/AccountLockReasonTypeCode'
              lockTypeCode:
                $ref: '#/components/schemas/CardObject200Response/allOf/1/properties/data/properties/lockTypeCode'
              accountLockClassificationCode:
                type:
                - string
                - 'null'
                maxLength: 10
                description: Program-configured classification code associated with the account lock.
              accountLockClassificationCodeDescription:
                type:
                - string
                - 'null'
                description: Human-readable description of the accountLockClassificationCode.
              maturityTypeCode:
                type: string
              name:
                type: string
              pendingBalance:
                type: number
                format: decimal
              primaryCustomerId:
                $ref: '#/components/schemas/HelixId'
              productId:
                $ref: '#/components/schemas/HelixId'
              recurringContributionAmount:
                type: number
                format: decimal
              recurringContributionEndDate:
                $ref: '#/components/schemas/CustomerSetLastContact200Response/allOf/1/properties/data/items/properties/lastContactDate'
              recurringContributionFromExternalAccountId:
                $ref: '#/components/schemas/HelixId'
              recurringContributionNextDate:
                $ref: '#/components/schemas/CustomerSetLastContact200Response/allOf/1/properties/data/items/properties/lastContactDate'
              recurringContributionStartDate:
                $ref: '#/components/schemas/DateTimeProperty'
              recurringContributionType:
                $ref: '#/components/schemas/RecurringContributionType'
              regDWithdrawalCount:
                type: integer
                format: int32
                minimum: 0
              routingNumber:
                type: string
              routingNumberMasked:
                type: string
              sourceLinks:
                type: array
                items:
                  type: object
                  deprecated: true
                  properties:
                    creditSetting:
                      type: number
                      format: decimal
                    customerId:
                      $ref: '#/components/schemas/HelixId'
                    debitSetting:
                      type: number
                      format: decimal
                    isCreditAutoTransferEnabled:
                      type: boolean
                    isDebitAutoTransferEnabled:
                      type: boolean
                    linkOptionTypeCode:
                      type: string
                      enum:
                      - OVRPRTAMT
                      - OVRPRTMLT
                      - OVRSECPCT
                      - OVRSECFIX
                      description: '- `OVRPRTAMT`: Auto-transfer exact amount of withdrawal

                        - `OVRPRTMLT`: Auto-transfer to the nearest multiple of `debitSetting` to cover withdrawal amount

                        - `OVRSECPCT`: Allow lending up to `debitSetting` percentage of security account funds

                        - `OVRSECFIX`: Allow lending up to fixed amount of `debitSetting`

                        '
                    linkTypeCode:
                      type: string
                      enum:
                      - OVRPRT
                      - OVRSEC
                      description: '- `OVRPRT`: Overdraft protention

                        - `OVRSEC`: Overdraft security

                        '
                    sourceAccountId:
                      $ref: '#/components/schemas/HelixId'
                    targetAccountId:
                      $ref: '#/components/schemas/HelixId'
                deprecated: true
              status:
                type: string
                enum:
                - Open
                - Closed
                - PendingOpen
                - PendingClosed
              subCategory:
                type: string
              tag:
                $ref: '#/components/schemas/TagProperty'
              targetAmount:
                type: number
                format: decimal
              targetDate:
                $ref: '#/components/schemas/DateTimeProperty'
              targetLinks:
                type: array
                items:
                  $ref: '#/components/schemas/AccountObject200Response/allOf/1/properties/data/properties/sourceLinks/items'
                deprecated: true
              targetMetDate:
                $ref: '#/components/schemas/CustomerSetLastContact200Response/allOf/1/properties/data/items/properties/lastContactDate'
              targetMetPercent:
                type: number
                format: decimal
              totalCustomers:
                $ref: '#/components/schemas/HelixId'
              type:
                type: string
                enum:
                - Checking
                - Savings
                - ForBenefitOf
                - Prepaid
                - Time Deposit
                - Business Checking
                - Business Savings
    CloseReasonNotes:
      type: string
      maxLength: 255
      description: Required if `closeReason` is `Other`
    CloseReason:
      type: string
      enum:
      - Fraud
      - Never funded
      - BSA reasons
      - Relationship ended
      - Deceased
      - Other
      - Consolidating Bank Accounts
      - re-CIP
      - Risk-Related
      - Member Requested
      - Negative Balance (Reopen Eligible)
      - Negative Balance (Reopen Ineligible)
      - ID Theft
      - Account Take Over
      - Dormant
      description: 'The following values are not enabled by default and must be enabled by Q2: `Consolidating Bank Accounts`, `re-CIP`, `Risk-Related`, `Member Requested`, `Negative Balance (Reopen Eligible)`, `Negative Balance (Reopen Ineligible)`, `ID Theft`, `Account Take Over`, `Dormant`

        '
    TagProperty:
      type: string
      maxLength: 50
    RecurringContributionType:
      type: string
      enum:
      - None
      - BiWeekly
      - Monthly
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
