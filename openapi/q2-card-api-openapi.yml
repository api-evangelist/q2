    post:
      tags:
      - Card
      summary: Reprioritize an account on a card
      description: Update the order in which accounts are displayed when a card is used at an ATM. For more details see Account Reprioritization Scenarios. The `customerId` attempting to reprioritize the account must have an `accessTypeCode` of `FULL` or `ACCT`.
      externalDocs:
        url: https://docs.helix.q2.com/reference/cardreprioritizeaccount
      operationId: cardReprioritizeAccount
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - customerId
              - cardId
              - accountId
              - cardPriority
              properties:
                customerId:
                  $ref: '#/components/schemas/HelixId'
                cardId:
                  $ref: '#/components/schemas/HelixId'
                accountId:
                  $ref: '#/components/schemas/HelixId'
                cardPriority:
                  allOf:
                  - description: "The new priority to give the `accountId`. Must be between `1` and `4` inclusive. Other accounts tied to the card in the same `productCategoryType` as the `accountId` will be reprioritized accordingly. \n\n**Note**: If the account in the priority 1 slot is changing AND that account is the `primaryAccountId` for that card, the account that is moved into the priority 1 slot will be assigned as the new `primaryAccountId`.\n"
                  - $ref: '#/components/schemas/CardPriority'
      responses:
