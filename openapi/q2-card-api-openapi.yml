  /card/verify:
    post:
      tags:
      - Card
      summary: Verify a card
      description: Verify a customer has received a physical card and activate it for use.
      externalDocs:
        url: https://docs.helix.q2.com/reference/cardverify
      operationId: cardVerify
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - customerId
              - cardId
              - birthDate
              - cardNumberMasked
              properties:
                customerId:
                  $ref: '#/paths/~1card~1verify/post/requestBody/content/application~1json/schema/properties/cardId'
                cardId:
                  type: integer
                  format: int32
                  minimum: 1
                birthDate:
                  type: string
                  format: date
                  description: The birthday of the `customerId` who created the card. Format is YYYY-MM-DD.
                cardNumberMasked:
                  type: string
                  description: The last four digits of the card number. In sandbox this value is always `1111`
      responses:
        '200':
          description: An <a href="https://docs.helix.q2.com/reference/response-format" target="_blank">envelope</a> whose data node is a <a href="https://docs.helix.q2.com/docs/card" target="_blank">card</a> object with `status=Verified`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardObject200Response'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          $ref: '#/paths/~1card~1verify/post/requestBody/content/application~1json/schema/properties/cardId'
                        message:
                          type: string
                  requestId:
                    type: string
                    example: b75a96f8-2fbc-4b14-9ba4-7b06aa431c9d
                  status:
                    type: integer
                    enum:
                    - 400
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: integer
                          enum:
                          - 50401
                        message:
                          type: string
                          example: User is not authorized
                  requestId:
                    type: string
                    enum:
                    - 00000000-0000-0000-0000-000000000000
                  status:
                    type: integer
                    enum:
                    - 401
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: integer
                          enum:
                          - 50404
                        message:
                          type: string
                          example: The requested resource 'https://sandbox-api.helix.q2.com/customer/updat/805592' was not found
                  requestId:
                    type: string
                    example: b75a96f8-2fbc-4b14-9ba4-7b06aa431c9d
                  status:
                    type: integer
                    enum:
                    - 404
        '405':
          description: HTTP Method Not Allowed
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: integer
                          enum:
                          - 50405
                        message:
                          type: string
                          example: The HTTP method 'POST' for requested resource 'https://sandbox-api.helix.q2.com/customer/get/805594' is not allowed.
                  requestId:
                    type: string
                    enum:
                    - 00000000-0000-0000-0000-000000000000
                  status:
                    type: integer
                    enum:
                    - 405
        '429':
          description: Rate Limit Exceeded
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: integer
                          enum:
                          - 50429
                        message:
                          type: string
                          example: Rate limit exceeded
                  requestId:
                    type: string
                    enum:
                    - 00000000-0000-0000-0000-000000000000
                  status:
                    type: integer
                    enum:
                    - 429
