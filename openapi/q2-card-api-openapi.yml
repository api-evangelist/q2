      description: 'Override the base Helix card renewal eligibility criteria during a card''s renewal period. A card''s renewal period begins on the first day of the prior month of the card''s expiration and ends the day before the client''s scheduled monthly renewal job. Card must be in an eligible `status` listed below to perform a card renewal override: `Verified`, `Reissued`, `PendingVerification`, `ReissuedPendingVerification`, `DigitalActivePhysicalInitiated`, `DigitalActivePhysicalPending`.'
