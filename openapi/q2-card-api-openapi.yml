openapi: 3.2.0
info:
  title: Helix Card API
  version: 3.0.0
  description: Helix Public API (no customer KYC/IDV). **This spec covers all of Helix 3.x and is subject to change at any time.**
servers:
- url: https://sandbox-api.helix.q2.com
  description: Sandbox server
- url: https://api.helix.q2.com
  description: Production server
security:
- basicAuth: []
tags:
- name: Card
  description: Endpoints for the card object
paths:
  /card/addAccount:
    post:
      tags:
      - Card
      summary: Add an account to a card
      description: Add an account to a card. Can be reversed by calling /card/removeAccount. The `customerId` attempting to add the account must have an `accessTypeCode` of `FULL` to that account and the customer itself must have an `accessTypeCode` of `FULL` or `ACCT`.
      externalDocs:
        url: https://docs.helix.q2.com/reference/cardaddaccount
      operationId: cardAddAccount
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - customerId
              - cardId
              - accountId
              - cardPriority
              properties:
                customerId:
                  $ref: '#/components/schemas/HelixId'
                cardId:
                  $ref: '#/components/schemas/HelixId'
                accountId:
                  $ref: '#/components/schemas/HelixId'
                cardPriority:
                  allOf:
                  - description: Priority the `accountId` will have. Must be between `1` and `4` inclusive. If this matches the priority of an existing account, that account's priority will be slid down one slot (as will all other lower priority accounts as needed)
                  - type: integer
                    format: int32
                    minimum: 1
                    maximum: 4
      responses:
        '200':
          description: An <a href="https://docs.helix.q2.com/reference/response-format" target="_blank">envelope</a> whose data node is a <a href="https://docs.helix.q2.com/docs/card" target="_blank">card</a> object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardObject200Response'
        '400':
          $ref: '#/paths/~1card~1lock/post/responses/400'
        '401':
          $ref: '#/paths/~1card~1lock/post/responses/401'
        '404':
          $ref: '#/paths/~1card~1lock/post/responses/404'
        '405':
          $ref: '#/paths/~1card~1lock/post/responses/405'
        '429':
          $ref: '#/paths/~1card~1lock/post/responses/429'
  /card/archive:
    post:
      tags:
      - Card
      summary: Archive a card
      description: Archive a card by the Helix-assigned `cardId`.
      operationId: cardArchive
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - customerId
              - cardId
              properties:
                customerId:
                  $ref: '#/paths/~1card~1verify/post/requestBody/content/application~1json/schema/properties/cardId'
                cardId:
                  $ref: '#/paths/~1card~1verify/post/requestBody/content/application~1json/schema/properties/cardId'
      responses:
        '200':
          description: An <a href="https://docs.helix.q2.com/reference/response-format" target="_blank">envelope</a> whose data node is a <a href="https://docs.helix.q2.com/docs/card" target="_blank">card</a> object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardArchive200Response'
        '400':
          $ref: '#/paths/~1card~1verify/post/responses/400'
        '401':
          $ref: '#/paths/~1card~1verify/post/responses/401'
        '404':
          $ref: '#/paths/~1card~1verify/post/responses/404'
        '405':
          $ref: '#/paths/~1card~1verify/post/responses/405'
        '429':
          $ref: '#/paths/~1card~1verify/post/responses/429'
  /card/createDigital:
    post:
      tags:
      - Card
      summary: Create a digital card
      description: Create a new card in `Verified` status that is instantly available for use in mobile wallets. Cards created through this endpoint will have `isDigitalOnly` property set to `true` whenever retrieved via the `/card/get` or `/card/list` endpoints. This type of card will not have a physical card shipped to the customer. See card object definition for parameter details.
      externalDocs:
        url: https://docs.helix.q2.com/reference/cardcreatedigital
      operationId: cardCreateDigital
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - customerId
              - cardHolderCustomerId
              - vendorTypeCode
              - primaryAccountId
              - firstName
              - lastName
              - nickName
              properties:
                customerId:
                  $ref: '#/components/schemas/HelixId'
                cardHolderCustomerId:
                  $ref: '#/components/schemas/HelixId'
                vendorTypeCode:
                  $ref: '#/components/schemas/CardVendorTypeCode'
                typeCode:
                  $ref: '#/components/schemas/CardTypeCode'
                primaryAccountId:
                  $ref: '#/components/schemas/HelixId'
                firstName:
                  type: string
                  maxLength: 64
                middleName:
                  type: string
                  maxLength: 64
                lastName:
                  type: string
                  maxLength: 128
                nickName:
                  type: string
                  maxLength: 50
                tag:
                  $ref: '#/components/schemas/TagProperty'
                qualifierCode:
                  $ref: '#/components/schemas/CardQualifierCode'
                binId:
                  $ref: '#/components/schemas/HelixId'
                requestingCustomerId:
                  allOf:
                  - description: The helix-assigned unique ID for the customer requesting to create a new virtual card for a business cardholder
                  - $ref: '#/components/schemas/HelixId'
      responses:
        '200':
          description: An <a href="https://docs.helix.q2.com/reference/response-format" target="_blank">envelope</a> whose data node is a <a href="https://docs.helix.q2.com/docs/card" target="_blank">card</a> object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardCreateDigital200Response'
        '400':
          $ref: '#/paths/~1card~1lock/post/responses/400'
        '401':
          $ref: '#/paths/~1card~1lock/post/responses/401'
        '404':
          $ref: '#/paths/~1card~1lock/post/responses/404'
        '405':
          $ref: '#/paths/~1card~1lock/post/responses/405'
        '429':
          $ref: '#/paths/~1card~1lock/post/responses/429'
  /card/get/{customerId}/{cardId}:
    get:
      tags:
      - Card
      summary: Get a card
      description: Retrieve card information by the given `customerId` and `cardId`.
      externalDocs:
        url: https://docs.helix.q2.com/reference/cardget
      operationId: cardGet
      parameters:
      - $ref: '#/components/parameters/CustomerIdPath'
      - name: cardId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/HelixId'
      responses:
        '200':
          description: A <a href="https://docs.helix.q2.com/docs/card" target="_blank">card</a> object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardObject200Response'
        '400':
          $ref: '#/paths/~1card~1lock/post/responses/400'
        '401':
          $ref: '#/paths/~1card~1lock/post/responses/401'
        '404':
          $ref: '#/paths/~1card~1lock/post/responses/404'
        '405':
          $ref: '#/paths/~1card~1lock/post/responses/405'
        '429':
          $ref: '#/paths/~1card~1lock/post/responses/429'
  /card/getByTag/{customerId}/{tag}:
    get:
      tags:
      - Card
      summary: Get a card via tag
      description: Retrieve card information by the given `customerId` and `tag`.
      externalDocs:
        url: https://docs.helix.q2.com/reference/cardgetbytag
      operationId: cardGetByTag
      parameters:
      - $ref: '#/paths/~1card~1list~1{customerId}/get/parameters/0'
      - name: tag
        in: path
        required: true
        schema:
          $ref: '#/paths/~1card~1initiate/post/requestBody/content/application~1json/schema/properties/tag'
      responses:
        '200':
          description: An <a href="https://docs.helix.q2.com/reference/response-format" target="_blank">envelope</a> whose data node is a <a href="https://docs.helix.q2.com/docs/card" target="_blank">card</a> object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardObject200Response'
        '400':
          $ref: '#/paths/~1card~1verify/post/responses/400'
        '401':
          $ref: '#/paths/~1card~1verify/post/responses/401'
        '404':
          $ref: '#/paths/~1card~1verify/post/responses/404'
        '405':
          $ref: '#/paths/~1card~1verify/post/responses/405'
        '429':
          $ref: '#/paths/~1card~1verify/post/responses/429'
  /card/hotlist:
    post:
      tags:
      - Card
      summary: Hotlist (permanently lock) a card
      description: Permanently locks a card and sets `lockTypeCode=CST`.
      externalDocs:
        url: https://docs.helix.q2.com/reference/cardhotlist
      operationId: cardHotlist
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - customerId
              - cardId
              - lockReasonTypeCode
              properties:
                customerId:
                  $ref: '#/paths/~1card~1verify/post/requestBody/content/application~1json/schema/properties/cardId'
                cardId:
                  $ref: '#/paths/~1card~1verify/post/requestBody/content/application~1json/schema/properties/cardId'
                lockReasonTypeCode:
                  type: string
                  enum:
                  - ATL
                  - DEC
                  - DES
                  - ESC
                  - FRD
                  - LST
                  - STA
                  - STL
                  - UPG
                  - VOD
                  description: '- `ACL`: AccountClosure

                    - `DEC`: Deceased

                    - `DES`: Destroyed

                    - `ESC`: Escheatment

                    - `FRD`: Fraud

                    - `LST`: Lost

                    - `STA`: Stale

                    - `STL`: Stolen

                    - `UPG`: DueToUpgrade

                    - `VOD`: Voided

                    '
      responses:
        '200':
          description: An <a href="https://docs.helix.q2.com/reference/response-format" target="_blank">envelope</a> whose data node is a <a href="https://docs.helix.q2.com/docs/card" target="_blank">card</a> object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardObject200Response'
        '400':
          $ref: '#/paths/~1card~1verify/post/responses/400'
        '401':
          $ref: '#/paths/~1card~1verify/post/responses/401'
        '404':
          $ref: '#/paths/~1card~1verify/post/responses/404'
        '405':
          $ref: '#/paths/~1card~1verify/post/responses/405'
        '429':
          $ref: '#/paths/~1card~1verify/post/responses/429'
  /card/initiate:
    post:
      tags:
      - Card
      summary: Initiate a card
      description: Initiate a request to create a new card and mail it to a customer. See card object definition for parameter details.
      externalDocs:
        url: https://docs.helix.q2.com/reference/cardinitiate
      operationId: cardInitiate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - customerId
              - cardHolderCustomerId
              - vendorTypeCode
              - primaryAccountId
              - firstName
              - lastName
              - nickName
              properties:
                customerId:
                  $ref: '#/paths/~1card~1verify/post/requestBody/content/application~1json/schema/properties/cardId'
                cardHolderCustomerId:
                  $ref: '#/paths/~1card~1verify/post/requestBody/content/application~1json/schema/properties/cardId'
                vendorTypeCode:
                  type: string
                  enum:
                  - VS
                  - MC
                  description: '- `VS`: Visa

                    - `MC`: Mastercard

                    '
                typeCode:
                  type: string
                  enum:
                  - DBT
                  - GFT
                  - GPR
                  description: '- `DBT`: Debit

                    - `GFT`: Gift

                    - `GPR`: General Purpose Prepaid

                    '
                primaryAccountId:
                  $ref: '#/paths/~1card~1verify/post/requestBody/content/application~1json/schema/properties/cardId'
                firstName:
                  type: string
                  maxLength: 64
                middleName:
                  type: string
                  maxLength: 64
                lastName:
                  type: string
                  maxLength: 128
                nickName:
                  type: string
                  maxLength: 50
                tag:
                  type: string
                  maxLength: 50
                qualifierCode:
                  $ref: '#/paths/~1card~1reissue/post/requestBody/content/application~1json/schema/properties/qualifierCode'
                binId:
                  $ref: '#/paths/~1card~1verify/post/requestBody/content/application~1json/schema/properties/cardId'
                newPin:
                  type: string
                  format: byte
                  description: For Shazam programs only. Visa DPS programs must call the [/card/resetPin](https://docs.helix.q2.com/reference/cardresetpin) endpoint separately. For physical-only cards, /card/resetPin can be called once the card moves from `status=Initiated` to `status=Verified`. For dual-issuance cards (physical and digital), /card/resetPin can be called once the card moves from `status=Initiated` to `status=DigitalActivePhysicalPending`.
                isCreateDualIssuanceSinglePAN:
                  type: boolean
                  default: false
                  description: '`true` if this card will be an instant-issued debit card ready for eCommerce activity that can also be provisioned to a digital wallet. If `true` the card will be created with a `status` of `DitalActivePhysicalInitiated` which will shortly change to `DigitalActivePhysicalPending`. When card is in `DigitalActivePhysicalInitiated` or `DigitalActivePhysicalPending` it can be provisioned into a digital wallet via [/card/provision/applePay](https://docs.helix.q2.com/reference/cardprovisionapplepay) or [/card/provision/googlePay](https://docs.helix.q2.com/reference/cardprovisiongooglepay). When card is in `DigitalActivePhysicalPending` it will need to be verified via [/card/verify](https://docs.helix.q2.com/reference/cardverify) before a customer can use the physical card.

                    '
                isPhysicalCardOrdered:
                  type: boolean
                  default: true
                  description: "`true` to order a physical card, `false` to waive. \n"
                requestingCustomerId:
                  allOf:
                  - description: The Helix-assigned unique ID for the customer requesting to create a new card for a business cardholder
                  - $ref: '#/paths/~1card~1verify/post/requestBody/content/application~1json/schema/properties/cardId'
                cardCarrierMessage:
                  type: string
                  maxLength: 6
                  description: Identifier used uniquely by various card production facilities for mapping card configurations
                cardDesignIdentificationNumber:
                  type: string
                  maxLength: 16
                  description: Identifier used uniquely by various card production facilities for mapping card configurations
                cardVendorUniqueData:
                  type: string
                  maxLength: 50
                  description: Identifier used uniquely by various card production facilities for mapping card configurations
                photoImageId:
                  type: string
                  maxLength: 18
                  description: Identifier used uniquely by various card production facilities for mapping card configurations
                expediteCard:
                  type: boolean
                  description: Card order indicator to have physical card expedited by the card print vendor.
                bypassExpediteCardFee:
                  type: boolean
                  description: Identifier to allow program to waive any program fee for expedited card request.
                waiveFee:
                  type: boolean
                  description: When true, the applicable card creation fee is waived rather than charged to the customer. When omitted or false, existing fee behavior is unchanged.
      responses:
        '200':
          description: An <a href="https://docs.helix.q2.com/reference/response-format" target="_blank">envelope</a> whose data node is a <a href="https://docs.helix.q2.com/docs/card" target="_blank">card</a> object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardObject200Response'
        '400':
          $ref: '#/paths/~1card~1verify/post/responses/400'
        '401':
          $ref: '#/paths/~1card~1verify/post/responses/401'
        '404':
          $ref: '#/paths/~1card~1verify/post/responses/404'
        '405':
          $ref: '#/paths/~1card~1verify/post/responses/405'
        '429':
          $ref: '#/paths/~1card~1verify/post/responses/429'
  /card/list/{customerId}:
    get:
      tags:
      - Card
      summary: List cards
      description: Retrieve all card information for the given `customerId`.
      externalDocs:
        url: https://docs.helix.q2.com/reference/cardlist
      operationId: cardList
      parameters:
      - name: customerId
        in: path
        required: true
        schema:
          $ref: '#/paths/~1card~1verify/post/requestBody/content/application~1json/schema/properties/cardId'
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum:
          - Default
          - All
          - Archived
          - Denied
          - Expired
          - Hotlisted
          - Initiated
          - Pending
          - PendingVerification
          - Reissued
          - ReissuedPendingVerification
          - AutoReissuedPendingVerification
          - Verified
          default: Default
          description: Specify a single card status to be returned. Only one value can be passed. `Default` includes `Archived`, `Denied`, `Expired`, `Hotlisted`, `Initiated`, `Pending`, `PendingVerification`, `Reissued`, `ReissuedPendingVerification`, `AutoReissuedPendingVerification` and `Verified`
      responses:
        '200':
          description: An array of <a href="https://docs.helix.q2.com/docs/card" target="_blank">card</a> objects
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardArray200Response'
        '400':
          $ref: '#/paths/~1card~1verify/post/responses/400'
        '401':
          $ref: '#/paths/~1card~1verify/post/responses/401'
        '404':
          $ref: '#/paths/~1card~1verify/post/responses/404'
        '405':
          $ref: '#/paths/~1card~1verify/post/responses/405'
        '429':
          $ref: '#/paths/~1card~1verify/post/responses/429'
  /card/lock:
    post:
      tags:
      - Card
      summary: Lock a card
      description: Lock a card. Most locks can be reversed by calling /card/unlock. Please check the /card/unlock documentation to see which lock scenarios can be subsequently unlocked. Will apply a `lockTypeCode` of `CST` on success and all card-based transactions will fail.
      externalDocs:
        url: https://docs.helix.q2.com/reference/cardlock
      operationId: cardLock
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - customerId
              - cardId
              - lockReasonTypeCode
              properties:
                customerId:
                  $ref: '#/components/schemas/HelixId'
                cardId:
                  $ref: '#/components/schemas/HelixId'
                lockReasonTypeCode:
                  type: string
                  enum:
                  - UNK
                  - FRD
                  - DMG
                  - TMP
                  description: '- `UNK`: Unknown

                    - `FRD`: Fraud

                    - `DMG`: Physical Damage

                    - `TMP`: Temporary

                    '
      responses:
        '200':
          description: An <a href="https://docs.helix.q2.com/reference/response-format" target="_blank">envelope</a> whose data node is a <a href="https://docs.helix.q2.com/docs/card" target="_blank">card</a> object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardObject200Response'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          $ref: '#/components/schemas/HelixId'
                        message:
                          type: string
                  requestId:
                    type: string
                    example: b75a96f8-2fbc-4b14-9ba4-7b06aa431c9d
                  status:
                    type: integer
                    enum:
                    - 400
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: integer
                          enum:
                          - 50401
                        message:
                          type: string
                          example: User is not authorized
                  requestId:
                    type: string
                    enum:
                    - 00000000-0000-0000-0000-000000000000
                  status:
                    type: integer
                    enum:
                    - 401
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: integer
                          enum:
                          - 50404
                        message:
                          type: string
                          example: The requested resource 'https://sandbox-api.helix.q2.com/customer/updat/805592' was not found
                  requestId:
                    type: string
                    example: b75a96f8-2fbc-4b14-9ba4-7b06aa431c9d
                  status:
                    type: integer
                    enum:
                    - 404
        '405':
          description: HTTP Method Not Allowed
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: integer
                          enum:
                          - 50405
                        message:
                          type: string
                          example: The HTTP method 'POST' for requested resource 'https://sandbox-api.helix.q2.com/customer/get/805594' is not allowed.
                  requestId:
                    type: string
                    enum:
                    - 00000000-0000-0000-0000-000000000000
                  status:
                    type: integer
                    enum:
                    - 405
        '429':
          description: Rate Limit Exceeded
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: integer
                          enum:
                          - 50429
                        message:
                          type: string
                          example: Rate limit exceeded
                  requestId:
                    type: string
                    enum:
                    - 00000000-0000-0000-0000-000000000000
                  status:
                    type: integer
                    enum:
                    - 429
  /card/orderPhysical:
    post:
      tags:
      - Card
      summary: Order a physical card
      description: Order a physical card for an existing digital card with single PAN dual issuance.
      externalDocs:
        url: https://docs.helix.q2.com/reference/cardorderphysical
      operationId: cardOrderPhysical
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - customerId
              - cardId
              properties:
                customerId:
                  $ref: '#/components/schemas/HelixId'
                cardId:
                  $ref: '#/components/schemas/HelixId'
                requestingCustomerId:
                  allOf:
                  - description: The helix-assigned unique ID for the customer requesting to create a physical card for a virtual card held by a business cardholder
                  - $ref: '#/components/schemas/HelixId'
                waiveFee:
                  type: boolean
                  description: When true, the applicable card creation fee is waived rather than charged to the customer. When omitted or false, existing fee behavior is unchanged.
      responses:
        '200':
          description: An <a href="https://docs.helix.q2.com/reference/response-format" target="_blank">envelope</a> whose data node is a <a href="https://docs.helix.q2.com/docs/card" target="_blank">card</a> object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardObject200Response'
        '400':
          $ref: '#/paths/~1card~1lock/post/responses/400'
        '401':
          $ref: '#/paths/~1card~1lock/post/responses/401'
        '404':
          $ref: '#/paths/~1card~1lock/post/responses/404'
        '405':
          $ref: '#/paths/~1card~1lock/post/responses/405'
        '429':
          $ref: '#/paths/~1card~1lock/post/responses/429'
  /card/reissue:
    post:
      tags:
      - Card
      summary: Reissue a card
      description: Reissue a card due to damage, loss, theft, fraud, compromise, name change, or renewal.
      externalDocs:
        url: https://docs.helix.q2.com/reference/cardreissue
      operationId: cardReissue
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - customerId
              - cardId
              - reissueReasonTypeCode
              properties:
                customerId:
                  $ref: '#/paths/~1card~1verify/post/requestBody/content/application~1json/schema/properties/cardId'
                cardId:
                  $ref: '#/paths/~1card~1verify/post/requestBody/content/application~1json/schema/properties/cardId'
                reissueReasonTypeCode:
                  type: string
                  enum:
                  - CMP
                  - DMG
                  - FRD
                  - LST
                  - NAM
                  - NCN
                  - REN
                  - RPL
                  - STL
                  description: '- `CMP`: Compromised

                    - `DMG`: Physical Damage

                    - `FRD`: Fraud

                    - `LST`: Lost

                    - `NAM`: Name Change

                    - `NCN`: Name Change with New PAN

                    - `REN`: Renewal

                    - `RPL`: Replacement

                    - `STL`: Stolen

                    ''

                    '
                newPin:
                  type: string
                  format: byte
                  description: See the `newPin` attribute on the <a href="https://docs.helix.q2.com/docs/card" target="_blank">card</a> object definition for details.
                qualifierCode:
                  type: string
                  maxLength: 3
                tag:
                  allOf:
                  - description: Tag to associate with the new cardId
                  - $ref: '#/paths/~1card~1initiate/post/requestBody/content/application~1json/schema/properties/tag'
                requestingCustomerId:
                  allOf:
                  - description: The helix-assigned unique ID for the customer requesting to reissue an existing card for a business cardholder
                  - $ref: '#/paths/~1card~1verify/post/requestBody/content/application~1json/schema/properties/cardId'
                expediteCard:
                  type: boolean
                  description: Set to `true` to request expedited physical-card delivery, when the program supports expedited card orders.
                byPassExpediteCardFee:
                  type: boolean
                  description: Set to `true` when the program, rather than the customer, should pay the expedited card fee.
                photoImageId:
                  type: string
                  maxLength: 18
                  description: Optional card-production identifier.
                cardDesignIdentificationNumber:
                  type: string
                  maxLength: 16
                  description: Optional card-production identifier.
                cardCarrierMessage:
                  type: string
                  maxLength: 6
                  description: Optional card-production identifier.
                cardVendorUniqueData:
                  type: string
                  maxLength: 50
                  description: Optional card-production identifier.
      responses:
        '200':
          description: An <a href="https://docs.helix.q2.com/reference/response-format" target="_blank">envelope</a> whose data node is a <a href="https://docs.helix.q2.com/docs/card" target="_blank">card</a> object. If card-maintenance fees were applied, data.fees contains one item for each applied fee. If no fees apply, no fee items are returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardObject200Response'
              examples:
                reissuedCardWithFee:
                  summary: Reissue succeeded with an applied fee
                  value:
                    errors: []
                    requestId: 1249a3bf-aca1-40dd-9fba-2a3193550c39
                    status: 200
                    data:
                      cardId: 123456
                      customerId: 789012
                      cardNumberMasked: '************1234'
                      status: PendingVerification
                      expireMonth: 4
                      expireYear: 2029
                      reissueReasonTypeCode: LST
                      reissuedDate: '2026-06-03T14:25:30.000-05:00'
                      fees:
                      - feeTypeId: 2200
                        feeDescription: Card Reissue Fee
                        productType: Checking
                        productTypeId: 1001
                        feeAmount: 5
                        feeToApplyId: 987654321
                      accounts:
                      - accountId: 456789
                        availableBalance: 95
                        balanceAfterFees: 90
                    throttle: null
        '400':
          description: Bad Request. Validation failed or the card cannot be reissued for the requested reason, card status, card type, fee state, or program configuration. See the endpoint Error Codes table.
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: integer
                          format: int64
                        message:
                          type: string
                  requestId:
                    type: string
                  status:
                    type: integer
                  data: {}
                  throttle: {}
              examples:
                invalidReissueReason:
                  summary: Invalid reissue reason
                  value:
                    errors:
                    - code: 153001
                      message: Invalid reissueReasonTypeCode 'ABC'. Please refer to API documentation for valid types.
                    requestId: 1249a3bf-aca1-40dd-9fba-2a3193550c39
                    status: 400
                    data: null
                    throttle: null
        '401':
          $ref: '#/paths/~1card~1verify/post/responses/401'
        '404':
          $ref: '#/paths/~1card~1verify/post/responses/404'
        '405':
          $ref: '#/paths/~1card~1verify/post/responses/405'
        '429':
          $ref: '#/paths/~1card~1verify/post/responses/429'
